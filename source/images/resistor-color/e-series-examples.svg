  <rect x="541" y="192" width="20" height="26" rx="4" fill="#26262a"/>
  <rect x="565" y="192" width="20" height="26" rx="4" fill="#26262a"/>
  <rect x="589" y="192" width="20" height="26" rx="4" fill="#26262a"/>
  <rect x="613" y="192" width="20" height="26" rx="4" fill="#7a4a21"/>
