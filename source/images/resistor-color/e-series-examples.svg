  <rect x="517" y="352" width="20" height="26" rx="4" fill="#7a4a21"/>
  <rect x="541" y="352" width="20" height="26" rx="4" fill="#26262a"/>
  <rect x="565" y="352" width="20" height="26" rx="4" fill="#26262a"/>
  <rect x="589" y="352" width="20" height="26" rx="4" fill="#d35400"/>
  <rect x="613" y="352" width="20" height="26" rx="4" fill="#7a4a21"/>
