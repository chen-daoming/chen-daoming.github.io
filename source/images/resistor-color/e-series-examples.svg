  <rect x="105" y="192" width="20" height="26" rx="4" fill="#7a4a21"/>
  <rect x="129" y="192" width="20" height="26" rx="4" fill="#26262a"/>
  <rect x="153" y="192" width="20" height="26" rx="4" fill="#7a4a21"/>
  <rect x="177" y="192" width="20" height="26" rx="4" fill="#d4a017"/>
  <text x="208" y="209" font-size="12.5" fill="#1f2d3d">棕黑棕金</text>

  <!-- 1kΩ: 棕黑红金 -->
