  <rect x="517" y="232" width="20" height="26" rx="4" fill="#7a4a21"/>
  <rect x="541" y="232" width="20" height="26" rx="4" fill="#26262a"/>
  <rect x="565" y="232" width="20" height="26" rx="4" fill="#26262a"/>
