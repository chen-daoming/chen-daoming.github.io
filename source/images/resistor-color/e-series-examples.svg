<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
<!-- 常用标称阻值 4 环 / 5 环色环对照表(E24 系列节选)。4 环误差=金±5%,5 环误差=棕±1%。 -->
<rect width="880" height="480" fill="#fbfcfd"/>
<text x="440" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">常用标称阻值 · 4 环 / 5 环色环对照(E24 节选)</text>
<text x="440" y="54" text-anchor="middle" font-size="12.5" fill="#8a97a5">4 环 = 两位有效数字 + 倍率 + 金(±5%)；5 环 = 三位有效数字 + 倍率 + 棕(±1%)</text>

<!-- ===== 表头 ===== -->
<rect x="40" y="70" width="388" height="24" rx="4" fill="#1f2d3d"/>
<text x="50" y="86" fill="#f0c878" font-weight="600" font-size="12">阻值</text>
<text x="112" y="86" fill="#f0c878" font-weight="600" font-size="12">4 环色环</text>
<text x="332" y="86" fill="#f0c878" font-weight="600" font-size="12" font-family="Consolas,monospace">读法</text>

<rect x="452" y="70" width="388" height="24" rx="4" fill="#1f2d3d"/>
<text x="462" y="86" fill="#f0c878" font-weight="600" font-size="12">阻值</text>
<text x="524" y="86" fill="#f0c878" font-weight="600" font-size="12">5 环色环</text>
<text x="744" y="86" fill="#f0c878" font-weight="600" font-size="12" font-family="Consolas,monospace">读法</text>

<!-- 色环小矩形: r(宽20高26 rx4) 左起点固定 -->
<g font-family="Consolas,monospace">
  <!-- ========== 左列 4 环 (色条 x 起 105, 4 块 x=105/129/153/177) ========== -->
