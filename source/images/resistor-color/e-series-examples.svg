  <rect x="517" y="272" width="20" height="26" rx="4" fill="#d9a85f"/>
  <rect x="541" y="272" width="20" height="26" rx="4" fill="#8e44ad"/>
  <rect x="565" y="272" width="20" height="26" rx="4" fill="#26262a"/>
  <rect x="589" y="272" width="20" height="26" rx="4" fill="#7a4a21"/>
  <rect x="613" y="272" width="20" height="26" rx="4" fill="#7a4a21"/>
