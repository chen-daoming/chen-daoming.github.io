  <rect x="105" y="352" width="20" height="26" rx="4" fill="#7a4a21"/>
  <rect x="129" y="352" width="20" height="26" rx="4" fill="#26262a"/>
  <rect x="153" y="352" width="20" height="26" rx="4" fill="#d9a85f"/>
