  <text x="50" y="127" font-size="13" fill="#1f2d3d">1 Ω</text>
  <rect x="105" y="112" width="20" height="26" rx="4" fill="#7a4a21"/>
  <rect x="129" y="112" width="20" height="26" rx="4" fill="#26262a"/>
  <rect x="153" y="112" width="20" height="26" rx="4" fill="#d4a017"/>
  <rect x="177" y="112" width="20" height="26" rx="4" fill="#d4a017"/>
  <text x="208" y="129" font-size="12.5" fill="#1f2d3d">棕黑金金</text>

  <!-- 10Ω: 棕黑黑金 -->
  <text x="50" y="167" font-size="13" fill="#1f2d3d">10 Ω</text>
  <rect x="105" y="152" width="20" height="26" rx="4" fill="#7a4a21"/>
  <rect x="129" y="152" width="20" height="26" rx="4" fill="#26262a"/>
  <rect x="153" y="152" width="20" height="26" rx="4" fill="#26262a"/>
  <rect x="177" y="152" width="20" height="26" rx="4" fill="#d4a017"/>
  <text x="208" y="169" font-size="12.5" fill="#1f2d3d">棕黑黑金</text>

  <!-- 100Ω: 棕黑棕金 -->
