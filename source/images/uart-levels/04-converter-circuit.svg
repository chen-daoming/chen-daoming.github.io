<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="480" fill="#fbfcfd"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">电平转换芯片应用电路：MAX3232 与 MAX485</text>

  <!-- ============ 左：MAX3232（TTL↔RS232） ============ -->
  <rect x="40" y="56" width="370" height="290" rx="10" fill="#ffffff" stroke="#d5dde5"/>
  <text x="225" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#27ae60">① MAX3232：TTL ↔ RS232</text>

  <!-- 芯片 -->
  <rect x="150" y="110" width="140" height="150" rx="8" fill="#eef2f8" stroke="#34549a" stroke-width="2.2"/>
  <text x="220" y="140" text-anchor="middle" font-size="12.5" font-weight="700" fill="#34549a">MAX3232</text>
  <text x="220" y="160" text-anchor="middle" font-size="10" fill="#8a97a5">3.3V 供电 · 双通道</text>
  <text x="220" y="242" text-anchor="middle" font-size="10" fill="#8a97a5">电荷泵 ±15kV ESD</text>

  <!-- 泵电容 -->
  <g font-size="10" fill="#5a6b7b">
    <rect x="120" y="118" width="24" height="16" rx="3" fill="#fdf1e7" stroke="#d35400" stroke-width="1.4"/>
    <text x="112" y="130" text-anchor="end">C1 0.1µF</text>
    <rect x="296" y="118" width="24" height="16" rx="3" fill="#fdf1e7" stroke="#d35400" stroke-width="1.4"/>
    <text x="326" y="130">C2 0.1µF</text>
    <rect x="296" y="150" width="24" height="16" rx="3" fill="#fdf1e7" stroke="#d35400" stroke-width="1.4"/>
    <text x="326" y="162">V+ 0.1µF</text>
    <rect x="296" y="182" width="24" height="16" rx="3" fill="#fdf1e7" stroke="#d35400" stroke-width="1.4"/>
    <text x="326" y="194">V− 0.1µF</text>
  </g>
  <line x1="144" y1="126" x2="152" y2="126" stroke="#8a97a5" stroke-width="1.4"/>
  <line x1="290" y1="126" x2="296" y2="126" stroke="#8a97a5" stroke-width="1.4"/>
  <line x1="290" y1="158" x2="296" y2="158" stroke="#8a97a5" stroke-width="1.4"/>
  <line x1="290" y1="190" x2="296" y2="190" stroke="#8a97a5" stroke-width="1.4"/>
  <text x="220" y="286" text-anchor="middle" font-size="10.5" fill="#d35400" font-weight="600">5 颗 0.1µF 泵电容一颗都不能省</text>

  <!-- 左右信号 -->
  <text x="70" y="130" text-anchor="middle" font-size="10.5" fill="#2980b9">TTL 侧</text>
  <text x="70" y="148" text-anchor="middle" font-size="10" fill="#5a6b7b" font-family="'Consolas',monospace">TTLout→T2IN</text>
  <text x="70" y="166" text-anchor="middle" font-size="10" fill="#5a6b7b" font-family="'Consolas',monospace">R1OUT→RXD</text>
  <line x1="86" y1="152" x2="150" y2="152" stroke="#2980b9" stroke-width="2"/>
  <text x="375" y="130" text-anchor="middle" font-size="10.5" fill="#27ae60">RS232 侧</text>
  <text x="375" y="148" text-anchor="middle" font-size="10" fill="#5a6b7b" font-family="'Consolas',monospace">T2OUT→DB9</text>
  <text x="375" y="166" text-anchor="middle" font-size="10" fill="#5a6b7b" font-family="'Consolas',monospace">DB9→R1IN</text>
  <line x1="290" y1="220" x2="356" y2="220" stroke="#27ae60" stroke-width="2"/>
  <text x="225" y="308" text-anchor="middle" font-size="10.5" fill="#5a6b7b">DB9 直连时 2、3 脚交叉，共地 5 脚必接</text>

  <!-- ============ 右：MAX485（TTL↔RS485） ============ -->
  <rect x="430" y="56" width="370" height="290" rx="10" fill="#ffffff" stroke="#d5dde5"/>
  <text x="615" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#d35400">② MAX485：TTL ↔ RS485（半双工）</text>

  <rect x="540" y="110" width="150" height="150" rx="8" fill="#eef2f8" stroke="#34549a" stroke-width="2.2"/>
  <text x="615" y="140" text-anchor="middle" font-size="12.5" font-weight="700" fill="#34549a">MAX485</text>
  <text x="615" y="160" text-anchor="middle" font-size="10" fill="#8a97a5">8 引脚 · 单工收发</text>
  <g font-size="10" fill="#1f2d3d">
    <text x="552" y="188" font-family="'Consolas',monospace">RO→RXD</text>
    <text x="552" y="206" font-family="'Consolas',monospace">DI←TXD</text>
    <text x="552" y="224" font-family="'Consolas',monospace">RE+DE→PA8</text>
  </g>

  <!-- A/B 输出 -->
  <line x1="690" y1="140" x2="742" y2="140" stroke="#2980b9" stroke-width="2.2"/>
  <text x="752" y="144" font-size="11" fill="#2980b9" font-weight="700" font-family="'Consolas',monospace">A</text>
  <line x1="690" y1="170" x2="742" y2="170" stroke="#e67e22" stroke-width="2.2"/>
  <text x="752" y="174" font-size="11" fill="#e67e22" font-weight="700" font-family="'Consolas',monospace">B</text>
  <text x="742" y="200" font-size="9.5" fill="#8a97a5">→ 端接 120Ω</text>

  <!-- 方向控制强调 -->
  <rect x="452" y="240" width="330" height="94" rx="8" fill="#fdf0ef" stroke="#e6b8b3"/>
  <text x="617" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">半双工方向控制三步（最容易翻车）</text>
  <g font-size="10.5" fill="#1f2d3d">
    <text x="470" y="288">1. 发送前置 DE=1、RE=1（同脚可并联一个 GPIO）</text>
    <text x="470" y="308">2. 发送完成后必须等 UART TC 标志，再拉低 DE</text>
    <text x="470" y="328">3. 提前拉低 = 最后一字节被截断，从机 CRC 报错</text>
  </g>

  <!-- 底部选型 -->
  <rect x="40" y="372" width="760" height="80" rx="10" fill="#eaf2fb"/>
  <g font-size="11.5" fill="#1f2d3d">
    <text x="60" y="396" font-weight="700">芯片速配：</text>
    <text x="60" y="418">3.3V 系统 → MAX3232 / SP3232（RS232），MAX485 仅 5V（3.3V 用 MAX3485 / SP3485）；</text>
    <text x="60" y="438">隔离场景 → ADM2483 / ISO3082（磁耦隔离），工业现场加 TVS（SMBJ6.8CA）于 A/B 对地。</text>
  </g>
</svg>
