<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="480" fill="#fbfcfd"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">RS485 总线拓扑：端接、偏置与方向控制</text>

  <!-- 总线主干 -->
  <line x1="90" y1="150" x2="730" y2="150" stroke="#1f2d3d" stroke-width="2.4"/>
  <line x1="90" y1="176" x2="730" y2="176" stroke="#1f2d3d" stroke-width="2.4"/>
  <text x="410" y="200" text-anchor="middle" font-size="10.5" fill="#8a6d2f">双绞线：A 在上、B 在下，全长平行无支线分支（星形/树形是禁忌）</text>

  <!-- 头端 120Ω 端接 + 偏置 -->
  <line x1="90" y1="150" x2="90" y2="188" stroke="#1f2d3d" stroke-width="1.8"/>
  <line x1="90" y1="188" x2="120" y2="188" stroke="#1f2d3d" stroke-width="1.8"/>
  <rect x="120" y="178" width="34" height="20" rx="3" fill="#fdf1e7" stroke="#d35400" stroke-width="1.6"/>
  <text x="137" y="192" text-anchor="middle" font-size="9.5" fill="#d35400">120Ω</text>
  <line x1="154" y1="188" x2="186" y2="188" stroke="#1f2d3d" stroke-width="1.8"/>
  <line x1="186" y1="188" x2="186" y2="176" stroke="#1f2d3d" stroke-width="1.8"/>
  <line x1="90" y1="176" x2="90" y2="212" stroke="#1f2d3d" stroke-width="1.8"/>
  <line x1="90" y1="212" x2="120" y2="212" stroke="#1f2d3d" stroke-width="1.8"/>
  <rect x="120" y="202" width="34" height="20" rx="3" fill="#fdf1e7" stroke="#d35400" stroke-width="1.6"/>
  <text x="137" y="216" text-anchor="middle" font-size="9.5" fill="#d35400">120Ω</text>
  <line x1="154" y1="212" x2="186" y2="212" stroke="#1f2d3d" stroke-width="1.8"/>
  <line x1="186" y1="212" x2="186" y2="176" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="90" y="248" text-anchor="middle" font-size="10.5" fill="#d35400">头端：120Ω×2 端接</text>
  <text x="90" y="264" text-anchor="middle" font-size="10" fill="#8a97a5">吸收反射（短线可省）</text>

  <!-- 尾端 120Ω -->
  <line x1="730" y1="150" x2="730" y2="188" stroke="#1f2d3d" stroke-width="1.8"/>
  <line x1="700" y1="188" x2="760" y2="188" stroke="#1f2d3d" stroke-width="1.8"/>
  <rect x="676" y="178" width="34" height="20" rx="3" fill="#fdf1e7" stroke="#d35400" stroke-width="1.6" transform="translate(24 0)"/>
  <text x="730" y="192" text-anchor="middle" font-size="9.5" fill="#d35400">120Ω</text>
  <line x1="730" y1="176" x2="730" y2="212" stroke="#1f2d3d" stroke-width="1.8"/>
  <line x1="700" y1="212" x2="760" y2="212" stroke="#1f2d3d" stroke-width="1.8"/>
  <rect x="676" y="202" width="34" height="20" rx="3" fill="#fdf1e7" stroke="#d35400" stroke-width="1.6" transform="translate(24 0)"/>
  <text x="730" y="240" text-anchor="middle" font-size="10.5" fill="#d35400">尾端：120Ω×2 端接</text>

  <!-- 节点（挂总线） -->
  <g>
    <rect x="230" y="280" width="120" height="110" rx="8" fill="#eaf2fb" stroke="#2980b9" stroke-width="2"/>
    <text x="290" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#2980b9">节点 1（主机）</text>
    <text x="290" y="326" text-anchor="middle" font-size="10.5" fill="#1f2d3d" font-family="'Consolas',monospace">STM32</text>
    <text x="290" y="346" text-anchor="middle" font-size="10" fill="#5a6b7b">DE/RE 并联 → PA8</text>
    <text x="290" y="366" text-anchor="middle" font-size="10" fill="#5a6b7b">半双工：发时拉高 DE</text>
    <line x1="270" y1="280" x2="270" y2="150" stroke="#2980b9" stroke-width="1.8"/>
    <line x1="310" y1="280" x2="310" y2="176" stroke="#2980b9" stroke-width="1.8"/>
    <text x="290" y="272" text-anchor="middle" font-size="9.5" fill="#2980b9">A↑B↓</text>
  </g>
  <g>
    <rect x="420" y="280" width="120" height="110" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
    <text x="480" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">节点 2（从机）</text>
    <text x="480" y="326" text-anchor="middle" font-size="10.5" fill="#1f2d3d" font-family="'Consolas',monospace">STM32</text>
    <text x="480" y="346" text-anchor="middle" font-size="10" fill="#5a6b7b">接收态：DE=0，RE=0</text>
    <text x="480" y="366" text-anchor="middle" font-size="10" fill="#5a6b7b">挂总线监听地址帧</text>
    <line x1="460" y1="280" x2="460" y2="150" stroke="#27ae60" stroke-width="1.8"/>
    <line x1="500" y1="280" x2="500" y2="176" stroke="#27ae60" stroke-width="1.8"/>
  </g>
  <g>
    <rect x="610" y="280" width="120" height="110" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
    <text x="670" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">节点 N（从机）</text>
    <text x="670" y="326" text-anchor="middle" font-size="10.5" fill="#1f2d3d" font-family="'Consolas',monospace">…最多 32 个标准负载</text>
    <text x="670" y="346" text-anchor="middle" font-size="10" fill="#5a6b7b">1/8 负载收发器可扩到 256</text>
    <text x="670" y="366" text-anchor="middle" font-size="10" fill="#5a6b7b">地址帧 + CRC 校验防误收</text>
    <line x1="650" y1="280" x2="650" y2="150" stroke="#27ae60" stroke-width="1.8"/>
    <line x1="690" y1="280" x2="690" y2="176" stroke="#27ae60" stroke-width="1.8"/>
  </g>

  <!-- 中段偏置说明 -->
  <text x="410" y="130" text-anchor="middle" font-size="11.5" fill="#5a6b7b">只允许"两端"端接；中间节点严禁再加 120Ω（并联过度 → 电平摆幅塌掉）</text>

  <!-- 底部要点 -->
  <rect x="60" y="410" width="700" height="52" rx="8" fill="#eaf2fb"/>
  <text x="410" y="432" text-anchor="middle" font-size="12" fill="#1f2d3d">半双工铁律：同一时刻只允许一个节点发送；主机轮询、从机应答，靠协议（地址+CRC）保证不撞车</text>
  <text x="410" y="452" text-anchor="middle" font-size="12" fill="#1f2d3d">方向切换必须等最后一个字节完全移出（TC 标志），否则帧尾被截断 —— 见文末代码</text>
</svg>
