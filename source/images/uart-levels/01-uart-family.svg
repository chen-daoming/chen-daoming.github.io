<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="480" fill="#fbfcfd"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">三种串行接口的定位：TTL · RS232 · RS485</text>

  <!-- TTL -->
  <rect x="40" y="64" width="360" height="120" rx="10" fill="#eaf2fb" stroke="#2980b9" stroke-width="2"/>
  <text x="220" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#2980b9">TTL —— 芯片之间（板内）</text>
  <rect x="70" y="108" width="80" height="46" rx="6" fill="#34549a"/>
  <text x="110" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">MCU</text>
  <line x1="150" y1="131" x2="300" y2="131" stroke="#1f2d3d" stroke-width="2"/>
  <rect x="300" y="108" width="80" height="46" rx="6" fill="#34549a"/>
  <text x="340" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">传感器</text>
  <text x="220" y="172" text-anchor="middle" font-size="11" fill="#5a6b7b">0 / 3.3V 直接互连 · ≤ 1~2m · 全双工 · 点对点</text>

  <!-- RS232 -->
  <rect x="430" y="64" width="360" height="120" rx="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="610" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#27ae60">RS232 —— 设备之间（近距）</text>
  <rect x="460" y="108" width="80" height="46" rx="6" fill="#34549a"/>
  <text x="500" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">设备A</text>
  <line x1="540" y1="131" x2="700" y2="131" stroke="#1f2d3d" stroke-width="2"/>
  <rect x="700" y="108" width="70" height="46" rx="6" fill="#34549a"/>
  <text x="735" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">设备B</text>
  <text x="610" y="172" text-anchor="middle" font-size="11" fill="#5a6b7b">±3~15V · ≤ 15m@9600bps · 全双工 · 点对点</text>

  <!-- RS485 -->
  <rect x="40" y="210" width="750" height="150" rx="10" fill="#fdf1e7" stroke="#d35400" stroke-width="2"/>
  <text x="415" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#d35400">RS485 —— 远距离 · 多机总线（工业现场）</text>
  <line x1="100" y1="292" x2="730" y2="292" stroke="#8a6d2f" stroke-width="2.6"/>
  <line x1="100" y1="306" x2="730" y2="306" stroke="#8a6d2f" stroke-width="2.6"/>
  <text x="415" y="326" text-anchor="middle" font-size="10" fill="#8a6d2f">双绞线 A / B（≤1200m@100kbps，半双工为主）</text>
  <g fill="#34549a">
    <rect x="120" y="266" width="66" height="38" rx="5"/>
    <rect x="300" y="266" width="66" height="38" rx="5"/>
    <rect x="480" y="266" width="66" height="38" rx="5"/>
    <rect x="660" y="266" width="66" height="38" rx="5"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#ffffff" font-weight="600">
    <text x="153" y="289">节点1</text><text x="333" y="289">节点2</text>
    <text x="513" y="289">节点3</text><text x="693" y="289">…32台</text>
  </g>
  <g stroke="#34549a" stroke-width="2">
    <line x1="153" y1="266" x2="153" y2="292"/>
    <line x1="333" y1="266" x2="333" y2="292"/>
    <line x1="513" y1="266" x2="513" y2="292"/>
    <line x1="693" y1="266" x2="693" y2="292"/>
  </g>

  <!-- 底部对比表 -->
  <rect x="40" y="376" width="750" height="76" rx="10" fill="#ffffff" stroke="#d5dde5"/>
  <g font-size="11.5" fill="#1f2d3d">
    <text x="60" y="398" font-weight="700" fill="#2980b9">TTL</text>
    <text x="120" y="398">电平即电压 0/3.3V（或 5V），抗干扰最弱</text>
    <text x="60" y="420" font-weight="700" fill="#27ae60">RS232</text>
    <text x="120" y="420">±3~15V 负逻辑，电平摆幅大、参考地为信号地</text>
    <text x="60" y="442" font-weight="700" fill="#d35400">RS485</text>
    <text x="120" y="442">差分对传输（A−B），共模抑制强，长距离多机组网</text>
  </g>
</svg>
