<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="480" fill="#fbfcfd"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">同一段数据（0x55）在三种电平标准下的波形</text>

  <!-- 位序标注 -->
  <text x="60" y="80" font-size="11" fill="#8a97a5">发送位序（0x55，LSB 先行）→</text>
  <g font-family="'Consolas',monospace" font-size="12" text-anchor="middle" fill="#5a6b7b">
    <text x="328" y="80">1</text><text x="384" y="80">0</text><text x="440" y="80">1</text>
    <text x="496" y="80">0</text><text x="552" y="80">1</text><text x="608" y="80">0</text>
    <text x="664" y="80">1</text><text x="720" y="80">0</text>
  </g>
  <!-- 位边界虚线 -->
  <g stroke="#e8eef3" stroke-width="1">
    <line x1="300" y1="88" x2="300" y2="400"/><line x1="356" y1="88" x2="356" y2="400"/>
    <line x1="412" y1="88" x2="412" y2="400"/><line x1="468" y1="88" x2="468" y2="400"/>
    <line x1="524" y1="88" x2="524" y2="400"/><line x1="580" y1="88" x2="580" y2="400"/>
    <line x1="636" y1="88" x2="636" y2="400"/><line x1="692" y1="88" x2="692" y2="400"/>
    <line x1="748" y1="88" x2="748" y2="400"/>
  </g>

  <!-- ============ ① TTL ============ -->
  <text x="60" y="108" font-size="12.5" font-weight="700" fill="#2980b9">① TTL　0 / 3.3V · 正逻辑</text>
  <path d="M300 158 V120 H356 V158 H412 V120 H468 V158 H524 V120 H580 V158 H636 V120 H692 V158 H748" fill="none" stroke="#2980b9" stroke-width="2.6"/>
  <text x="292" y="124" text-anchor="end" font-size="10" fill="#8a97a5" font-family="'Consolas',monospace">3.3V</text>
  <text x="292" y="162" text-anchor="end" font-size="10" fill="#8a97a5" font-family="'Consolas',monospace">0V</text>
  <text x="524" y="182" text-anchor="middle" font-size="11" fill="#5a6b7b">0V = 0，3.3V = 1；两线交叉相接（TX→RX）；板内 / ≤1~2m</text>

  <!-- ============ ② RS232 ============ -->
  <text x="60" y="215" font-size="12.5" font-weight="700" fill="#27ae60">② RS232　±8V · 负逻辑（1 = −V）</text>
  <path d="M300 266 H356 V228 H412 V266 H468 V228 H524 V266 H580 V228 H636 V266 H692 V228 H748" fill="none" stroke="#27ae60" stroke-width="2.6"/>
  <text x="292" y="232" text-anchor="end" font-size="10" fill="#8a97a5" font-family="'Consolas',monospace">+8V</text>
  <text x="292" y="270" text-anchor="end" font-size="10" fill="#8a97a5" font-family="'Consolas',monospace">-8V</text>
  <text x="524" y="290" text-anchor="middle" font-size="11" fill="#5a6b7b">1 = −3~−15V，0 = +3~+15V；≤15m@9600bps；波形与 TTL 反相</text>

  <!-- ============ ③ RS485 ============ -->
  <text x="60" y="325" font-size="12.5" font-weight="700" fill="#d35400">③ RS485　差分 A/B（判决看 A−B）</text>
  <path d="M300 342 H356 V385 H412 V342 H468 V385 H524 V342 H580 V385 H636 V342 H692 V385 H748" fill="none" stroke="#2980b9" stroke-width="2.4"/>
  <path d="M300 385 H356 V342 H412 V385 H468 V342 H524 V385 H580 V342 H636 V385 H692 V342 H748" fill="none" stroke="#e67e22" stroke-width="2.4"/>
  <text x="292" y="346" text-anchor="end" font-size="10" fill="#2980b9" font-family="'Consolas',monospace">A</text>
  <text x="292" y="389" text-anchor="end" font-size="10" fill="#e67e22" font-family="'Consolas',monospace">B</text>
  <text x="524" y="412" text-anchor="middle" font-size="11" fill="#5a6b7b">A − B &gt; +200mV → 1；A − B &lt; −200mV → 0；共模 −7~+12V</text>
  <text x="524" y="434" text-anchor="middle" font-size="11" fill="#5a6b7b">抗共模干扰，双绞线 ≤1200m@100kbps，半双工需方向控制</text>

  <text x="410" y="466" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">看波形认接口：有没有负电平 → RS232；有没有两根互补线 → RS485</text>
</svg>
