<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="920" height="470" fill="#fbfcfd"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">DeepSeek Harness 定位：Model + Harness = Agent</text>

  <!-- 用户 -->
  <rect x="30" y="190" width="130" height="90" rx="12" fill="#eef4fb" stroke="#2980b9" stroke-width="2"/>
  <text x="95" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">用户</text>
  <text x="95" y="254" text-anchor="middle" font-size="11.5" fill="#5a6b7b">自然语言指令</text>

  <path d="M160 235 L230 235" stroke="#1f2d3d" stroke-width="2" fill="none"/>
  <path d="M222 230 L230 235 L222 240" stroke="#1f2d3d" stroke-width="2" fill="none"/>
  <text x="195" y="224" text-anchor="middle" font-size="11" fill="#5a6b7b">提需求</text>

  <!-- Harness 执行层大框 -->
  <rect x="235" y="90" width="420" height="300" rx="12" fill="#fdf3e3" stroke="#d35400" stroke-width="2.2"/>
  <text x="445" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#d35400">Harness 执行层（缰绳/工程层）</text>

  <!-- 5 个能力模块 -->
  <g font-size="12.5">
    <rect x="258" y="140" width="180" height="52" rx="7" fill="#fff" stroke="#e0a34b" stroke-width="1.5"/>
    <text x="348" y="163" text-anchor="middle" font-weight="700" fill="#1f2d3d">上下文管理</text>
    <text x="348" y="182" text-anchor="middle" font-size="10.5" fill="#5a6b7b">注入 / 压缩 / 系统提示词</text>

    <rect x="452" y="140" width="180" height="52" rx="7" fill="#fff" stroke="#e0a34b" stroke-width="1.5"/>
    <text x="542" y="163" text-anchor="middle" font-weight="700" fill="#1f2d3d">工具调用</text>
    <text x="542" y="182" text-anchor="middle" font-size="10.5" fill="#5a6b7b">Shell / 文件编辑</text>

    <rect x="258" y="206" width="180" height="52" rx="7" fill="#fff" stroke="#e0a34b" stroke-width="1.5"/>
    <text x="348" y="229" text-anchor="middle" font-weight="700" fill="#1f2d3d">多 Agent 编排</text>
    <text x="348" y="248" text-anchor="middle" font-size="10.5" fill="#5a6b7b">子 Agent 分工协作</text>

    <rect x="452" y="206" width="180" height="52" rx="7" fill="#fff" stroke="#e0a34b" stroke-width="1.5"/>
    <text x="542" y="229" text-anchor="middle" font-weight="700" fill="#1f2d3d">Skill 技能</text>
    <text x="542" y="248" text-anchor="middle" font-size="10.5" fill="#5a6b7b">插件化组合能力</text>

    <rect x="355" y="272" width="180" height="52" rx="7" fill="#fff" stroke="#e0a34b" stroke-width="1.5"/>
    <text x="445" y="295" text-anchor="middle" font-weight="700" fill="#1f2d3d">联网 / 文件搜索</text>
    <text x="445" y="314" text-anchor="middle" font-size="10.5" fill="#5a6b7b">任务状态 · 反馈 · 边界</text>
  </g>

  <!-- 到 LLM 的双向箭头 -->
  <line x1="655" y1="220" x2="720" y2="220" stroke="#1f2d3d" stroke-width="2"/>
  <path d="M712 215 L720 220 L712 225" stroke="#1f2d3d" stroke-width="2" fill="none"/>
  <line x1="720" y1="250" x2="655" y2="250" stroke="#1f2d3d" stroke-width="2"/>
  <path d="M663 245 L655 250 L663 255" stroke="#1f2d3d" stroke-width="2" fill="none"/>
  <text x="688" y="210" text-anchor="middle" font-size="10.5" fill="#5a6b7b">请求</text>
  <text x="688" y="268" text-anchor="middle" font-size="10.5" fill="#5a6b7b">推理结果</text>

  <!-- LLM -->
  <rect x="725" y="180" width="165" height="110" rx="12" fill="#e8f6ec" stroke="#27ae60" stroke-width="2"/>
  <text x="807" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">LLM 模型</text>
  <text x="807" y="246" text-anchor="middle" font-size="11.5" fill="#5a6b7b">“大脑”</text>
  <text x="807" y="266" text-anchor="middle" font-size="11" fill="#5a6b7b">推理与生成</text>

  <!-- 底部公式 -->
  <rect x="235" y="410" width="420" height="42" rx="8" fill="#1f2d3d"/>
  <text x="445" y="437" text-anchor="middle" font-size="17" font-weight="700" fill="#f0c878" font-family="Consolas,monospace">Model（大脑） + Harness（执行层） = Agent</text>
</svg>
