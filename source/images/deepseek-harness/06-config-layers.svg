<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="900" height="450" fill="#fbfcfd"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">配置树叠加顺序：越靠上优先级越高（后者覆盖前者）</text>

  <!-- 层叠矩形，从下到上缩进 -->
  <!-- L0 空根 -->
  <rect x="120" y="360" width="520" height="56" rx="8" fill="#eef1f5" stroke="#8a97a5" stroke-width="1.8"/>
  <text x="380" y="394" text-anchor="middle" font-size="14" fill="#5a6b7b">空配置根 Empty Root</text>

  <!-- L1 bundles -->
  <rect x="150" y="296" width="520" height="56" rx="8" fill="#eef4fb" stroke="#2980b9" stroke-width="1.8"/>
  <text x="410" y="322" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2980b9">① 组合包 Bundles 的补丁（dsh.profile 按顺序列出）</text>
  <text x="410" y="342" text-anchor="middle" font-size="11" fill="#5a6b7b">插件自带的默认配置</text>

  <!-- L2 profile -->
  <rect x="180" y="232" width="520" height="56" rx="8" fill="#e8f6ec" stroke="#27ae60" stroke-width="1.8"/>
  <text x="440" y="258" text-anchor="middle" font-size="13.5" font-weight="700" fill="#27ae60">② Profile 自身的 cordis.patch.yml</text>
  <text x="440" y="278" text-anchor="middle" font-size="11" fill="#5a6b7b">当前 profile 目录内的配置补丁</text>

  <!-- L3 home -->
  <rect x="210" y="168" width="520" height="56" rx="8" fill="#fdf3e3" stroke="#d35400" stroke-width="1.8"/>
  <text x="470" y="194" text-anchor="middle" font-size="13.5" font-weight="700" fill="#d35400">③ 用户主目录 $DSH_HOME/cordis.patch.yml</text>
  <text x="470" y="214" text-anchor="middle" font-size="11" fill="#5a6b7b">对所有 profile 生效的全局配置</text>

  <!-- L4 patch override -->
  <rect x="240" y="104" width="520" height="56" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="500" y="130" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c0392b">④ 命令行 --patch 指定的覆盖层（最高优先级）</text>
  <text x="500" y="150" text-anchor="middle" font-size="11" fill="#5a6b7b">临时覆盖，关闭即失效</text>

  <!-- 优先级箭头 -->
  <line x1="80" y1="388" x2="80" y2="132" stroke="#1f2d3d" stroke-width="2"/>
  <path d="M75 142 L80 132 L85 142" stroke="#1f2d3d" stroke-width="2" fill="none"/>
  <text x="66" y="265" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d" transform="rotate(-90 66 265)">优先级递增</text>

  <!-- 右侧 profile 目录结构 -->
  <rect x="700" y="104" width="180" height="312" rx="8" fill="#ffffff" stroke="#3a444f" stroke-width="1.5"/>
  <text x="716" y="130" font-size="13" font-weight="700" fill="#1f2d3d">一个 profile 目录</text>
  <line x1="716" y1="140" x2="864" y2="140" stroke="#e6ebf1"/>
  <text x="716" y="168" font-family="Consolas,monospace" font-size="11.5" fill="#2980b9">package.json</text>
  <text x="724" y="186" font-size="10.5" fill="#8a97a5">插件依赖清单</text>
  <text x="716" y="218" font-family="Consolas,monospace" font-size="11.5" fill="#27ae60">dsh.profile</text>
  <text x="724" y="236" font-size="10.5" fill="#8a97a5">元数据 + bundles 顺序</text>
  <text x="716" y="268" font-family="Consolas,monospace" font-size="11" fill="#d35400">cordis.patch.yml</text>
  <text x="724" y="286" font-size="10.5" fill="#8a97a5">用户配置补丁层</text>
  <line x1="716" y1="306" x2="864" y2="306" stroke="#e6ebf1"/>
  <text x="716" y="330" font-size="11" fill="#5a6b7b">查看最终合成结果：</text>
  <text x="716" y="352" font-family="Consolas,monospace" font-size="10.5" fill="#1f2d3d">dsh --profile web</text>
  <text x="716" y="370" font-family="Consolas,monospace" font-size="10.5" fill="#1f2d3d">--dump-config</text>
</svg>
