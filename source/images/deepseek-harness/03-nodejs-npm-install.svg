<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="940" height="480" fill="#fbfcfd"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">前置一：Windows 安装 Node.js 与 npm（两种方式任选）</text>

  <!-- 左列 MSI -->
  <rect x="30" y="58" width="430" height="290" rx="10" fill="#eef4fb" stroke="#2980b9" stroke-width="2"/>
  <text x="50" y="88" font-size="15" font-weight="700" fill="#2980b9">方式 A：官网安装包（最简单）</text>
  <g font-size="12.5" fill="#1f2d3d">
    <text x="50" y="118" font-weight="700" fill="#2980b9">①</text>
    <text x="72" y="118">打开 nodejs.org，下载 <tspan font-family="Consolas,monospace" font-weight="700">LTS</tspan> 版 Windows Installer（.msi）</text>
    <text x="50" y="152" font-weight="700" fill="#2980b9">②</text>
    <text x="72" y="152">双击安装，<tspan fill="#c0392b" font-weight="700">保持 Add to PATH 勾选</tspan>，一路 Next</text>
    <text x="50" y="186" font-weight="700" fill="#2980b9">③</text>
    <text x="72" y="186">npm 会随 Node.js 一起安装，无需单独获取</text>
    <text x="50" y="220" font-weight="700" fill="#2980b9">④</text>
    <text x="72" y="220">安装后<tspan font-weight="700">重新打开</tspan>一个终端（PATH 才生效）</text>
  </g>
  <rect x="50" y="246" width="390" height="78" rx="6" fill="#1a2530"/>
  <text x="64" y="272" font-family="Consolas,monospace" font-size="12.5" fill="#a7e8ba">node --version   # 应输出 v20.x / v22.x</text>
  <text x="64" y="296" font-family="Consolas,monospace" font-size="12.5" fill="#a7e8ba">npm --version    # 应输出 10.x</text>
  <text x="64" y="318" font-family="Consolas,monospace" font-size="11" fill="#7f97a8"># 两条都有版本号 = 环境就绪</text>

  <!-- 右列 nvm -->
  <rect x="480" y="58" width="430" height="290" rx="10" fill="#fdf3e3" stroke="#d35400" stroke-width="2"/>
  <text x="500" y="88" font-size="15" font-weight="700" fill="#d35400">方式 B：nvm-windows（多版本切换）</text>
  <g font-size="12.5" fill="#1f2d3d">
    <text x="500" y="118" font-weight="700" fill="#d35400">①</text>
    <text x="522" y="118">GitHub 搜 nvm-windows，下载 nvm-setup.exe 安装</text>
    <text x="500" y="152" font-weight="700" fill="#d35400">②</text>
    <text x="522" y="152">以管理员身份打开终端，安装最新 LTS：</text>
  </g>
  <rect x="500" y="166" width="390" height="92" rx="6" fill="#2a2118"/>
  <text x="514" y="190" font-family="Consolas,monospace" font-size="12.5" fill="#f0c878">nvm install lts</text>
  <text x="514" y="212" font-family="Consolas,monospace" font-size="12.5" fill="#f0c878">nvm use 22.23.2   # 启用已装版本</text>
  <text x="514" y="234" font-family="Consolas,monospace" font-size="12.5" fill="#f0c878">nvm list          # 查看已装版本</text>
  <text x="514" y="252" font-family="Consolas,monospace" font-size="11" fill="#a98a5c"># 以后切换项目只需 nvm use 版本号</text>
  <text x="500" y="286" font-size="12" fill="#1f2d3d">适合需要在多个 Node 版本间切换的开发者</text>
  <text x="500" y="312" font-size="12" fill="#1f2d3d">npx 随 npm 一起提供，用于免安装运行包</text>

  <!-- 底部：国内镜像 -->
  <rect x="30" y="366" width="880" height="92" rx="8" fill="#fff7e8" stroke="#d35400" stroke-width="1.5"/>
  <text x="50" y="394" font-size="13.5" font-weight="700" fill="#c0392b">国内网络建议：先把 npm 源切到国内镜像，安装速度快、不易超时</text>
  <rect x="50" y="406" width="840" height="40" rx="5" fill="#1a2530"/>
  <text x="64" y="431" font-family="Consolas,monospace" font-size="12.5" fill="#a7e8ba">npm config set registry https://registry.npmmirror.com   # 切镜像；恢复官方：npm config delete registry</text>
</svg>
