<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="480" fill="#fbfcfd"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">一维 Kalman 的四步循环（每来一个采样点跑一圈）</text>

  <!-- 上：预测 -->
  <rect x="290" y="70" width="240" height="86" rx="10" fill="#eaf2fb" stroke="#2980b9" stroke-width="2.2"/>
  <text x="410" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2980b9">① 预测（只靠模型往前推）</text>
  <text x="410" y="126" text-anchor="middle" font-size="12.5" fill="#1f2d3d" font-family="'Consolas',monospace">x1 = x     （状态外推）</text>
  <text x="410" y="146" text-anchor="middle" font-size="12.5" fill="#1f2d3d" font-family="'Consolas',monospace">P1 = P + Q （不确定度变大）</text>

  <!-- 右：增益 -->
  <rect x="560" y="196" width="220" height="86" rx="10" fill="#fdf1e7" stroke="#d35400" stroke-width="2.2"/>
  <text x="670" y="224" text-anchor="middle" font-size="13.5" font-weight="700" fill="#d35400">② 算增益（分信任比例）</text>
  <text x="670" y="252" text-anchor="middle" font-size="12.5" fill="#1f2d3d" font-family="'Consolas',monospace">K = P1 / (P1 + R)</text>
  <text x="670" y="272" text-anchor="middle" font-size="10.5" fill="#8a97a5">测量方差 R 越大 → K 越小</text>

  <!-- 下：融合 -->
  <rect x="290" y="322" width="240" height="86" rx="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.2"/>
  <text x="410" y="350" text-anchor="middle" font-size="13.5" font-weight="700" fill="#27ae60">③ 融合（用测量修正预测）</text>
  <text x="410" y="378" text-anchor="middle" font-size="12.5" fill="#1f2d3d" font-family="'Consolas',monospace">x = x1 + K·(z − x1)</text>
  <text x="410" y="398" text-anchor="middle" font-size="10.5" fill="#8a97a5">残差 (z − x1) 按 K 折算进估计</text>

  <!-- 左：更新方差 -->
  <rect x="40" y="196" width="220" height="86" rx="10" fill="#f2eafb" stroke="#8e44ad" stroke-width="2.2"/>
  <text x="150" y="224" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8e44ad">④ 更新（不确定度收缩）</text>
  <text x="150" y="252" text-anchor="middle" font-size="12.5" fill="#1f2d3d" font-family="'Consolas',monospace">P = (1 − K)·P1</text>
  <text x="150" y="272" text-anchor="middle" font-size="10.5" fill="#8a97a5">测完更笃定，下一轮从头再算</text>

  <!-- 循环箭头（顺时针） -->
  <g stroke="#8a97a5" stroke-width="2.2" fill="#8a97a5">
    <line x1="470" y1="156" x2="640" y2="190"/><path d="M630 186 L644 193 L634 198 z"/>
    <line x1="670" y1="282" x2="540" y2="318"/><path d="M549 310 L536 322 L533 308 z"/>
    <line x1="350" y1="322" x2="180" y2="288"/><path d="M190 292 L176 285 L186 280 z"/>
    <line x1="150" y1="196" x2="280" y2="160"/><path d="M271 168 L284 156 L287 170 z"/>
  </g>

  <!-- 传感器输入 -->
  <rect x="40" y="70" width="180" height="86" rx="10" fill="#ffffff" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="130" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#34549a">传感器测量 z</text>
  <text x="130" y="122" text-anchor="middle" font-size="10.5" fill="#5a6b7b">ADC / MPU6050 / 编码器</text>
  <text x="130" y="142" text-anchor="middle" font-size="10.5" fill="#8a97a5">每个采样周期来一次</text>
  <line x1="220" y1="113" x2="284" y2="98" stroke="#5a6b7b" stroke-width="2"/>
  <path d="M276 92 L288 97 L278 105 z" fill="#5a6b7b"/>

  <!-- 底部说明 -->
  <rect x="290" y="424" width="490" height="40" rx="8" fill="#eaf2fb"/>
  <text x="535" y="449" text-anchor="middle" font-size="11.5" fill="#1f2d3d">递归的妙处：只保存 x 和 P 两个数，不吃内存、不存历史 —— 单片机友好</text>
</svg>
