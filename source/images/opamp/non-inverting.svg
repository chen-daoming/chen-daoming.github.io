<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1318"/>
    </linearGradient>
    <linearGradient id="opamp2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a3444"/>
      <stop offset="100%" style="stop-color:#1e2733"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="640" height="380" rx="12" fill="url(#bg2)"/>
  
  <!-- 标题 -->
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#e8ecf1">同相放大器</text>
  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#7a8594">增益 Av = 1 + R2/R1 · 输入阻抗极高</text>
  
  <!-- 运放三角形 -->
  <polygon points="260,140 260,220 360,180" fill="url(#opamp2)" stroke="#5a7a9a" stroke-width="2.5"/>
  <text x="276" y="164" font-size="16" font-weight="700" fill="#4ecdc4">+</text>
  <text x="276" y="208" font-size="16" font-weight="700" fill="#ff6b6b">−</text>
  
  <!-- Vcc 供电线 -->
  <line x1="260" y1="140" x2="260" y2="90" stroke="#5a7a9a" stroke-width="1.8"/>
  <text x="270" y="82" font-size="11" fill="#7a8594">Vcc +5V</text>
  
  <!-- Vin 输入到+端 -->
  <circle cx="80" cy="164" r="6" fill="none" stroke="#f39c12" stroke-width="2"/>
  <text x="50" y="140" font-size="14" font-weight="700" fill="#f39c12">Vin</text>
  <line x1="80" y1="164" x2="260" y2="164" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- 输出 -->
  <line x1="360" y1="180" x2="460" y2="180" stroke="#95a5b6" stroke-width="2"/>
  <circle cx="460" cy="180" r="6" fill="none" stroke="#2ecc71" stroke-width="2"/>
  <text x="476" y="185" font-size="14" font-weight="700" fill="#2ecc71">Vout</text>
  
  <!-- 反馈网络 -->
  <!-- 从输出引出到R2 -->
  <line x1="460" y1="180" x2="460" y2="280" stroke="#95a5b6" stroke-width="2"/>
  <line x1="460" y1="280" x2="350" y2="280" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- R2 电阻 -->
  <rect x="300" y="264" width="50" height="32" rx="4" fill="#2c3e50" stroke="#e74c3c" stroke-width="2"/>
  <text x="325" y="284" text-anchor="middle" font-size="14" font-weight="600" fill="#ecf0f1">R2</text>
  <line x1="300" y1="280" x2="260" y2="280" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- 从−端引出到R1 -->
  <line x1="260" y1="200" x2="260" y2="280" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- R1 电阻 -->
  <line x1="260" y1="280" x2="260" y2="310" stroke="#95a5b6" stroke-width="2"/>
  <rect x="247" y="310" width="26" height="40" rx="4" fill="#2c3e50" stroke="#3498db" stroke-width="2"/>
  <text x="260" y="334" text-anchor="middle" font-size="14" font-weight="600" fill="#ecf0f1">R1</text>
  <line x1="260" y1="350" x2="260" y2="370" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- GND 接地 -->
  <line x1="246" y1="370" x2="274" y2="370" stroke="#95a5b6" stroke-width="2.5"/>
  <line x1="250" y1="378" x2="270" y2="378" stroke="#95a5b6" stroke-width="2"/>
  <line x1="254" y1="386" x2="266" y2="386" stroke="#95a5b6" stroke-width="1.5"/>
  
  <!-- 连接点 -->
  <circle cx="260" cy="280" r="4" fill="#2ecc71"/>
  <circle cx="350" cy="280" r="4" fill="#2ecc71"/>
  
  <!-- 底部公式 -->
  <rect x="40" y="310" width="560" height="60" rx="8" fill="#0d1117" stroke="#21262d"/>
  <text x="70" y="336" font-size="16" font-weight="600" fill="#2ecc71">Vout = (1 + R2/R1) × Vin</text>
  <text x="70" y="358" font-size="12" fill="#7a8594">负反馈使 V− 跟随 Vin，增益 ≥ 1</text>
</svg>