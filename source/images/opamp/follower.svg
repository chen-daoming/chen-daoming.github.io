<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1318"/>
    </linearGradient>
    <linearGradient id="opamp4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a3444"/>
      <stop offset="100%" style="stop-color:#1e2733"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="640" height="340" rx="12" fill="url(#bg4)"/>
  
  <!-- 标题 -->
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#e8ecf1">电压跟随器（缓冲器）</text>
  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#7a8594">Av = 1 · 输入阻抗极高 / 输出阻抗极低</text>
  
  <!-- 运放三角形 -->
  <polygon points="260,130 260,210 360,170" fill="url(#opamp4)" stroke="#5a7a9a" stroke-width="2.5"/>
  <text x="276" y="154" font-size="16" font-weight="700" fill="#4ecdc4">+</text>
  <text x="276" y="198" font-size="16" font-weight="700" fill="#ff6b6b">−</text>
  
  <!-- Vcc 供电线 -->
  <line x1="260" y1="130" x2="260" y2="80" stroke="#5a7a9a" stroke-width="1.8"/>
  <text x="270" y="72" font-size="11" fill="#7a8594">Vcc +5V</text>
  
  <!-- Vin 输入到+端 -->
  <circle cx="80" cy="154" r="6" fill="none" stroke="#f39c12" stroke-width="2"/>
  <text x="50" y="130" font-size="14" font-weight="700" fill="#f39c12">Vin</text>
  <line x1="80" y1="154" x2="260" y2="154" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- 输出 -->
  <line x1="360" y1="170" x2="460" y2="170" stroke="#95a5b6" stroke-width="2"/>
  <circle cx="460" cy="170" r="6" fill="none" stroke="#2ecc71" stroke-width="2"/>
  <text x="476" y="175" font-size="14" font-weight="700" fill="#2ecc71">Vout</text>
  
  <!-- 反馈线（输出直接连到−端） -->
  <line x1="460" y1="170" x2="460" y2="260" stroke="#95a5b6" stroke-width="2"/>
  <line x1="460" y1="260" x2="260" y2="260" stroke="#95a5b6" stroke-width="2"/>
  <line x1="260" y1="260" x2="260" y2="190" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- 连接点 -->
  <circle cx="260" cy="190" r="4" fill="#2ecc71"/>
  <circle cx="460" cy="170" r="4" fill="#2ecc71"/>
  <circle cx="460" cy="260" r="4" fill="#2ecc71"/>
  
  <!-- 说明文字 -->
  <text x="320" y="240" text-anchor="middle" font-size="13" fill="#7a8594">输出直连−端，100%负反馈</text>
  
  <!-- 底部公式 -->
  <rect x="40" y="280" width="560" height="44" rx="8" fill="#0d1117" stroke="#21262d"/>
  <text x="70" y="300" font-size="16" font-weight="600" fill="#2ecc71">Vout = Vin</text>
  <text x="250" y="300" font-size="12" fill="#7a8594">单位增益负反馈 · 缓冲隔离 / 驱动后级</text>
</svg>