<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1318"/>
    </linearGradient>
    <linearGradient id="opamp1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a3444"/>
      <stop offset="100%" style="stop-color:#1e2733"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="640" height="380" rx="12" fill="url(#bg1)"/>
  
  <!-- 标题 -->
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#e8ecf1">反相放大器</text>
  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#7a8594">增益 Av = −R2/R1 · 输入阻抗 ≈ R1</text>
  
  <!-- 运放三角形 -->
  <polygon points="240,140 240,220 340,180" fill="url(#opamp1)" stroke="#5a7a9a" stroke-width="2.5"/>
  <text x="256" y="164" font-size="16" font-weight="700" fill="#ff6b6b">−</text>
  <text x="256" y="208" font-size="16" font-weight="700" fill="#4ecdc4">+</text>
  
  <!-- Vcc 供电线 -->
  <line x1="240" y1="140" x2="240" y2="90" stroke="#5a7a9a" stroke-width="1.8"/>
  <text x="250" y="82" font-size="11" fill="#7a8594">Vcc +5V</text>
  
  <!-- Vin 输入 -->
  <circle cx="70" cy="164" r="6" fill="none" stroke="#f39c12" stroke-width="2"/>
  <text x="40" y="140" font-size="14" font-weight="700" fill="#f39c12">Vin</text>
  
  <!-- R1 电阻 -->
  <line x1="70" y1="164" x2="140" y2="164" stroke="#95a5b6" stroke-width="2"/>
  <rect x="140" y="148" width="50" height="32" rx="4" fill="#2c3e50" stroke="#3498db" stroke-width="2"/>
  <text x="165" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#ecf0f1">R1</text>
  <line x1="190" y1="164" x2="240" y2="164" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- +端接地 -->
  <line x1="240" y1="200" x2="240" y2="250" stroke="#95a5b6" stroke-width="2"/>
  <line x1="226" y1="250" x2="254" y2="250" stroke="#95a5b6" stroke-width="2.5"/>
  <line x1="230" y1="258" x2="250" y2="258" stroke="#95a5b6" stroke-width="2"/>
  <line x1="234" y1="266" x2="246" y2="266" stroke="#95a5b6" stroke-width="1.5"/>
  <text x="262" y="255" font-size="11" fill="#7a8594">GND</text>
  
  <!-- 输出 -->
  <line x1="340" y1="180" x2="440" y2="180" stroke="#95a5b6" stroke-width="2"/>
  <circle cx="440" cy="180" r="6" fill="none" stroke="#2ecc71" stroke-width="2"/>
  <text x="456" y="185" font-size="14" font-weight="700" fill="#2ecc71">Vout</text>
  
  <!-- R2 反馈电阻 -->
  <line x1="240" y1="164" x2="240" y2="100" stroke="#95a5b6" stroke-width="2"/>
  <line x1="240" y1="100" x2="390" y2="100" stroke="#95a5b6" stroke-width="2"/>
  <rect x="330" y="84" width="50" height="32" rx="4" fill="#2c3e50" stroke="#e74c3c" stroke-width="2"/>
  <text x="355" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#ecf0f1">R2</text>
  <line x1="390" y1="100" x2="390" y2="180" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- 连接点 -->
  <circle cx="390" cy="100" r="4" fill="#2ecc71"/>
  <circle cx="240" cy="164" r="4" fill="#2ecc71"/>
  
  <!-- 底部公式 -->
  <rect x="40" y="290" width="560" height="60" rx="8" fill="#0d1117" stroke="#21262d"/>
  <text x="70" y="316" font-size="16" font-weight="600" fill="#2ecc71">Vout = −(R2/R1) × Vin</text>
  <text x="70" y="338" font-size="12" fill="#7a8594">虚地：反相端 ≈ 0V，信号反相放大</text>
</svg>