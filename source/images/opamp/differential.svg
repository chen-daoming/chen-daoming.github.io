<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1318"/>
    </linearGradient>
    <linearGradient id="opamp3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a3444"/>
      <stop offset="100%" style="stop-color:#1e2733"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="700" height="420" rx="12" fill="url(#bg3)"/>
  
  <!-- 标题 -->
  <text x="350" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#e8ecf1">差分放大器（减法器）</text>
  <text x="350" y="58" text-anchor="middle" font-size="12" fill="#7a8594">Vout = (R2/R1)·(V2−V1) · R2a=R2b, R1a=R1b</text>
  
  <!-- 运放三角形 -->
  <polygon points="300,150 300,230 400,190" fill="url(#opamp3)" stroke="#5a7a9a" stroke-width="2.5"/>
  <text x="316" y="174" font-size="16" font-weight="700" fill="#ff6b6b">−</text>
  <text x="316" y="218" font-size="16" font-weight="700" fill="#4ecdc4">+</text>
  
  <!-- Vcc 供电线 -->
  <line x1="300" y1="150" x2="300" y2="100" stroke="#5a7a9a" stroke-width="1.8"/>
  <text x="310" y="92" font-size="11" fill="#7a8594">Vcc +5V</text>
  
  <!-- V1 输入路径 -->
  <circle cx="80" cy="174" r="6" fill="none" stroke="#f39c12" stroke-width="2"/>
  <text x="50" y="150" font-size="14" font-weight="700" fill="#f39c12">V1</text>
  <line x1="80" y1="174" x2="150" y2="174" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- R1a 电阻 -->
  <rect x="150" y="158" width="50" height="32" rx="4" fill="#2c3e50" stroke="#3498db" stroke-width="2"/>
  <text x="175" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#ecf0f1">R1a</text>
  <line x1="200" y1="174" x2="300" y2="174" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- V2 输入路径 -->
  <circle cx="80" cy="280" r="6" fill="none" stroke="#f39c12" stroke-width="2"/>
  <text x="50" y="256" font-size="14" font-weight="700" fill="#f39c12">V2</text>
  <line x1="80" y1="280" x2="150" y2="280" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- R1b 电阻 -->
  <rect x="150" y="264" width="50" height="32" rx="4" fill="#2c3e50" stroke="#3498db" stroke-width="2"/>
  <text x="175" y="284" text-anchor="middle" font-size="13" font-weight="600" fill="#ecf0f1">R1b</text>
  <line x1="200" y1="280" x2="300" y2="280" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- R2a 反馈电阻（反相端→输出） -->
  <line x1="300" y1="174" x2="300" y2="120" stroke="#95a5b6" stroke-width="2"/>
  <line x1="300" y1="120" x2="500" y2="120" stroke="#95a5b6" stroke-width="2"/>
  <rect x="400" y="104" width="50" height="32" rx="4" fill="#2c3e50" stroke="#e74c3c" stroke-width="2"/>
  <text x="425" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#ecf0f1">R2a</text>
  <line x1="500" y1="120" x2="500" y2="190" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- R2b 电阻（同相端→地） -->
  <line x1="300" y1="260" x2="300" y2="300" stroke="#95a5b6" stroke-width="2"/>
  <rect x="287" y="300" width="26" height="40" rx="4" fill="#2c3e50" stroke="#e74c3c" stroke-width="2"/>
  <text x="300" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="#ecf0f1">R2b</text>
  <line x1="300" y1="340" x2="300" y2="360" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- GND 接地 -->
  <line x1="286" y1="360" x2="314" y2="360" stroke="#95a5b6" stroke-width="2.5"/>
  <line x1="290" y1="368" x2="310" y2="368" stroke="#95a5b6" stroke-width="2"/>
  <line x1="294" y1="376" x2="306" y2="376" stroke="#95a5b6" stroke-width="1.5"/>
  
  <!-- 输出 -->
  <line x1="400" y1="190" x2="500" y2="190" stroke="#95a5b6" stroke-width="2"/>
  <circle cx="500" cy="190" r="6" fill="none" stroke="#2ecc71" stroke-width="2"/>
  <text x="516" y="195" font-size="14" font-weight="700" fill="#2ecc71">Vout</text>
  
  <!-- 连接点 -->
  <circle cx="300" cy="174" r="4" fill="#2ecc71"/>
  <circle cx="300" cy="260" r="4" fill="#2ecc71"/>
  <circle cx="500" cy="120" r="4" fill="#2ecc71"/>
  
  <!-- 底部公式 -->
  <rect x="40" y="390" width="620" height="24" rx="6" fill="#0d1117" stroke="#21262d"/>
  <text x="70" y="407" font-size="14" font-weight="600" fill="#2ecc71">Vout = (R2/R1)·(V2 − V1)  ·  两路电阻成比例，共模抑制才高</text>
</svg>