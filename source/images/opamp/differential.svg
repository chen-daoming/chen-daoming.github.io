<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="ui-monospace,monospace">
<!-- 差分放大器(减法器)终版。V1→R1a→−端(250,142); V2→R1b→+端(250,182); R2a: 反相端→输出; R2b: 同相端→地
     运放三角 (250,132)(250,192)(324,162) -->
<rect width="620" height="360" rx="10" fill="#1b2026"/>
<text x="310" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#e9edf2" font-family="'Microsoft YaHei','PingFang SC',sans-serif">差分放大器(减法器)</text>
<text x="310" y="54" text-anchor="middle" font-size="11.5" fill="#6b7683">Vout = (R2 / R1)·(V2 − V1)　·　R2a=R2b=R2, R1a=R1b=R1</text>

<polygon points="250,132 250,192 324,162" fill="#202b35" stroke="#8fa6b8" stroke-width="2"/>
<text x="262" y="148" font-size="13" fill="#e0a34b">−</text>
<text x="262" y="186" font-size="13" fill="#e0a34b">+</text>

<!-- V1 → R1a → −端(250,142) -->
<circle cx="66" cy="142" r="4.5" fill="none" stroke="#e0a34b" stroke-width="1.8"/>
<text x="40" y="120" font-size="12" font-weight="700" fill="#e0a34b">V1</text>
<line x1="66" y1="142" x2="126" y2="142" stroke="#98a4b1" stroke-width="1.8"/>
<rect x="126" y="126" width="14" height="32" rx="2" fill="rgba(224,163,75,0.08)" stroke="#e9edf2" stroke-width="1.6"/>
<text x="148" y="136" font-size="11.5" fill="#e9edf2">R1a</text>
<line x1="140" y1="142" x2="250" y2="142" stroke="#98a4b1" stroke-width="1.8"/>
<circle cx="250" cy="142" r="3" fill="#a7e8ba"/>

<!-- R2a: −端(250,142) 上引到 y=100, 再水平到输出上方? 用底部反馈: 输出(324..400 @162) 引下 y=250 左至 R2a -->
<!-- 反相端反馈: −端(250,142) → 上 (250,96) → 右 (376,96) → 下 (376,162) 接输出 -->
<line x1="250" y1="142" x2="250" y2="96" stroke="#98a4b1" stroke-width="1.8"/>
<line x1="250" y1="96" x2="376" y2="96" stroke="#98a4b1" stroke-width="1.8"/>
<line x1="376" y1="96" x2="376" y2="162" stroke="#98a4b1" stroke-width="1.8"/>
<circle cx="376" cy="96" r="3" fill="#a7e8ba"/>
<rect x="300" y="88" width="32" height="14" rx="2" fill="rgba(224,163,75,0.08)" stroke="#e9edf2" stroke-width="1.6"/>
<text x="316" y="76" font-size="11.5" fill="#e9edf2" text-anchor="middle">R2a</text>

<!-- 输出 (324,162) → (400,162) Vout -->
<line x1="324" y1="162" x2="400" y2="162" stroke="#98a4b1" stroke-width="1.8"/>
<circle cx="400" cy="162" r="4.5" fill="none" stroke="#a7e8ba" stroke-width="1.8"/>
<text x="412" y="166" font-size="12" font-weight="700" fill="#a7e8ba">Vout</text>

<!-- V2 → R1b → +端(250,182) -->
<circle cx="66" cy="248" r="4.5" fill="none" stroke="#e0a34b" stroke-width="1.8"/>
<text x="40" y="226" font-size="12" font-weight="700" fill="#e0a34b">V2</text>
<line x1="66" y1="248" x2="126" y2="248" stroke="#98a4b1" stroke-width="1.8"/>
<rect x="126" y="232" width="14" height="32" rx="2" fill="rgba(224,163,75,0.08)" stroke="#e9edf2" stroke-width="1.6"/>
<text x="148" y="242" font-size="11.5" fill="#e9edf2">R1b</text>
<line x1="140" y1="248" x2="140" y2="182" stroke="#98a4b1" stroke-width="1.8"/>
<line x1="140" y1="182" x2="250" y2="182" stroke="#98a4b1" stroke-width="1.8"/>
<circle cx="250" cy="182" r="3" fill="#a7e8ba"/>

<!-- R2b: +端(250,182) → 下 (250,250) 经 R2b 到地? 需匹配: +端经 R2b 到 GND(构成 V2 分压) -->
<line x1="250" y1="182" x2="250" y2="214" stroke="#98a4b1" stroke-width="1.8"/>
<rect x="243" y="214" width="14" height="32" rx="2" fill="rgba(224,163,75,0.08)" stroke="#e9edf2" stroke-width="1.6"/>
<text x="264" y="222" font-size="11.5" fill="#e9edf2">R2b</text>
<line x1="250" y1="246" x2="250" y2="266" stroke="#98a4b1" stroke-width="1.8"/>
<line x1="236" y1="266" x2="264" y2="266" stroke="#98a4b1" stroke-width="2"/>
<line x1="240" y1="273" x2="260" y2="273" stroke="#98a4b1" stroke-width="2"/>
<line x1="244" y1="280" x2="256" y2="280" stroke="#98a4b1" stroke-width="2"/>
<text x="272" y="269" font-size="10.5" fill="#6b7683">GND</text>

<!-- 底部公式 -->
<text x="66" y="330" font-size="13.5" fill="#a7e8ba">Vout = (R2 / R1)·(V2 − V1)</text>
<text x="340" y="330" font-size="11.5" fill="#6b7683">两路电阻成比例，共模抑制才高</text>
</svg>
