<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="780" height="420" fill="#fbfcfd"/>
  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">CCM 下电感电流三角波与关键电流参数</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="330" x2="720" y2="330" stroke="#1f2d3d" stroke-width="1.6"/>
  <path d="M712 325 L720 330 L712 335" stroke="#1f2d3d" stroke-width="1.6" fill="none"/>
  <text x="728" y="334" font-size="12" fill="#1f2d3d">t</text>
  <line x1="80" y1="330" x2="80" y2="80" stroke="#1f2d3d" stroke-width="1.6"/>
  <path d="M75 88 L80 80 L85 88" stroke="#1f2d3d" stroke-width="1.6" fill="none"/>
  <text x="60" y="86" font-size="12" fill="#1f2d3d">iL</text>

  <!-- Ipeak / ILavg / Ivalley 参考线 -->
  <line x1="80" y1="120" x2="700" y2="120" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="706" y="124" font-size="12" font-weight="700" fill="#c0392b">Ipeak</text>
  <line x1="80" y1="200" x2="700" y2="200" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="706" y="204" font-size="12" font-weight="700" fill="#27ae60">ILavg</text>
  <line x1="80" y1="280" x2="700" y2="280" stroke="#2980b9" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="706" y="284" font-size="12" font-weight="700" fill="#2980b9">Ivalley</text>

  <!-- 三角波两周期 -->
  <polyline points="120,280 260,120 400,280 540,120 680,280" fill="none" stroke="#d35400" stroke-width="2.6"/>

  <!-- ΔIL 双向箭头（左侧） -->
  <line x1="100" y1="120" x2="100" y2="280" stroke="#1f2d3d" stroke-width="1.5"/>
  <path d="M95 130 L100 120 L105 130" stroke="#1f2d3d" stroke-width="1.5" fill="none"/>
  <path d="M95 270 L100 280 L105 270" stroke="#1f2d3d" stroke-width="1.5" fill="none"/>
  <text x="66" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d" transform="rotate(-90 66 205)">ΔIL 纹波峰峰</text>

  <!-- Ton / Toff 标注 -->
  <text x="190" y="312" text-anchor="middle" font-size="12" fill="#5a6b7b" font-family="Consolas,monospace">Ton（上升储能）</text>
  <text x="330" y="312" text-anchor="middle" font-size="12" fill="#5a6b7b" font-family="Consolas,monospace">Toff（下降释放）</text>
  <text x="470" y="312" text-anchor="middle" font-size="12" fill="#5a6b7b" font-family="Consolas,monospace">Ton</text>
  <text x="610" y="312" text-anchor="middle" font-size="12" fill="#5a6b7b" font-family="Consolas,monospace">Toff</text>
  <!-- 周期 T -->
  <line x1="120" y1="350" x2="400" y2="350" stroke="#8a97a5" stroke-width="1.3"/>
  <path d="M128 346 L120 350 L128 354" stroke="#8a97a5" stroke-width="1.3" fill="none"/>
  <path d="M392 346 L400 350 L392 354" stroke="#8a97a5" stroke-width="1.3" fill="none"/>
  <text x="260" y="368" text-anchor="middle" font-size="12" fill="#5a6b7b" font-family="Consolas,monospace">T = 1/fsw</text>

  <!-- 公式条 -->
  <rect x="80" y="380" width="640" height="30" rx="6" fill="#1f2d3d"/>
  <text x="300" y="400" text-anchor="middle" font-family="Consolas,monospace" font-size="12.5" fill="#a7e8ba">Ipeak = ILavg + ΔIL/2</text>
  <text x="560" y="400" text-anchor="middle" font-family="Consolas,monospace" font-size="12.5" fill="#f0c878">选型 Isat ≥ (1.2~1.5) × Ipeak</text>
</svg>
