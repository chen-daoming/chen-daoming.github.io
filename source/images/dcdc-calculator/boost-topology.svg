<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="780" height="400" fill="#fbfcfd"/>
  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Boost 升压变换器拓扑（电感在输入端）</text>

  <!-- Vin -->
  <circle cx="60" cy="120" r="5" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="60" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#27ae60">Vin</text>
  <line x1="60" y1="120" x2="110" y2="120" stroke="#5a6b7b" stroke-width="2"/>

  <!-- 电感 L -->
  <path d="M110 120 q8 -20 18 0 q8 -20 18 0 q8 -20 18 0 q8 -20 18 0" fill="none" stroke="#d35400" stroke-width="2.2"/>
  <text x="164" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#d35400">L（储能电感）</text>
  <line x1="182" y1="120" x2="330" y2="120" stroke="#5a6b7b" stroke-width="2"/>
  <path d="M240 112 L260 112 M254 107 L260 112 L254 117" stroke="#27ae60" stroke-width="1.8" fill="none"/>
  <text x="250" y="104" text-anchor="middle" font-size="11" fill="#27ae60">iL</text>

  <!-- SW 节点 -->
  <circle cx="330" cy="120" r="4.5" fill="#1f2d3d"/>
  <text x="312" y="106" text-anchor="middle" font-size="12" fill="#1f2d3d" font-weight="700">SW</text>

  <!-- 向下开关 S -->
  <line x1="330" y1="120" x2="330" y2="168" stroke="#5a6b7b" stroke-width="2"/>
  <rect x="300" y="168" width="60" height="30" rx="4" fill="#eef4fb" stroke="#2980b9" stroke-width="2"/>
  <text x="330" y="188" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2980b9">开关 S</text>
  <line x1="330" y1="198" x2="330" y2="250" stroke="#5a6b7b" stroke-width="2"/>

  <!-- 向右二极管：阳极 SW，阴极朝 Vout -->
  <line x1="330" y1="120" x2="400" y2="120" stroke="#5a6b7b" stroke-width="2"/>
  <polygon points="400,108 400,132 428,120" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <line x1="428" y1="108" x2="428" y2="132" stroke="#c0392b" stroke-width="2.5"/>
  <text x="414" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">整流管 D</text>
  <line x1="428" y1="120" x2="560" y2="120" stroke="#5a6b7b" stroke-width="2"/>

  <!-- Vout 节点 -->
  <circle cx="560" cy="120" r="4.5" fill="#1f2d3d"/>
  <line x1="560" y1="120" x2="640" y2="120" stroke="#5a6b7b" stroke-width="2"/>
  <circle cx="646" cy="120" r="5" fill="none" stroke="#2980b9" stroke-width="2"/>
  <text x="646" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#2980b9">Vout</text>

  <!-- Cout -->
  <line x1="560" y1="120" x2="560" y2="172" stroke="#5a6b7b" stroke-width="2"/>
  <line x1="540" y1="172" x2="580" y2="172" stroke="#1f2d3d" stroke-width="2.5"/>
  <line x1="540" y1="184" x2="580" y2="184" stroke="#1f2d3d" stroke-width="2.5"/>
  <text x="592" y="182" font-size="12" fill="#1f2d3d" font-weight="700">Cout</text>
  <line x1="560" y1="184" x2="560" y2="250" stroke="#5a6b7b" stroke-width="2"/>

  <!-- 负载 -->
  <line x1="640" y1="120" x2="680" y2="120" stroke="#5a6b7b" stroke-width="2"/>
  <line x1="680" y1="120" x2="680" y2="200" stroke="#5a6b7b" stroke-width="2"/>
  <rect x="668" y="200" width="24" height="34" rx="3" fill="rgba(224,163,75,0.1)" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="712" y="221" font-size="12" fill="#1f2d3d">负载</text>
  <line x1="680" y1="234" x2="680" y2="250" stroke="#5a6b7b" stroke-width="2"/>

  <!-- GND -->
  <line x1="280" y1="250" x2="700" y2="250" stroke="#5a6b7b" stroke-width="2"/>
  <line x1="266" y1="258" x2="294" y2="258" stroke="#5a6b7b" stroke-width="2"/>
  <line x1="272" y1="266" x2="288" y2="266" stroke="#5a6b7b" stroke-width="2"/>
  <text x="240" y="255" font-size="11" fill="#8a97a5">GND</text>

  <!-- 公式 -->
  <rect x="60" y="300" width="660" height="78" rx="8" fill="#1f2d3d"/>
  <text x="80" y="326" font-family="Consolas,monospace" font-size="13.5" fill="#f0c878">D = 1 − Vin/Vout ；ILavg = Iout·Vout/(Vin·η) ；ΔIL = r × ILavg</text>
  <text x="80" y="352" font-family="Consolas,monospace" font-size="13.5" fill="#a7e8ba">L = Vin·D / (ΔIL·fsw) = Vin²(Vout−Vin) / (r·Iout·Vout²·fsw)（η=1 时）</text>
  <text x="80" y="372" font-family="Consolas,monospace" font-size="12" fill="#98a4b1">导通时 Vin 加在 L 上储能、二极管截止；关断时 L 电动势抬升，经二极管向输出供能</text>
</svg>
