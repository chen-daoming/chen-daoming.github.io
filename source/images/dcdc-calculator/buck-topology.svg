<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="780" height="400" fill="#fbfcfd"/>
  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Buck 降压变换器拓扑（同步整流前的经典结构）</text>

  <!-- 导线颜色 #5a6b7b，元件 #1f2d3d，强调 #2980b9 / #d35400 / #27ae60 -->
  <!-- Vin 端子 -->
  <circle cx="60" cy="120" r="5" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="60" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#27ae60">Vin</text>
  <line x1="60" y1="120" x2="120" y2="120" stroke="#5a6b7b" stroke-width="2"/>

  <!-- 开关 MOSFET S -->
  <rect x="120" y="104" width="70" height="32" rx="4" fill="#eef4fb" stroke="#2980b9" stroke-width="2"/>
  <text x="155" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#2980b9">开关 S</text>
  <text x="155" y="152" text-anchor="middle" font-size="11" fill="#8a97a5">PWM 占空比 D</text>
  <line x1="190" y1="120" x2="270" y2="120" stroke="#5a6b7b" stroke-width="2"/>

  <!-- SW 节点 -->
  <circle cx="270" cy="120" r="4.5" fill="#1f2d3d"/>
  <text x="252" y="106" text-anchor="middle" font-size="12" fill="#1f2d3d" font-weight="700">SW</text>

  <!-- 续流二极管：SW 向下到 GND，阴极在上 -->
  <line x1="270" y1="120" x2="270" y2="170" stroke="#5a6b7b" stroke-width="2"/>
  <polygon points="258,170 282,170 270,196" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <line x1="258" y1="196" x2="282" y2="196" stroke="#c0392b" stroke-width="2.5"/>
  <text x="300" y="188" font-size="12" fill="#c0392b" font-weight="700">续流二极管 D</text>
  <line x1="270" y1="196" x2="270" y2="250" stroke="#5a6b7b" stroke-width="2"/>

  <!-- SW 向右到电感 L -->
  <line x1="270" y1="120" x2="340" y2="120" stroke="#5a6b7b" stroke-width="2"/>
  <!-- 电感符号（弧形） -->
  <path d="M340 120 q8 -20 18 0 q8 -20 18 0 q8 -20 18 0 q8 -20 18 0" fill="none" stroke="#d35400" stroke-width="2.2"/>
  <text x="385" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#d35400">L（储能电感）</text>
  <line x1="412" y1="120" x2="560" y2="120" stroke="#5a6b7b" stroke-width="2"/>
  <!-- 电流箭头 -->
  <path d="M470 112 L490 112 M484 107 L490 112 L484 117" stroke="#27ae60" stroke-width="1.8" fill="none"/>
  <text x="480" y="104" text-anchor="middle" font-size="11" fill="#27ae60">iL</text>

  <!-- Vout 节点 -->
  <circle cx="560" cy="120" r="4.5" fill="#1f2d3d"/>
  <line x1="560" y1="120" x2="640" y2="120" stroke="#5a6b7b" stroke-width="2"/>
  <circle cx="646" cy="120" r="5" fill="none" stroke="#2980b9" stroke-width="2"/>
  <text x="646" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#2980b9">Vout</text>

  <!-- 输出电容 C：Vout 节点向下 -->
  <line x1="560" y1="120" x2="560" y2="172" stroke="#5a6b7b" stroke-width="2"/>
  <line x1="540" y1="172" x2="580" y2="172" stroke="#1f2d3d" stroke-width="2.5"/>
  <line x1="540" y1="184" x2="580" y2="184" stroke="#1f2d3d" stroke-width="2.5"/>
  <text x="592" y="182" font-size="12" fill="#1f2d3d" font-weight="700">Cout</text>
  <line x1="560" y1="184" x2="560" y2="250" stroke="#5a6b7b" stroke-width="2"/>

  <!-- 负载 RL -->
  <line x1="640" y1="120" x2="680" y2="120" stroke="#5a6b7b" stroke-width="2"/>
  <line x1="680" y1="120" x2="680" y2="200" stroke="#5a6b7b" stroke-width="2"/>
  <rect x="668" y="200" width="24" height="34" rx="3" fill="rgba(224,163,75,0.1)" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="712" y="221" font-size="12" fill="#1f2d3d">负载</text>
  <line x1="680" y1="234" x2="680" y2="250" stroke="#5a6b7b" stroke-width="2"/>

  <!-- GND 母线 -->
  <line x1="240" y1="250" x2="700" y2="250" stroke="#5a6b7b" stroke-width="2"/>
  <line x1="226" y1="258" x2="254" y2="258" stroke="#5a6b7b" stroke-width="2"/>
  <line x1="232" y1="266" x2="248" y2="266" stroke="#5a6b7b" stroke-width="2"/>
  <text x="200" y="255" font-size="11" fill="#8a97a5">GND</text>

  <!-- 公式区 -->
  <rect x="60" y="300" width="660" height="78" rx="8" fill="#1f2d3d"/>
  <text x="80" y="328" font-family="Consolas,monospace" font-size="14" fill="#f0c878">D = Vout / Vin ；ΔIL = r × Iout（r 常取 0.2~0.4）</text>
  <text x="80" y="354" font-family="Consolas,monospace" font-size="14" fill="#a7e8ba">L = Vout × (1 − D) / (ΔIL × fsw) = Vout(1 − Vout/Vin) / (r·Iout·fsw)</text>
  <text x="80" y="374" font-family="Consolas,monospace" font-size="12" fill="#98a4b1">导通时 Vin−Vout 加在 L 上储能，关断时 L 经续流二极管向输出释放能量（伏秒平衡）</text>
</svg>
