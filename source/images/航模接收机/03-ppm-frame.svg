<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="920" height="400" fill="#fbfcfd"/>
  <text x="460" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">PPM 帧结构：相邻脉冲上升沿间隔 = 一个通道值，帧尾长空白同步分隔</text>

  <!-- 脉冲位置（1ms=39.5px, 起点x=90） -->
  <!-- p0=90 p1=149 p2=189 p3=268 p4=327 p5=374 p6=445 p7=505 p8=568 p9=884 -->
  <!-- 主波形 -->
  <g fill="none" stroke="#2980b9" stroke-width="2.2" stroke-linejoin="miter">
    <!-- 基线 -->
    <line x1="70" y1="180" x2="900" y2="180"/>
    <!-- 8+1 个窄脉冲，宽12px，高70 -->
    <path d="M90 180 L90 120 L102 120 L102 180"/>
    <path d="M149 180 L149 120 L161 120 L161 180"/>
    <path d="M189 180 L189 120 L201 120 L201 180"/>
    <path d="M268 180 L268 120 L280 120 L280 180"/>
    <path d="M327 180 L327 120 L339 120 L339 180"/>
    <path d="M374 180 L374 120 L386 120 L386 180"/>
    <path d="M445 180 L445 120 L457 120 L457 180"/>
    <path d="M505 180 L505 120 L517 120 L517 180"/>
    <path d="M568 180 L568 120 L580 120 L580 180"/>
    <!-- 下一帧首脉冲 -->
    <path d="M884 180 L884 120 L896 120 L896 180" stroke-dasharray="3 3" stroke="#9aa7b5"/>
  </g>

  <!-- 通道间隔标注 t1..t8 -->
  <g stroke="#d35400" stroke-width="1.1">
    <line x1="90" y1="100" x2="149" y2="100"/>
    <line x1="149" y1="100" x2="189" y2="100"/>
    <line x1="189" y1="100" x2="268" y2="100"/>
    <line x1="268" y1="100" x2="327" y2="100"/>
    <line x1="327" y1="100" x2="374" y2="100"/>
    <line x1="374" y1="100" x2="445" y2="100"/>
    <line x1="445" y1="100" x2="505" y2="100"/>
    <line x1="505" y1="100" x2="568" y2="100"/>
  </g>
  <g font-size="11" fill="#d35400" font-family="Consolas,monospace" text-anchor="middle">
    <text x="119" y="94">t1</text><text x="169" y="94">t2</text><text x="228" y="94">t3</text>
    <text x="297" y="94">t4</text><text x="350" y="94">t5</text><text x="409" y="94">t6</text>
    <text x="475" y="94">t7</text><text x="536" y="94">t8</text>
  </g>
  <g font-size="10" fill="#5a6b7b" font-family="Consolas,monospace" text-anchor="middle">
    <text x="119" y="115">1500</text><text x="169" y="115">1000</text><text x="228" y="115">2000</text>
    <text x="297" y="115">1500</text><text x="350" y="115">1200</text><text x="409" y="115">1800</text>
    <text x="475" y="115">1500</text><text x="536" y="115">1600 µs</text>
  </g>

  <!-- 同步空白标注 -->
  <g stroke="#c0392b" stroke-width="1.3">
    <line x1="568" y1="215" x2="884" y2="215"/>
    <path d="M572 211 L568 215 L572 219 M880 211 L884 215 L880 219" fill="none"/>
  </g>
  <text x="726" y="238" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b">同步空白 Synchro Blank Time（示例 8000 µs，须 &gt; 正常通道脉宽）</text>

  <!-- 帧括号 -->
  <g stroke="#1f2d3d" stroke-width="1.2">
    <line x1="90" y1="265" x2="884" y2="265"/>
    <path d="M94 261 L90 265 L94 269 M880 261 L884 265 L880 269" fill="none"/>
  </g>
  <text x="487" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">一帧 Period ≈ 20 ms，最多容纳 10 个通道</text>

  <!-- 说明 -->
  <rect x="90" y="310" width="740" height="62" rx="6" fill="#eef4fb" stroke="#c9dbe e" stroke-width="1"/>
  <rect x="90" y="310" width="740" height="62" rx="6" fill="#eef4fb" stroke="#c9dbee" stroke-width="1"/>
  <text x="110" y="335" font-size="12.5" fill="#1f2d3d">① 每个窄脉冲高电平仅约 300~500 µs；<tspan fill="#d35400" font-family="Consolas,monospace">两脉冲上升沿间隔 tₙ（1000~2000 µs）即第 n 通道值</tspan></text>
  <text x="110" y="358" font-size="12.5" fill="#1f2d3d">② 全部通道发完后插入一个显著超长的低电平空白作为帧同步，接收机据此区分前后帧，一根信号线传全部通道</text>
</svg>
