<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="480" fill="#fbfcfd"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">VOFA+ 两种数据协议的帧格式</text>

  <!-- ================= FireWater ================= -->
  <rect x="40" y="56" width="760" height="185" rx="10" fill="#ffffff" stroke="#d5dde5"/>
  <text x="80" y="86" font-size="15" font-weight="700" fill="#2980b9">① FireWater —— 文本协议（printf 风格）</text>
  <text x="780" y="86" text-anchor="end" font-size="11" fill="#8a97a5">可读性好 · 适合低速通道</text>

  <g font-family="'Consolas','Courier New',monospace" font-size="13" text-anchor="middle">
    <rect x="80" y="106" width="30" height="34" rx="4" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.6"/>
    <text x="95" y="128" fill="#1f2d3d">1</text>
    <rect x="114" y="106" width="30" height="34" rx="4" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.6"/>
    <text x="129" y="128" fill="#1f2d3d">.</text>
    <rect x="148" y="106" width="30" height="34" rx="4" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.6"/>
    <text x="163" y="128" fill="#1f2d3d">2</text>
    <rect x="182" y="106" width="30" height="34" rx="4" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.6"/>
    <text x="197" y="128" fill="#1f2d3d">3</text>
    <rect x="216" y="106" width="30" height="34" rx="4" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.6"/>
    <text x="231" y="128" fill="#1f2d3d">,</text>
    <rect x="250" y="106" width="30" height="34" rx="4" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.6"/>
    <text x="265" y="128" fill="#1f2d3d">4</text>
    <rect x="284" y="106" width="30" height="34" rx="4" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.6"/>
    <text x="299" y="128" fill="#1f2d3d">.</text>
    <rect x="318" y="106" width="30" height="34" rx="4" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.6"/>
    <text x="333" y="128" fill="#1f2d3d">5</text>
    <rect x="352" y="106" width="30" height="34" rx="4" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.6"/>
    <text x="367" y="128" fill="#1f2d3d">6</text>
    <rect x="386" y="106" width="30" height="34" rx="4" fill="#fdeaea" stroke="#c0392b" stroke-width="1.6"/>
    <text x="401" y="128" fill="#c0392b">\r</text>
    <rect x="420" y="106" width="30" height="34" rx="4" fill="#fdeaea" stroke="#c0392b" stroke-width="1.6"/>
    <text x="435" y="128" fill="#c0392b">\n</text>
  </g>
  <line x1="80" y1="148" x2="402" y2="148" stroke="#2980b9" stroke-width="1"/>
  <text x="241" y="164" text-anchor="middle" font-size="11" fill="#2980b9">ASCII 字符（明文可读，逗号分通道）</text>
  <text x="418" y="164" font-size="11" fill="#c0392b" font-weight="600">← 帧尾 \r\n（必须）</text>

  <text x="80" y="196" font-size="11.5" fill="#5a6b7b">任意 printf 内容，VOFA+ 收到一行就把逗号分隔的数字画成多通道曲线</text>
  <text x="80" y="216" font-size="11.5" fill="#8a97a5">适合通道少、速率低的场景，普通串口助手也能肉眼核对</text>

  <!-- ================= JustFloat ================= -->
  <rect x="40" y="252" width="760" height="185" rx="10" fill="#ffffff" stroke="#d5dde5"/>
  <text x="80" y="282" font-size="15" font-weight="700" fill="#27ae60">② JustFloat —— 二进制协议（浮点数组 + 帧尾）</text>
  <text x="780" y="282" text-anchor="end" font-size="11" fill="#8a97a5">带宽紧凑 · 适合多通道高频</text>

  <g font-family="'Consolas','Courier New',monospace" font-size="10" text-anchor="middle">
    <!-- f0: 3.1416f -->
    <rect x="80" y="302" width="24" height="34" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="92" y="323" fill="#1f2d3d">DA</text>
    <rect x="106" y="302" width="24" height="34" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="118" y="323" fill="#1f2d3d">0F</text>
    <rect x="132" y="302" width="24" height="34" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="144" y="323" fill="#1f2d3d">49</text>
    <rect x="158" y="302" width="24" height="34" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="170" y="323" fill="#1f2d3d">40</text>
    <!-- f1: 1.0f -->
    <rect x="198" y="302" width="24" height="34" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="210" y="323" fill="#1f2d3d">00</text>
    <rect x="224" y="302" width="24" height="34" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="236" y="323" fill="#1f2d3d">00</text>
    <rect x="250" y="302" width="24" height="34" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="262" y="323" fill="#1f2d3d">80</text>
    <rect x="276" y="302" width="24" height="34" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="288" y="323" fill="#1f2d3d">3F</text>
    <!-- f2: 2.5f -->
    <rect x="316" y="302" width="24" height="34" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="328" y="323" fill="#1f2d3d">00</text>
    <rect x="342" y="302" width="24" height="34" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="354" y="323" fill="#1f2d3d">00</text>
    <rect x="368" y="302" width="24" height="34" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="380" y="323" fill="#1f2d3d">20</text>
    <rect x="394" y="302" width="24" height="34" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="406" y="323" fill="#1f2d3d">40</text>
    <!-- tail -->
    <rect x="438" y="302" width="24" height="34" rx="3" fill="#fdeaea" stroke="#c0392b" stroke-width="1.6"/>
    <text x="450" y="323" fill="#c0392b">00</text>
    <rect x="464" y="302" width="24" height="34" rx="3" fill="#fdeaea" stroke="#c0392b" stroke-width="1.6"/>
    <text x="476" y="323" fill="#c0392b">00</text>
    <rect x="490" y="302" width="24" height="34" rx="3" fill="#fdeaea" stroke="#c0392b" stroke-width="1.6"/>
    <text x="502" y="323" fill="#c0392b">80</text>
    <rect x="516" y="302" width="24" height="34" rx="3" fill="#fdeaea" stroke="#c0392b" stroke-width="1.6"/>
    <text x="528" y="323" fill="#c0392b">7F</text>
  </g>
  <g font-size="10.5" text-anchor="middle">
    <text x="131" y="352" fill="#27ae60">f[0] = 3.1416f</text>
    <text x="249" y="352" fill="#27ae60">f[1] = 1.0f</text>
    <text x="367" y="352" fill="#27ae60">f[2] = 2.5f</text>
    <text x="489" y="352" fill="#c0392b" font-weight="600">帧尾 TAIL</text>
  </g>

  <text x="556" y="320" font-size="11" fill="#c0392b">+Inf（0x7F800000）</text>
  <text x="556" y="338" font-size="11" fill="#5a6b7b">正常数据永远不会出现，</text>
  <text x="556" y="356" font-size="11" fill="#5a6b7b">VOFA+ 靠它自动切帧</text>

  <text x="80" y="386" font-size="11.5" fill="#5a6b7b">float 数组按内存原样（小端序）发送，末尾追加 4 字节帧尾；本例 3 通道一帧 = 16 字节</text>
  <text x="80" y="406" font-size="11.5" fill="#8a97a5">同样的信息量，字节数约为 FireWater 的一半，更适合 FFT 与高频采样</text>

  <text x="410" y="466" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">选型口诀：人要看 → FireWater；机器要快 → JustFloat</text>
</svg>
