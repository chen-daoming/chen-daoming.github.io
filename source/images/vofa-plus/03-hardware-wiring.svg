<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="480" fill="#fbfcfd"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">调试硬件与接线图（STM32F103C8T6 最小系统板）</text>

  <!-- ST-Link -->
  <rect x="640" y="30" width="150" height="56" rx="8" fill="#f2eafb" stroke="#8e44ad" stroke-width="2"/>
  <text x="715" y="52" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8e44ad">ST-Link V2</text>
  <text x="715" y="72" text-anchor="middle" font-size="10" fill="#8a97a5">SWD 下载调试 · 不占串口</text>
  <line x1="715" y1="86" x2="715" y2="120" stroke="#8e44ad" stroke-width="5"/>
  <text x="706" y="108" text-anchor="end" font-size="9.5" fill="#8e44ad">SWDIO / SWCLK / 3V3 / GND</text>

  <!-- PC -->
  <rect x="50" y="150" width="150" height="120" rx="10" fill="#eef2f8" stroke="#5a6b7b" stroke-width="2"/>
  <rect x="66" y="164" width="118" height="62" rx="4" fill="#fbfdff" stroke="#c3cdd6"/>
  <path d="M70 200 Q80 180 90 200 T110 200 T130 200 T150 200 T170 200 T184 200" fill="none" stroke="#e67e22" stroke-width="1.8"/>
  <line x1="70" y1="176" x2="184" y2="176" stroke="#e8eff5" stroke-width="1"/>
  <line x1="70" y1="194" x2="184" y2="194" stroke="#e8eff5" stroke-width="1"/>
  <line x1="70" y1="212" x2="184" y2="212" stroke="#e8eff5" stroke-width="1"/>
  <text x="125" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#34549a">PC · VOFA+</text>

  <!-- USB 线 -->
  <line x1="200" y1="190" x2="290" y2="190" stroke="#5a6b7b" stroke-width="4"/>
  <text x="245" y="178" text-anchor="middle" font-size="11" fill="#5a6b7b">USB 线</text>

  <!-- CH340 模块 -->
  <rect x="290" y="150" width="140" height="170" rx="8" fill="#fdf1e7" stroke="#d35400" stroke-width="2"/>
  <text x="360" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#d35400">CH340</text>
  <text x="360" y="194" text-anchor="middle" font-size="10.5" fill="#8a97a5">USB 转 TTL 模块</text>
  <g fill="#34549a">
    <rect x="424" y="210" width="10" height="10"/>
    <rect x="424" y="240" width="10" height="10"/>
    <rect x="424" y="270" width="10" height="10"/>
    <rect x="424" y="300" width="10" height="10"/>
  </g>
  <g font-family="'Consolas','Courier New',monospace" font-size="11" fill="#1f2d3d">
    <text x="440" y="219">RXD</text>
    <text x="440" y="249">TXD</text>
    <text x="440" y="279">GND</text>
    <text x="440" y="309">3V3</text>
  </g>

  <!-- 接线（交叉） -->
  <line x1="434" y1="215" x2="548" y2="215" stroke="#e67e22" stroke-width="2.5"/>
  <text x="491" y="206" text-anchor="middle" font-size="10" fill="#d35400" font-weight="600">TX → RXD</text>
  <line x1="434" y1="245" x2="548" y2="245" stroke="#2980b9" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="491" y="236" text-anchor="middle" font-size="10" fill="#2980b9">RX ← TXD（可不接）</text>
  <line x1="434" y1="275" x2="548" y2="275" stroke="#1f2d3d" stroke-width="2.5"/>
  <text x="491" y="266" text-anchor="middle" font-size="10" fill="#1f2d3d" font-weight="600">GND（必须共地）</text>
  <line x1="434" y1="305" x2="548" y2="305" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="491" y="296" text-anchor="middle" font-size="10" fill="#c0392b">3V3（可不接）</text>
  <text x="491" y="332" text-anchor="middle" font-size="10" fill="#8a97a5">—— 实线必接 　- - 虚线可选</text>

  <!-- Blue Pill -->
  <rect x="560" y="120" width="210" height="240" rx="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.2"/>
  <text x="665" y="144" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">STM32F103C8T6</text>
  <text x="665" y="162" text-anchor="middle" font-size="10.5" fill="#8a97a5">Blue Pill 小蓝板</text>
  <rect x="625" y="200" width="80" height="80" rx="6" fill="#34549a"/>
  <text x="665" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">STM32</text>
  <g fill="#34549a">
    <rect x="548" y="210" width="12" height="10"/>
    <rect x="548" y="240" width="12" height="10"/>
    <rect x="548" y="270" width="12" height="10"/>
    <rect x="548" y="300" width="12" height="10"/>
  </g>
  <g font-family="'Consolas','Courier New',monospace" font-size="11" fill="#1f2d3d">
    <text x="568" y="219">PA9</text>
    <text x="568" y="249">PA10</text>
    <text x="568" y="279">GND</text>
    <text x="568" y="309">3V3</text>
  </g>
  <text x="665" y="330" text-anchor="middle" font-size="10" fill="#8a97a5">USART1：PA9=TX · PA10=RX</text>

  <!-- 底部清单 -->
  <text x="410" y="420" text-anchor="middle" font-size="12" fill="#5a6b7b">硬件清单：STM32F103C8T6 最小系统板 ×1 · ST-Link V2 ×1 · CH340 USB 转 TTL ×1 · 杜邦线若干</text>
  <text x="410" y="446" text-anchor="middle" font-size="12" fill="#5a6b7b">接线口诀：TX 接 RXD、RX 接 TXD 交叉相接；共地是底线；供电二选一（ST-Link 或 USB-TTL）</text>
</svg>
