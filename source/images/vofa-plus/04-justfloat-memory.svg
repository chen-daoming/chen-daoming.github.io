<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="480" fill="#fbfcfd"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">JustFloat 原理：float 如何无损走串口（小端序 + 帧尾）</text>

  <!-- 左：代码 + 内存 -->
  <text x="145" y="88" text-anchor="middle" font-size="13.5" font-weight="700" fill="#34549a">① 内存中原样拷贝（零转换）</text>
  <rect x="60" y="100" width="180" height="120" rx="8" fill="#f4f6f9" stroke="#34549a" stroke-width="1.8"/>
  <g font-family="'Consolas','Courier New',monospace" font-size="11" fill="#1f2d3d">
    <text x="76" y="130">float f = 3.1416f;</text>
    <text x="76" y="152">uint8_t buf[4];</text>
    <text x="76" y="174">memcpy(buf, &amp;f, 4);</text>
    <text x="76" y="196">uart_send(buf, 4);</text>
  </g>

  <text x="146" y="240" text-anchor="middle" font-size="11.5" fill="#5a6b7b">f 在内存里的 4 个字节（小端：低字节在前）</text>
  <g font-family="'Consolas','Courier New',monospace" font-size="14" text-anchor="middle">
    <rect x="60" y="250" width="40" height="40" rx="4" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.6"/>
    <text x="80" y="275" fill="#1f2d3d">DA</text>
    <rect x="104" y="250" width="40" height="40" rx="4" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.6"/>
    <text x="124" y="275" fill="#1f2d3d">0F</text>
    <rect x="148" y="250" width="40" height="40" rx="4" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.6"/>
    <text x="168" y="275" fill="#1f2d3d">49</text>
    <rect x="192" y="250" width="40" height="40" rx="4" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.6"/>
    <text x="212" y="275" fill="#1f2d3d">40</text>
  </g>
  <g font-family="'Consolas','Courier New',monospace" font-size="9" fill="#8a97a5" text-anchor="middle">
    <text x="80" y="306">0x00</text><text x="124" y="306">0x01</text>
    <text x="168" y="306">0x02</text><text x="212" y="306">0x03</text>
  </g>
  <text x="260" y="266" font-size="12" fill="#1f2d3d" font-family="'Consolas','Courier New',monospace">= 0x40490FDA</text>
  <text x="260" y="286" font-size="11" fill="#8a97a5">= 3.1415926（IEEE754）</text>

  <!-- 中间箭头 -->
  <line x1="330" y1="270" x2="380" y2="270" stroke="#e67e22" stroke-width="3"/>
  <path d="M376 264 L388 270 L376 276 z" fill="#e67e22"/>
  <text x="357" y="256" text-anchor="middle" font-size="10.5" fill="#d35400">按字节顺序发出</text>

  <!-- 右：字节流 -->
  <text x="573" y="240" text-anchor="middle" font-size="11.5" fill="#5a6b7b">一帧 JustFloat（3 通道 = 16 字节）</text>
  <g font-family="'Consolas','Courier New',monospace" font-size="10.5" text-anchor="middle">
    <rect x="400" y="250" width="20" height="36" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="410" y="273" fill="#1f2d3d">DA</text>
    <rect x="422" y="250" width="20" height="36" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="432" y="273" fill="#1f2d3d">0F</text>
    <rect x="444" y="250" width="20" height="36" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="454" y="273" fill="#1f2d3d">49</text>
    <rect x="466" y="250" width="20" height="36" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="476" y="273" fill="#1f2d3d">40</text>

    <rect x="496" y="250" width="20" height="36" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="506" y="273" fill="#1f2d3d">00</text>
    <rect x="518" y="250" width="20" height="36" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="528" y="273" fill="#1f2d3d">00</text>
    <rect x="540" y="250" width="20" height="36" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="550" y="273" fill="#1f2d3d">80</text>
    <rect x="562" y="250" width="20" height="36" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="572" y="273" fill="#1f2d3d">3F</text>

    <rect x="592" y="250" width="20" height="36" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="602" y="273" fill="#1f2d3d">00</text>
    <rect x="614" y="250" width="20" height="36" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="624" y="273" fill="#1f2d3d">00</text>
    <rect x="636" y="250" width="20" height="36" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="646" y="273" fill="#1f2d3d">20</text>
    <rect x="658" y="250" width="20" height="36" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <text x="668" y="273" fill="#1f2d3d">40</text>

    <rect x="688" y="250" width="20" height="36" rx="3" fill="#fdeaea" stroke="#c0392b" stroke-width="1.6"/>
    <text x="698" y="273" fill="#c0392b">00</text>
    <rect x="710" y="250" width="20" height="36" rx="3" fill="#fdeaea" stroke="#c0392b" stroke-width="1.6"/>
    <text x="720" y="273" fill="#c0392b">00</text>
    <rect x="732" y="250" width="20" height="36" rx="3" fill="#fdeaea" stroke="#c0392b" stroke-width="1.6"/>
    <text x="742" y="273" fill="#c0392b">80</text>
    <rect x="754" y="250" width="20" height="36" rx="3" fill="#fdeaea" stroke="#c0392b" stroke-width="1.6"/>
    <text x="764" y="273" fill="#c0392b">7F</text>
  </g>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <text x="443" y="308" fill="#27ae60">f[0]</text>
    <text x="539" y="308" fill="#27ae60">f[1]</text>
    <text x="635" y="308" fill="#27ae60">f[2]</text>
    <text x="731" y="308" fill="#c0392b">帧尾</text>
  </g>
  <text x="587" y="330" text-anchor="middle" font-size="10.5" fill="#8a97a5">VOFA+ 收到后按 4 字节重组 float，还原成曲线</text>

  <!-- 底部解释带 -->
  <rect x="60" y="352" width="700" height="104" rx="8" fill="#eaf2fb"/>
  <text x="80" y="380" font-size="11.5" fill="#1f2d3d">· IEEE754 规定 0x7F800000 是 +Inf：只有除零 / 溢出才会算出它，正常采样数据永远碰不到 → 不会误切帧</text>
  <text x="80" y="406" font-size="11.5" fill="#1f2d3d">· STM32 是小端机，float 在内存里本来就低字节在前 → memcpy 后无需任何字节序转换，零开销</text>
  <text x="80" y="432" font-size="11.5" fill="#1f2d3d">· 发送端不格式化、接收端不解析字符串，每通道只花 4 字节 —— 这就是 JustFloat 快的原因</text>
</svg>
