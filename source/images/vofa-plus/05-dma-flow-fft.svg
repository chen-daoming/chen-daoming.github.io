<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="480" fill="#fbfcfd"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">非阻塞发送与数据分析：DMA 流程 · 带宽账 · FFT</text>

  <!-- ============ 左：DMA 流程 ============ -->
  <g text-anchor="middle">
    <rect x="70" y="100" width="180" height="38" rx="6" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.8"/>
    <text x="160" y="124" font-size="12" fill="#1f2d3d">float ch[3] 采样值</text>
    <rect x="70" y="155" width="180" height="38" rx="6" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.8"/>
    <text x="160" y="179" font-size="12" fill="#1f2d3d">组帧：数据 + 帧尾</text>
    <rect x="70" y="210" width="180" height="38" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
    <text x="160" y="234" font-size="12" fill="#1f2d3d">HAL_UART_Transmit_DMA</text>
    <rect x="70" y="265" width="180" height="38" rx="6" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.8"/>
    <text x="160" y="289" font-size="12" fill="#1f2d3d">USART1 硬件自动发送</text>
    <rect x="70" y="320" width="180" height="38" rx="6" fill="#fdf1e7" stroke="#d35400" stroke-width="1.8"/>
    <text x="160" y="344" font-size="12" fill="#1f2d3d">CH340 → VOFA+ 画线</text>
  </g>
  <g stroke="#8a97a5" stroke-width="2" fill="#8a97a5">
    <line x1="160" y1="138" x2="160" y2="149"/><path d="M156 149 L160 157 L164 149 z"/>
    <line x1="160" y1="193" x2="160" y2="204"/><path d="M156 204 L160 212 L164 204 z"/>
    <line x1="160" y1="248" x2="160" y2="259"/><path d="M156 259 L160 267 L164 259 z"/>
    <line x1="160" y1="303" x2="160" y2="314"/><path d="M156 314 L160 322 L164 314 z"/>
  </g>

  <!-- CPU 旁路 -->
  <rect x="300" y="210" width="116" height="38" rx="6" fill="#f0faf4" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="358" y="234" font-size="12" font-weight="700" fill="#27ae60">CPU 控制环</text>
  <line x1="250" y1="229" x2="300" y2="229" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="300" y1="240" x2="250" y2="240" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="358" y="272" text-anchor="middle" font-size="10.5" fill="#1e8449">DMA 占线就丢弃本帧</text>
  <text x="358" y="290" text-anchor="middle" font-size="10.5" fill="#1e8449">绝不阻塞控制循环</text>

  <text x="160" y="396" text-anchor="middle" font-size="11.5" fill="#5a6b7b">一句话：串口只“点火”，运输全程由 DMA 硬件完成</text>

  <!-- ============ 右：带宽账 + FFT ============ -->
  <text x="470" y="110" font-size="13.5" font-weight="700" fill="#34549a">带宽账：3 通道 JustFloat（16 B / 帧）</text>
  <text x="470" y="138" font-size="11.5" fill="#1f2d3d" font-family="'Consolas','Courier New',monospace">115200 bps ≈ 11.5 KB/s → 720 帧/s</text>
  <text x="470" y="160" font-size="11.5" fill="#1f2d3d" font-family="'Consolas','Courier New',monospace">921600 bps ≈ 92 KB/s → 5760 帧/s</text>
  <text x="470" y="184" font-size="11.5" fill="#5a6b7b">FFT 看谱线：采样率 ≥ 2 × 信号最高频率（采样定理）</text>

  <!-- 时域 -->
  <rect x="470" y="210" width="290" height="105" fill="#fbfdff" stroke="#d5dde5"/>
  <text x="478" y="226" font-size="10.5" fill="#8a97a5">时域波形</text>
  <path d="M475 262 C485 222 500 222 510 250 C516 266 524 268 532 252 C540 236 556 236 566 262 C576 288 592 290 602 268 C610 252 618 252 626 266 C634 280 650 284 660 262 C670 240 686 236 696 256 C704 270 712 270 720 258 C728 246 744 244 755 262" fill="none" stroke="#e67e22" stroke-width="2.2"/>
  <text x="615" y="332" text-anchor="middle" font-size="10.5" fill="#5a6b7b">1Hz 基波 + 3 次谐波的合成信号</text>

  <!-- 频域 -->
  <rect x="470" y="346" width="290" height="110" fill="#fbfdff" stroke="#d5dde5"/>
  <text x="478" y="362" font-size="10.5" fill="#8a97a5">频域（VOFA+ 自带 FFT）</text>
  <line x1="478" y1="430" x2="752" y2="430" stroke="#8a97a5" stroke-width="1.4"/>
  <line x1="530" y1="430" x2="530" y2="384" stroke="#e67e22" stroke-width="5"/>
  <line x1="655" y1="430" x2="655" y2="408" stroke="#27ae60" stroke-width="4"/>
  <text x="530" y="446" text-anchor="middle" font-size="10" fill="#d35400" font-weight="600">1 Hz（基波）</text>
  <text x="655" y="446" text-anchor="middle" font-size="10" fill="#1e8449" font-weight="600">3 Hz（谐波）</text>
</svg>
