<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="480" fill="#fbfcfd"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">配套实测：钳位波形台架与受保护输入电路</text>

  <!-- ============ 左：测试台架 ============ -->
  <text x="215" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#2980b9">① 钳位波形实测台架</text>

  <!-- 浪涌源 -->
  <rect x="50" y="100" width="130" height="90" rx="8" fill="#fdf1e7" stroke="#d35400" stroke-width="2"/>
  <text x="115" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#d35400">浪涌 / 静电源</text>
  <text x="115" y="150" text-anchor="middle" font-size="10.5" fill="#5a6b7b">信号发生器 + 功放</text>
  <text x="115" y="168" text-anchor="middle" font-size="10.5" fill="#5a6b7b">（或 1.2/50µs 组合波）</text>

  <!-- DUT 板 -->
  <rect x="240" y="96" width="170" height="100" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.2"/>
  <text x="325" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#27ae60">DUT 板（待验证）</text>
  <!-- TVS 符号 -->
  <line x1="270" y1="150" x2="380" y2="150" stroke="#1f2d3d" stroke-width="2"/>
  <line x1="310" y1="138" x2="310" y2="162" stroke="#1f2d3d" stroke-width="2.4"/>
  <line x1="330" y1="138" x2="330" y2="162" stroke="#1f2d3d" stroke-width="2.4"/>
  <path d="M310 138 L330 150 L310 162 z" fill="#27ae60"/>
  <line x1="310" y1="162" x2="310" y2="176" stroke="#1f2d3d" stroke-width="2"/>
  <line x1="330" y1="162" x2="330" y2="176" stroke="#1f2d3d" stroke-width="2"/>
  <line x1="302" y1="176" x2="338" y2="176" stroke="#1f2d3d" stroke-width="2"/>
  <text x="325" y="190" text-anchor="middle" font-size="9.5" fill="#5a6b7b">TVS 到地（越近越好）</text>

  <!-- 示波器 -->
  <rect x="130" y="240" width="220" height="120" rx="8" fill="#eef2f8" stroke="#34549a" stroke-width="2"/>
  <rect x="146" y="254" width="188" height="72" rx="4" fill="#1f2d3d"/>
  <!-- 钳位波形：方波顶部被削平 -->
  <polyline points="154,308 178,308 182,290 236,290 240,308 300,308 304,290 326,290" fill="none" stroke="#e67e22" stroke-width="2.4"/>
  <text x="240" y="316" text-anchor="middle" font-size="8.5" fill="#82d193" font-family="'Consolas',monospace">clamped @ V_C</text>
  <text x="240" y="344" text-anchor="middle" font-size="11.5" font-weight="700" fill="#34549a">示波器（带宽 ≥ 100MHz）</text>

  <!-- 探头连线 -->
  <line x1="352" y1="196" x2="330" y2="254" stroke="#8a97a5" stroke-width="1.8" stroke-dasharray="5 3"/>
  <line x1="270" y1="196" x2="230" y2="254" stroke="#8a97a5" stroke-width="1.8" stroke-dasharray="5 3"/>
  <line x1="180" y1="190" x2="200" y2="240" stroke="#d35400" stroke-width="2.4"/>
  <text x="150" y="222" font-size="10" fill="#d35400">注入</text>

  <text x="215" y="396" text-anchor="middle" font-size="11.5" fill="#5a6b7b">观测点：不加 TVS 的过冲 vs 加 TVS 后的钳位平台</text>
  <text x="215" y="416" text-anchor="middle" font-size="11.5" fill="#5a6b7b">验收线：V_C 平台 ≤ 后级芯片绝对最大额定值</text>

  <!-- ============ 右：受保护输入 ============ -->
  <text x="620" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#27ae60">② STM32 受保护输入（按键 / 传感器线）</text>

  <!-- 连接器 -->
  <rect x="470" y="130" width="26" height="90" rx="5" fill="#eceff3" stroke="#8a97a5" stroke-width="1.8"/>
  <text x="483" y="244" text-anchor="middle" font-size="10.5" fill="#8a97a5">外部输入</text>

  <!-- 走线 -->
  <line x1="496" y1="150" x2="560" y2="150" stroke="#1f2d3d" stroke-width="2"/>
  <!-- 串联电阻 -->
  <rect x="560" y="140" width="56" height="20" rx="4" fill="#fdf1e7" stroke="#d35400" stroke-width="1.8"/>
  <text x="588" y="134" text-anchor="middle" font-size="10.5" fill="#d35400">R 100Ω~1kΩ</text>
  <line x1="616" y1="150" x2="770" y2="150" stroke="#1f2d3d" stroke-width="2"/>
  <text x="770" y="134" text-anchor="end" font-size="11" fill="#34549a" font-weight="600">MCU 引脚（如 PA0）</text>

  <!-- TVS 挂在电阻外侧 -->
  <line x1="540" y1="150" x2="540" y2="200" stroke="#1f2d3d" stroke-width="2"/>
  <line x1="528" y1="200" x2="552" y2="200" stroke="#1f2d3d" stroke-width="2.4"/>
  <line x1="548" y1="200" x2="528" y2="216" stroke="#1f2d3d" stroke-width="2.4"/>
  <path d="M528 200 L548 200 L528 216 z" fill="#27ae60" stroke="#27ae60"/>
  <line x1="548" y1="200" x2="548" y2="216" stroke="#1f2d3d" stroke-width="2.4"/>
  <line x1="520" y1="216" x2="556" y2="216" stroke="#1f2d3d" stroke-width="2"/>
  <line x1="526" y1="222" x2="550" y2="222" stroke="#1f2d3d" stroke-width="2"/>
  <text x="560" y="214" font-size="10.5" fill="#27ae60" font-weight="600">ESD/TVS 管贴连接器</text>

  <!-- 滤波电容 -->
  <line x1="700" y1="150" x2="700" y2="190" stroke="#1f2d3d" stroke-width="2"/>
  <line x1="688" y1="190" x2="712" y2="190" stroke="#1f2d3d" stroke-width="2.4"/>
  <line x1="688" y1="198" x2="712" y2="198" stroke="#1f2d3d" stroke-width="2.4"/>
  <line x1="700" y1="198" x2="700" y2="216" stroke="#1f2d3d" stroke-width="2"/>
  <line x1="686" y1="216" x2="714" y2="216" stroke="#1f2d3d" stroke-width="2"/>
  <text x="718" y="198" font-size="10.5" fill="#5a6b7b">10nF 滤波</text>

  <rect x="468" y="290" width="310" height="130" rx="8" fill="#f4f6f9" stroke="#34549a" stroke-width="1.6"/>
  <text x="482" y="314" font-size="11.5" font-weight="700" fill="#34549a">防护三件套顺序：ESD 管 → 限流电阻 → RC 滤波</text>
  <g font-size="11" fill="#5a6b7b">
    <text x="482" y="338">· ESD 管先把大部分浪涌电流泄到地</text>
    <text x="482" y="360">· 限流电阻扛住残余电压差与寄生尖峰</text>
    <text x="482" y="382">· RC 滤波再给 MCU 一层"软防护"</text>
    <text x="482" y="404" fill="#1f2d3d" font-weight="600">顺序不能乱：管子放电阻之后 = 白保护</text>
  </g>

  <text x="410" y="452" text-anchor="middle" font-size="12" fill="#5a6b7b">硬件清单：示波器 ≥100MHz · 信号发生器/浪涌源 · DUT 试验板 · 10:1 高压探头</text>
</svg>
