<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="480" fill="#fbfcfd"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">TVS / ESD 管的 I-V 特性与关键参数</text>

  <!-- 坐标轴 -->
  <line x1="90" y1="60" x2="90" y2="420" stroke="#5a6b7b" stroke-width="2"/>
  <line x1="90" y1="420" x2="560" y2="420" stroke="#5a6b7b" stroke-width="2"/>
  <path d="M85 68 L90 56 L95 68 z" fill="#5a6b7b"/>
  <path d="M552 415 L564 420 L552 425 z" fill="#5a6b7b"/>
  <text x="70" y="72" text-anchor="end" font-size="12" fill="#5a6b7b">电流 I</text>
  <text x="556" y="444" text-anchor="end" font-size="12" fill="#5a6b7b">电压 V</text>

  <!-- 反向击穿前的漏电流段（几乎贴着负半轴走） -->
  <line x1="90" y1="420" x2="300" y2="416" stroke="#2980b9" stroke-width="2.5"/>
  <!-- 击穿拐点 VBR -->
  <circle cx="300" cy="416" r="5" fill="#2980b9"/>
  <line x1="300" y1="416" x2="300" y2="420" stroke="#8a97a5" stroke-width="1"/>
  <text x="300" y="452" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2980b9">V_BR（击穿电压 @ 1mA）</text>
  <text x="215" y="438" font-size="10.5" fill="#8a97a5">漏电流 I_R ≈ 1µA</text>

  <!-- 雪崩导通段（陡升） -->
  <line x1="300" y1="416" x2="392" y2="330" stroke="#e67e22" stroke-width="3"/>
  <line x1="392" y1="330" x2="430" y2="270" stroke="#e67e22" stroke-width="3"/>
  <!-- VC/IPP 工作点 -->
  <circle cx="430" cy="270" r="5.5" fill="#c0392b"/>
  <line x1="430" y1="270" x2="430" y2="420" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="90" y1="270" x2="430" y2="270" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="444" y="266" font-size="12.5" font-weight="700" fill="#c0392b">C：钳位电压 V_C</text>
  <text x="444" y="284" font-size="11" fill="#c0392b">（@ 峰值脉冲电流 I_PP）</text>
  <text x="470" y="300" font-size="11" fill="#8a97a5">浪涌被钳在这里</text>

  <!-- VRWM 虚线（工作电压上限，管子不动作） -->
  <line x1="215" y1="420" x2="215" y2="70" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="208" y="80" text-anchor="end" font-size="12.5" font-weight="700" fill="#27ae60">V_RWM（最高工作电压）</text>
  <text x="208" y="98" text-anchor="end" font-size="10.5" fill="#27ae60">常态下管子必须"装死"</text>

  <!-- 左侧 I-V 注释 -->
  <text x="100" y="392" font-size="10.5" fill="#8a97a5">击穿前：仅 µA 级漏电</text>

  <!-- 右侧参数表 -->
  <rect x="600" y="60" width="190" height="360" rx="10" fill="#ffffff" stroke="#d5dde5"/>
  <text x="695" y="88" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">关键参数速查</text>
  <line x1="615" y1="100" x2="775" y2="100" stroke="#e3e9ee" stroke-width="1.4"/>
  <g font-size="11.5" fill="#1f2d3d">
    <text x="615" y="124" font-weight="700" fill="#27ae60">V_RWM</text>
    <text x="615" y="141" fill="#5a6b7b">≥ 信号/电源最高工作电压</text>
    <text x="615" y="168" font-weight="700" fill="#2980b9">V_BR</text>
    <text x="615" y="185" fill="#5a6b7b">≥ 1.2 × V_RWM 才靠谱</text>
    <text x="615" y="212" font-weight="700" fill="#c0392b">V_C</text>
    <text x="615" y="229" fill="#5a6b7b">≤ 后级芯片耐受极限</text>
    <text x="615" y="256" font-weight="700" fill="#d35400">I_PP</text>
    <text x="615" y="273" fill="#5a6b7b">按浪涌等级 8/20µs 查</text>
    <text x="615" y="300" font-weight="700" fill="#8e44ad">C_J</text>
    <text x="615" y="317" fill="#5a6b7b">高速口：≤ 数 pF</text>
    <text x="615" y="334" fill="#5a6b7b">电源线：无所谓</text>
    <text x="615" y="361" font-weight="700" fill="#34549a">P_PP</text>
    <text x="615" y="378" fill="#5a6b7b">峰值脉冲功率 = V_C×I_PP</text>
    <text x="615" y="395" fill="#5a6b7b">留 30% 以上裕量</text>
  </g>

  <!-- 底部结论 -->
  <text x="325" y="470" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">选型主线：V_RWM 卡住"平时不误动"，V_C / I_PP 卡住"浪涌时压得住"</text>
</svg>
