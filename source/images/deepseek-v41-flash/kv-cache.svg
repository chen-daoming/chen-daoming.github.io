<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="800" height="350" fill="#f8f9fa"/>
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">KV Cache 压缩进展</text>

  <!-- 柱状图区域 -->
  <rect x="80" y="60" width="640" height="220" rx="10" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
  
  <!-- Y轴 -->
  <line x1="120" y1="80" x2="120" y2="260" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="100" y="175" text-anchor="middle" font-size="11" fill="#78909c" transform="rotate(-90,100,175)">KV Cache 大小（相对值）</text>
  
  <!-- X轴 -->
  <line x1="120" y1="260" x2="680" y2="260" stroke="#90a4ae" stroke-width="1.5"/>

  <!-- 柱子 -->
  <!-- V1 -->
  <rect x="160" y="90" width="80" height="170" rx="4" fill="#ef5350" opacity="0.9"/>
  <text x="200" y="280" text-anchor="middle" font-size="12" fill="#455a64">V1</text>
  <text x="200" y="85" text-anchor="middle" font-size="11" fill="#c62828" font-weight="600">1x</text>

  <!-- V2 -->
  <rect x="270" y="130" width="80" height="130" rx="4" fill="#ff7043" opacity="0.9"/>
  <text x="310" y="280" text-anchor="middle" font-size="12" fill="#455a64">V2</text>
  <text x="310" y="125" text-anchor="middle" font-size="11" fill="#d84315" font-weight="600">~3x</text>

  <!-- V3 -->
  <rect x="380" y="170" width="80" height="90" rx="4" fill="#ffa726" opacity="0.9"/>
  <text x="420" y="280" text-anchor="middle" font-size="12" fill="#455a64">V3</text>
  <text x="420" y="165" text-anchor="middle" font-size="11" fill="#e65100" font-weight="600">~10x</text>

  <!-- V4 Flash -->
  <rect x="490" y="210" width="80" height="50" rx="4" fill="#66bb6a" opacity="0.9"/>
  <text x="530" y="280" text-anchor="middle" font-size="12" fill="#455a64">V4 Flash</text>
  <text x="530" y="205" text-anchor="middle" font-size="11" fill="#2e7d32" font-weight="600">~50x</text>

  <!-- V4.1 Flash -->
  <rect x="600" y="245" width="80" height="15" rx="4" fill="#2196F3" opacity="0.9"/>
  <text x="640" y="280" text-anchor="middle" font-size="12" fill="#455a64">V4.1 Flash</text>
  <text x="640" y="240" text-anchor="middle" font-size="11" fill="#0d47a1" font-weight="700">437x</text>

  <!-- 标注箭头 -->
  <path d="M640 248 L640 230 L645 235" fill="none" stroke="#0d47a1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 右侧说明 -->
  <rect x="500" y="300" width="260" height="35" rx="6" fill="#e3f2fd"/>
  <text x="630" y="322" text-anchor="middle" font-size="12" fill="#1565C0" font-weight="600">V4.1 Flash: KV Cache 缩小 437 倍</text>

  <!-- 底部说明 -->
  <rect x="80" y="300" width="400" height="35" rx="6" fill="#fff3e0"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#e65100">HBM 需求减少 1/4，SSD 需求减少 1/8</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d47a1"/>
    </marker>
  </defs>
</svg>
