<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="800" height="400" fill="#f8f9fa"/>
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">开发者迁移指南</text>

  <!-- 顶部：旧模型 -->
  <rect x="100" y="60" width="600" height="60" rx="10" fill="#ffebee" stroke="#ef5350" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#c62828">旧模型（已下线/路由）</text>
  <text x="400" y="105" text-anchor="middle" font-size="12" fill="#e57373">deepseek-v4-flash · deepseek-v4-flash-vision-exp · deepseek-v4-pro</text>

  <!-- 箭头 -->
  <path d="M400 125 L400 160" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="148" font-size="11" fill="#78909c">自动路由</text>

  <!-- 中间：新模型 -->
  <rect x="150" y="165" width="500" height="70" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="400" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#2e7d32">deepseek-flash (V4.1 Flash)</text>
  <text x="400" y="215" text-anchor="middle" font-size="12" fill="#66bb6a">全新架构 · 原生多模态 · 更快更强更便宜</text>

  <!-- 三个分支 -->
  <!-- 分支1：新项目 -->
  <rect x="50" y="270" width="200" height="100" rx="8" fill="#e3f2fd" stroke="#2196F3" stroke-width="1.5"/>
  <text x="150" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#1565C0">新项目</text>
  <text x="150" y="318" text-anchor="middle" font-size="11" fill="#455a64">直接使用</text>
  <rect x="70" y="330" width="160" height="28" rx="4" fill="#bbdefb"/>
  <text x="150" y="349" text-anchor="middle" font-size="11" fill="#0d47a1" font-family="monospace">model="deepseek-flash"</text>

  <!-- 分支2：V4 Flash 用户 -->
  <rect x="300" y="270" width="200" height="100" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="400" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">V4 Flash 用户</text>
  <text x="400" y="318" text-anchor="middle" font-size="11" fill="#455a64">无需修改，自动升级</text>
  <rect x="320" y="330" width="160" height="28" rx="4" fill="#ffe0b2"/>
  <text x="400" y="349" text-anchor="middle" font-size="11" fill="#e65100" font-family="monospace">保持现有调用即可</text>

  <!-- 分支3：V4 Pro 用户 -->
  <rect x="550" y="270" width="200" height="100" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="650" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#6a1b9a">V4 Pro 用户</text>
  <text x="650" y="318" text-anchor="middle" font-size="11" fill="#455a64">自动享受 Flash 定价</text>
  <rect x="570" y="330" width="160" height="28" rx="4" fill="#e1bee7"/>
  <text x="650" y="349" text-anchor="middle" font-size="11" fill="#6a1b9a" font-family="monospace">费用降低约 3 倍</text>

  <!-- 连接线 -->
  <line x1="400" y1="235" x2="150" y2="270" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="400" y1="235" x2="400" y2="270" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="400" y1="235" x2="650" y2="270" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- 底部提示 -->
  <rect x="100" y="380" width="600" height="1" fill="#e0e0e0"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#546e7a"/>
    </marker>
  </defs>
</svg>
