<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="ui-monospace,monospace">
<!-- 串联 RLC 谐振电路。元件轴向竖排: Vin(左) → R(130) → L(215) → C(300) → 输出(右) -->
<rect width="560" height="320" rx="10" fill="#1b2026"/>
<text x="280" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e9edf2" font-family="'Microsoft YaHei','PingFang SC',sans-serif">串联谐振 RLC 电路</text>
<text x="280" y="56" text-anchor="middle" font-size="11.5" fill="#6b7683">谐振时感抗=容抗，阻抗最小 = R，电流最大</text>

<!-- 主回路水平中线 y=160: Vin左(60) → R(118..146) → L(168..232) → C(252..300) → Vout(360) -->
<!-- Vin 端子 -->
<circle cx="60" cy="160" r="4.5" fill="none" stroke="#e0a34b" stroke-width="1.8"/>
<text x="40" y="140" font-size="12" font-weight="700" fill="#e0a34b">Vin</text>

<!-- 导线 Vin→R -->
<line x1="60" y1="160" x2="118" y2="160" stroke="#98a4b1" stroke-width="1.8"/>
<!-- R: 竖排矩形 x=118..146 y 中 160 -->
<rect x="118" y="144" width="14" height="32" rx="2" fill="rgba(224,163,75,0.08)" stroke="#e9edf2" stroke-width="1.6"/>
<text x="142" y="150" font-size="12" font-weight="600" fill="#e9edf2">R</text>
<line x1="132" y1="160" x2="168" y2="160" stroke="#98a4b1" stroke-width="1.8"/>

<!-- L: 4 段弧 -->
<path d="M168 160 q8 -18 18 0 q8 -18 18 0 q8 -18 18 0 q8 -18 18 0" fill="none" stroke="#e0a34b" stroke-width="2.2"/>
<text x="196" y="138" font-size="12" font-weight="600" fill="#e0a34b" text-anchor="middle">L</text>
<line x1="240" y1="160" x2="252" y2="160" stroke="#98a4b1" stroke-width="1.8"/>

<!-- C: 两条竖板 -->
<line x1="252" y1="160" x2="252" y2="176" stroke="#98a4b1" stroke-width="1.8"/>
<line x1="252" y1="144" x2="252" y2="128" stroke="#98a4b1" stroke-width="1.8"/>
<line x1="242" y1="128" x2="262" y2="128" stroke="#98a4b1" stroke-width="2.4"/>
<line x1="242" y1="176" x2="262" y2="176" stroke="#98a4b1" stroke-width="2.4"/>
<text x="270" y="150" font-size="12" font-weight="600" fill="#e9edf2">C</text>
<line x1="252" y1="128" x2="252" y2="118" stroke="#98a4b1" stroke-width="1.8"/>
<line x1="252" y1="176" x2="252" y2="186" stroke="#98a4b1" stroke-width="1.8"/>
<line x1="252" y1="160" x2="330" y2="160" stroke="#98a4b1" stroke-width="1.8"/>
<line x1="262" y1="176" x2="262" y2="186" stroke="#98a4b1" stroke-width="0" opacity="0"/>

<!-- 输出 -->
<circle cx="330" cy="160" r="4.5" fill="none" stroke="#a7e8ba" stroke-width="1.8"/>
<text x="342" y="164" font-size="12" font-weight="700" fill="#a7e8ba">Vout</text>

<!-- 底部公式条 -->
<rect x="50" y="240" width="460" height="44" rx="8" fill="#0c120e" stroke="#2b333c"/>
<text x="70" y="260" font-size="13.5" fill="#a7e8ba">f0 = 1 / (2π√(L·C))</text>
<text x="250" y="260" font-size="12" fill="#f0c878">Q = (1/R)·√(L/C)</text>
<text x="70" y="278" font-size="11.5" fill="#6b7683">带宽 BW = f0 / Q · 谐振时 XL = XC</text>
</svg>
