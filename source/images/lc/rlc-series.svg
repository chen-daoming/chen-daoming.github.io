<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1318"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="640" height="380" rx="12" fill="url(#bg5)"/>
  
  <!-- 标题 -->
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#e8ecf1">串联谐振 RLC 电路</text>
  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#7a8594">谐振时感抗=容抗，阻抗最小=R，电流最大</text>
  
  <!-- 主回路 -->
  <!-- Vin 端子 -->
  <circle cx="80" cy="180" r="6" fill="none" stroke="#f39c12" stroke-width="2"/>
  <text x="50" y="156" font-size="14" font-weight="700" fill="#f39c12">Vin</text>
  
  <!-- R 电阻 -->
  <line x1="80" y1="180" x2="160" y2="180" stroke="#95a5b6" stroke-width="2"/>
  <rect x="160" y="164" width="50" height="32" rx="4" fill="#2c3e50" stroke="#3498db" stroke-width="2"/>
  <text x="185" y="184" text-anchor="middle" font-size="14" font-weight="600" fill="#ecf0f1">R</text>
  <line x1="210" y1="180" x2="260" y2="180" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- L 电感（标准符号） -->
  <path d="M260 180 C270 180, 270 160, 280 160 C290 160, 290 180, 300 180 C310 180, 310 160, 320 160 C330 160, 330 180, 340 180 C350 180, 350 160, 360 160 C370 160, 370 180, 380 180" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="320" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#e74c3c">L</text>
  <line x1="380" y1="180" x2="420" y2="180" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- C 电容（标准符号） -->
  <line x1="420" y1="180" x2="420" y2="140" stroke="#95a5b6" stroke-width="2"/>
  <line x1="400" y1="140" x2="440" y2="140" stroke="#2ecc71" stroke-width="3"/>
  <line x1="400" y1="220" x2="440" y2="220" stroke="#2ecc71" stroke-width="3"/>
  <line x1="420" y1="220" x2="420" y2="260" stroke="#95a5b6" stroke-width="2"/>
  <text x="450" y="184" font-size="14" font-weight="600" fill="#2ecc71">C</text>
  
  <!-- 输出 -->
  <line x1="420" y1="180" x2="520" y2="180" stroke="#95a5b6" stroke-width="2"/>
  <circle cx="520" cy="180" r="6" fill="none" stroke="#2ecc71" stroke-width="2"/>
  <text x="536" y="185" font-size="14" font-weight="700" fill="#2ecc71">Vout</text>
  
  <!-- 地线 -->
  <line x1="420" y1="260" x2="420" y2="290" stroke="#95a5b6" stroke-width="2"/>
  <line x1="406" y1="290" x2="434" y2="290" stroke="#95a5b6" stroke-width="2.5"/>
  <line x1="410" y1="298" x2="430" y2="298" stroke="#95a5b6" stroke-width="2"/>
  <line x1="414" y1="306" x2="426" y2="306" stroke="#95a5b6" stroke-width="1.5"/>
  
  <!-- 连接点 -->
  <circle cx="420" cy="180" r="4" fill="#2ecc71"/>
  
  <!-- 底部公式 -->
  <rect x="40" y="320" width="560" height="44" rx="8" fill="#0d1117" stroke="#21262d"/>
  <text x="70" y="340" font-size="14" font-weight="600" fill="#2ecc71">f0 = 1/(2π√(L·C))</text>
  <text x="280" y="340" font-size="13" fill="#f39c12">Q = (1/R)·√(L/C)</text>
  <text x="70" y="358" font-size="11" fill="#7a8594">带宽 BW = f0/Q · 谐振时 XL = XC</text>
</svg>