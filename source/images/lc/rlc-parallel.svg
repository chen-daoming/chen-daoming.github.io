<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="ui-monospace,monospace">
<!-- 并联谐振 RLC 电路。LC 并联支路在中间, R 并联表示损耗 -->
<rect width="560" height="320" rx="10" fill="#1b2026"/>
<text x="280" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e9edf2" font-family="'Microsoft YaHei','PingFang SC',sans-serif">并联谐振 RLC 电路</text>
<text x="280" y="56" text-anchor="middle" font-size="11.5" fill="#6b7683">谐振时总阻抗最大(Z≈R·Q)，回路电流是总电流的 Q 倍</text>

<!-- 上下母线 y=96 与 y=224; LC 并排竖跨两条母线 -->
<line x1="120" y1="96" x2="380" y2="96" stroke="#98a4b1" stroke-width="2"/>
<line x1="120" y1="224" x2="380" y2="224" stroke="#98a4b1" stroke-width="2"/>

<!-- LC 并排竖跨两条母线: L(x=180)、C(x=300)、R(x=245 之间) -->
<!-- L 竖放: x=180, y 96..224 -->
<path d="M180 96 q8 -18 18 0 q8 -18 18 0 q8 -18 18 0 q8 -18 18 0" fill="none" stroke="#e0a34b" stroke-width="2.4"/>
<text x="210" y="116" font-size="12" font-weight="600" fill="#e0a34b">L</text>

<!-- C 竖放: x=300, y 96..224 -->
<line x1="300" y1="96" x2="300" y2="112" stroke="#98a4b1" stroke-width="2"/>
<line x1="290" y1="112" x2="310" y2="112" stroke="#98a4b1" stroke-width="2.6"/>
<line x1="290" y1="208" x2="310" y2="208" stroke="#98a4b1" stroke-width="2.6"/>
<line x1="300" y1="208" x2="300" y2="224" stroke="#98a4b1" stroke-width="2"/>
<text x="322" y="160" font-size="12" font-weight="600" fill="#e9edf2">C</text>

<!-- R 并联: x=245 位于 L、C 之间 -->
<rect x="235" y="144" width="20" height="32" rx="3" fill="rgba(224,163,75,0.08)" stroke="#e9edf2" stroke-width="1.6"/>
<line x1="245" y1="96" x2="245" y2="144" stroke="#98a4b1" stroke-width="2"/>
<line x1="245" y1="176" x2="245" y2="224" stroke="#98a4b1" stroke-width="2"/>
<text x="258" y="132" font-size="12" font-weight="600" fill="#e9edf2">R</text>

<!-- Vin 左母线 -->
<line x1="80" y1="96" x2="120" y2="96" stroke="#98a4b1" stroke-width="2"/>
<circle cx="80" cy="96" r="4.5" fill="none" stroke="#e0a34b" stroke-width="1.8"/>
<text x="60" y="80" font-size="12" font-weight="700" fill="#e0a34b">Vin</text>

<!-- Vout 右母线 -->
<line x1="310" y1="96" x2="470" y2="96" stroke="#98a4b1" stroke-width="2"/>
<line x1="310" y1="224" x2="470" y2="224" stroke="#98a4b1" stroke-width="2"/>
<circle cx="470" cy="96" r="4.5" fill="none" stroke="#a7e8ba" stroke-width="1.8"/>
<text x="478" y="80" font-size="12" font-weight="700" fill="#a7e8ba">Vout</text>

<!-- 底部公式 -->
<rect x="50" y="250" width="460" height="44" rx="8" fill="#0c120e" stroke="#2b333c"/>
<text x="70" y="270" font-size="13.5" fill="#a7e8ba">f0 = 1/(2π√(LC))</text>
<text x="250" y="270" font-size="12" fill="#f0c878">Q = R·√(C/L)</text>
<text x="70" y="288" font-size="11.5" fill="#6b7683">并联谐振 Zmax ≈ R·Q = L/(C·R)</text>
</svg>