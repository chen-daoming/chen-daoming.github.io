<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1318"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="640" height="400" rx="12" fill="url(#bg6)"/>
  
  <!-- 标题 -->
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#e8ecf1">并联谐振 RLC 电路</text>
  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#7a8594">谐振时总阻抗最大(Z≈R·Q)，回路电流是总电流的Q倍</text>
  
  <!-- 上下母线 -->
  <line x1="140" y1="120" x2="500" y2="120" stroke="#95a5b6" stroke-width="2.5"/>
  <line x1="140" y1="300" x2="500" y2="300" stroke="#95a5b6" stroke-width="2.5"/>
  
  <!-- Vin 输入 -->
  <line x1="80" y1="120" x2="140" y2="120" stroke="#95a5b6" stroke-width="2"/>
  <circle cx="80" cy="120" r="6" fill="none" stroke="#f39c12" stroke-width="2"/>
  <text x="50" y="96" font-size="14" font-weight="700" fill="#f39c12">Vin</text>
  
  <!-- L 电感支路 -->
  <line x1="220" y1="120" x2="220" y2="150" stroke="#95a5b6" stroke-width="2"/>
  <path d="M220 150 C230 150, 230 130, 240 130 C250 130, 250 150, 260 150 C270 150, 270 130, 280 130 C290 130, 290 150, 300 150 C310 150, 310 130, 320 130 C330 130, 330 150, 340 150" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="320" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#e74c3c">L</text>
  <line x1="220" y1="150" x2="220" y2="300" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- R 电阻支路 -->
  <line x1="340" y1="120" x2="340" y2="170" stroke="#95a5b6" stroke-width="2"/>
  <rect x="327" y="170" width="26" height="60" rx="4" fill="#2c3e50" stroke="#3498db" stroke-width="2"/>
  <text x="340" y="204" text-anchor="middle" font-size="14" font-weight="600" fill="#ecf0f1">R</text>
  <line x1="340" y1="230" x2="340" y2="300" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- C 电容支路 -->
  <line x1="440" y1="120" x2="440" y2="190" stroke="#95a5b6" stroke-width="2"/>
  <line x1="420" y1="190" x2="460" y2="190" stroke="#2ecc71" stroke-width="3"/>
  <line x1="420" y1="230" x2="460" y2="230" stroke="#2ecc71" stroke-width="3"/>
  <text x="470" y="214" font-size="14" font-weight="600" fill="#2ecc71">C</text>
  <line x1="440" y1="230" x2="440" y2="300" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- Vout 输出 -->
  <line x1="500" y1="120" x2="560" y2="120" stroke="#95a5b6" stroke-width="2"/>
  <circle cx="560" cy="120" r="6" fill="none" stroke="#2ecc71" stroke-width="2"/>
  <text x="576" y="125" font-size="14" font-weight="700" fill="#2ecc71">Vout</text>
  
  <!-- 连接点 -->
  <circle cx="220" cy="120" r="4" fill="#2ecc71"/>
  <circle cx="340" cy="120" r="4" fill="#2ecc71"/>
  <circle cx="440" cy="120" r="4" fill="#2ecc71"/>
  
  <!-- 底部公式 -->
  <rect x="40" y="340" width="560" height="44" rx="8" fill="#0d1117" stroke="#21262d"/>
  <text x="70" y="360" font-size="14" font-weight="600" fill="#2ecc71">f0 = 1/(2π√(L·C))</text>
  <text x="280" y="360" font-size="13" fill="#f39c12">Q = R·√(C/L)</text>
  <text x="70" y="378" font-size="11" fill="#7a8594">并联谐振 Zmax ≈ R·Q = L/(C·R)</text>
</svg>