<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1318"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="640" height="380" rx="12" fill="url(#bg7)"/>
  
  <!-- 标题 -->
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#e8ecf1">LC 二阶低通滤波器</text>
  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#7a8594">转折频率 fc 处 −3dB，之后以 −40dB/十倍频滚降</text>
  
  <!-- Vin 输入 -->
  <circle cx="80" cy="180" r="6" fill="none" stroke="#f39c12" stroke-width="2"/>
  <text x="50" y="156" font-size="14" font-weight="700" fill="#f39c12">Vin</text>
  
  <!-- L 电感（串联） -->
  <line x1="80" y1="180" x2="180" y2="180" stroke="#95a5b6" stroke-width="2"/>
  <path d="M180 180 C190 180, 190 160, 200 160 C210 160, 210 180, 220 180 C230 180, 230 160, 240 160 C250 160, 250 180, 260 180 C270 180, 270 160, 280 160 C290 160, 290 180, 300 180 C310 180, 310 160, 320 160 C330 160, 330 180, 340 180" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="260" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#e74c3c">L</text>
  <line x1="340" y1="180" x2="400" y2="180" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- 节点 -->
  <circle cx="400" cy="180" r="5" fill="#2ecc71"/>
  
  <!-- C 电容（并联到地） -->
  <line x1="400" y1="180" x2="400" y2="220" stroke="#95a5b6" stroke-width="2"/>
  <line x1="380" y1="220" x2="420" y2="220" stroke="#2ecc71" stroke-width="3"/>
  <line x1="380" y1="280" x2="420" y2="280" stroke="#2ecc71" stroke-width="3"/>
  <text x="430" y="254" font-size="14" font-weight="600" fill="#2ecc71">C</text>
  <line x1="400" y1="280" x2="400" y2="310" stroke="#95a5b6" stroke-width="2"/>
  
  <!-- GND 接地 -->
  <line x1="386" y1="310" x2="414" y2="310" stroke="#95a5b6" stroke-width="2.5"/>
  <line x1="390" y1="318" x2="410" y2="318" stroke="#95a5b6" stroke-width="2"/>
  <line x1="394" y1="326" x2="406" y2="326" stroke="#95a5b6" stroke-width="1.5"/>
  
  <!-- Vout 输出 -->
  <line x1="400" y1="180" x2="520" y2="180" stroke="#95a5b6" stroke-width="2"/>
  <circle cx="520" cy="180" r="6" fill="none" stroke="#2ecc71" stroke-width="2"/>
  <text x="536" y="185" font-size="14" font-weight="700" fill="#2ecc71">Vout</text>
  
  <!-- 信号流向箭头 -->
  <path d="M120 200 L160 200 L150 190 M160 200 L150 210" fill="none" stroke="#7a8594" stroke-width="1.5"/>
  <text x="140" y="220" text-anchor="middle" font-size="10" fill="#7a8594">信号</text>
  
  <!-- 底部公式 -->
  <rect x="40" y="340" width="560" height="32" rx="6" fill="#0d1117" stroke="#21262d"/>
  <text x="70" y="362" font-size="14" font-weight="600" fill="#2ecc71">fc = 1/(2π√(L·C))</text>
  <text x="300" y="362" font-size="13" fill="#f39c12">滚降 −40dB/十倍频</text>
  <text x="490" y="362" font-size="11" fill="#7a8594">Q≈0.707</text>
</svg>