<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="ui-monospace,monospace">
<!-- LC 二阶低通滤波: Vin → L(串联) → 节点 → C(并联到地) → Vout -->
<rect width="560" height="320" rx="10" fill="#1b2026"/>
<text x="280" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e9edf2" font-family="'Microsoft YaHei','PingFang SC',sans-serif">LC 二阶低通滤波器</text>
<text x="280" y="56" text-anchor="middle" font-size="11.5" fill="#6b7683">转折频率 fc 处 −3dB，之后以 −40dB/十倍频 滚降</text>

<!-- 主线上段 y=160: Vin(60) → L(118..240) → 节点(252) -->
<circle cx="60" cy="160" r="4.5" fill="none" stroke="#e0a34b" stroke-width="1.8"/>
<text x="36" y="140" font-size="12" font-weight="700" fill="#e0a34b">Vin</text>
<line x1="60" y1="160" x2="118" y2="160" stroke="#98a4b1" stroke-width="1.8"/>
<path d="M118 160 q8 -18 18 0 q8 -18 18 0 q8 -18 18 0 q8 -18 18 0" fill="none" stroke="#e0a34b" stroke-width="2.2"/>
<text x="150" y="138" font-size="12" font-weight="600" fill="#e0a34b" text-anchor="middle">L</text>
<line x1="190" y1="160" x2="252" y2="160" stroke="#98a4b1" stroke-width="1.8"/>
<circle cx="252" cy="160" r="3.5" fill="#a7e8ba"/>

<!-- C 并联到地: 节点(252,160) ↓ y 252 电容 -->
<line x1="252" y1="160" x2="252" y2="176" stroke="#98a4b1" stroke-width="1.8"/>
<line x1="242" y1="176" x2="262" y2="176" stroke="#98a4b1" stroke-width="2.4"/>
<line x1="242" y1="216" x2="262" y2="216" stroke="#98a4b1" stroke-width="2.4"/>
<line x1="252" y1="216" x2="252" y2="232" stroke="#98a4b1" stroke-width="1.8"/>
<text x="272" y="200" font-size="12" font-weight="600" fill="#e9edf2">C</text>
<!-- 地符号 -->
<line x1="252" y1="232" x2="252" y2="252" stroke="#98a4b1" stroke-width="1.8"/>
<line x1="238" y1="252" x2="266" y2="252" stroke="#98a4b1" stroke-width="2"/>
<line x1="242" y1="259" x2="262" y2="259" stroke="#98a4b1" stroke-width="2"/>
<line x1="247" y1="266" x2="257" y2="266" stroke="#98a4b1" stroke-width="2"/>

<!-- 输出段 -->
<line x1="252" y1="160" x2="360" y2="160" stroke="#98a4b1" stroke-width="1.8"/>
<circle cx="360" cy="160" r="4.5" fill="none" stroke="#a7e8ba" stroke-width="1.8"/>
<text x="372" y="164" font-size="12" font-weight="700" fill="#a7e8ba">Vout</text>

<!-- 底部公式 -->
<rect x="50" y="250" width="460" height="44" rx="8" fill="#0c120e" stroke="#2b333c"/>
<text x="70" y="270" font-size="13.5" fill="#a7e8ba">fc = 1/(2π√(LC))</text>
<text x="260" y="270" font-size="12" fill="#f0c878">滚降 −40 dB/十倍频</text>
<text x="70" y="288" font-size="11.5" fill="#6b7683">阻尼由负载决定 · 常用 Q≈0.5~0.707 防振铃</text>
</svg>
