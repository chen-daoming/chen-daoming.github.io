<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="480" fill="#fbfcfd"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">叠层设计与过孔规则（8 层板示例）</text>

  <!-- ================= 左：8 层叠层 ================= -->
  <rect x="40" y="56" width="360" height="330" rx="10" fill="#ffffff" stroke="#d5dde5"/>
  <text x="220" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#2980b9">① 8 层叠层示例</text>

  <!-- 层条 -->
  <rect x="100" y="100" width="200" height="22" rx="4" fill="#d6e6f5" stroke="#2980b9" stroke-width="1.4"/>
  <text x="110" y="115" font-size="11.5" fill="#1f2d3d" font-weight="600">L1</text>
  <text x="290" y="115" text-anchor="end" font-size="11.5" fill="#1f2d3d">信号 · 高速线</text>

  <rect x="100" y="132" width="200" height="22" rx="4" fill="#2980b9"/>
  <text x="110" y="147" font-size="11.5" fill="#ffffff" font-weight="600">L2</text>
  <text x="290" y="147" text-anchor="end" font-size="11.5" fill="#ffffff">GND · 完整参考</text>

  <rect x="100" y="164" width="200" height="22" rx="4" fill="#d6e6f5" stroke="#2980b9" stroke-width="1.4"/>
  <text x="110" y="179" font-size="11.5" fill="#1f2d3d" font-weight="600">L3</text>
  <text x="290" y="179" text-anchor="end" font-size="11.5" fill="#1f2d3d">信号 · 普通线</text>

  <rect x="100" y="196" width="200" height="22" rx="4" fill="#2980b9"/>
  <text x="110" y="211" font-size="11.5" fill="#ffffff" font-weight="600">L4</text>
  <text x="290" y="211" text-anchor="end" font-size="11.5" fill="#ffffff">GND</text>

  <rect x="100" y="228" width="200" height="22" rx="4" fill="#e67e22"/>
  <text x="110" y="243" font-size="11.5" fill="#ffffff" font-weight="600">L5</text>
  <text x="290" y="243" text-anchor="end" font-size="11.5" fill="#ffffff">PWR · 电源平面</text>

  <rect x="100" y="260" width="200" height="22" rx="4" fill="#d6e6f5" stroke="#2980b9" stroke-width="1.4"/>
  <text x="110" y="275" font-size="11.5" fill="#1f2d3d" font-weight="600">L6</text>
  <text x="290" y="275" text-anchor="end" font-size="11.5" fill="#1f2d3d">信号</text>

  <rect x="100" y="292" width="200" height="22" rx="4" fill="#2980b9"/>
  <text x="110" y="307" font-size="11.5" fill="#ffffff" font-weight="600">L7</text>
  <text x="290" y="307" text-anchor="end" font-size="11.5" fill="#ffffff">GND</text>

  <rect x="100" y="324" width="200" height="22" rx="4" fill="#d6e6f5" stroke="#2980b9" stroke-width="1.4"/>
  <text x="110" y="339" font-size="11.5" fill="#1f2d3d" font-weight="600">L8</text>
  <text x="290" y="339" text-anchor="end" font-size="11.5" fill="#1f2d3d">信号 · 低速线</text>

  <!-- 层间距标注 -->
  <g stroke="#8a97a5" stroke-width="1">
    <line x1="312" y1="111" x2="326" y2="111"/>
    <line x1="312" y1="143" x2="326" y2="143"/>
    <line x1="326" y1="111" x2="326" y2="143"/>
  </g>
  <text x="332" y="126" font-size="10.5" fill="#5a6b7b">薄介质</text>
  <text x="332" y="139" font-size="10.5" fill="#5a6b7b">强耦合</text>

  <text x="220" y="370" text-anchor="middle" font-size="12" fill="#5a6b7b">原则：每个信号层紧邻一个完整参考平面</text>

  <!-- ================= 右：过孔与背钻 ================= -->
  <rect x="420" y="56" width="370" height="330" rx="10" fill="#ffffff" stroke="#d5dde5"/>
  <text x="605" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#d35400">② 过孔数量与背钻（Backdrill）</text>

  <!-- 层条纹 -->
  <rect x="470" y="110" width="150" height="12" rx="3" fill="#d6e6f5" stroke="#2980b9"/>
  <rect x="470" y="140" width="150" height="12" rx="3" fill="#2980b9"/>
  <rect x="470" y="170" width="150" height="12" rx="3" fill="#d6e6f5" stroke="#2980b9"/>
  <rect x="470" y="200" width="150" height="12" rx="3" fill="#2980b9"/>
  <rect x="470" y="230" width="150" height="12" rx="3" fill="#e67e22"/>
  <rect x="470" y="260" width="150" height="12" rx="3" fill="#d6e6f5" stroke="#2980b9"/>
  <rect x="470" y="290" width="150" height="12" rx="3" fill="#2980b9"/>
  <rect x="470" y="320" width="150" height="12" rx="3" fill="#d6e6f5" stroke="#2980b9"/>
  <g font-size="10.5" fill="#5a6b7b">
    <text x="462" y="120" text-anchor="end">L1</text>
    <text x="462" y="150" text-anchor="end">L2</text>
    <text x="462" y="180" text-anchor="end">L3</text>
    <text x="462" y="210" text-anchor="end">L4</text>
    <text x="462" y="240" text-anchor="end">L5</text>
    <text x="462" y="270" text-anchor="end">L6</text>
    <text x="462" y="300" text-anchor="end">L7</text>
    <text x="462" y="330" text-anchor="end">L8</text>
  </g>

  <!-- 信号走线 -->
  <rect x="430" y="113" width="44" height="6" rx="3" fill="#c98f2e"/>
  <rect x="616" y="263" width="44" height="6" rx="3" fill="#c98f2e"/>

  <!-- 完整钻孔（含残桩） -->
  <rect x="540" y="104" width="14" height="240" fill="#9fb0bd"/>
  <!-- 有效部分 L1→L6 加深 -->
  <rect x="540" y="104" width="14" height="174" fill="#5a6b7b"/>
  <!-- 焊盘 -->
  <ellipse cx="547" cy="116" rx="27" ry="9" fill="#c98f2e" stroke="#8a6d2f" stroke-width="1.2"/>
  <ellipse cx="547" cy="266" rx="27" ry="9" fill="#c98f2e" stroke="#8a6d2f" stroke-width="1.2"/>

  <!-- 残桩标记 -->
  <rect x="540" y="278" width="14" height="66" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5 4"/>
  <circle cx="580" cy="312" r="12" fill="#c0392b"/>
  <text x="580" y="317" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">✕</text>
  <text x="580" y="342" text-anchor="middle" font-size="11" fill="#c0392b">残桩 stub</text>
  <text x="580" y="356" text-anchor="middle" font-size="11" fill="#c0392b">背钻去除</text>

  <text x="700" y="106" text-anchor="middle" font-size="11" fill="#8a6d2f">高速信号换层：L1 → L6</text>
  <line x1="640" y1="110" x2="578" y2="114" stroke="#8a6d2f" stroke-width="1"/>

  <!-- 右侧要点 -->
  <g>
    <rect x="676" y="128" width="9" height="9" fill="#d35400"/>
    <text x="694" y="137" font-size="11.5" fill="#1f2d3d">≥1 GHz 信号</text>
    <text x="694" y="152" font-size="11.5" fill="#1f2d3d">过孔 ≤ 2 个</text>

    <rect x="676" y="176" width="9" height="9" fill="#c0392b"/>
    <text x="694" y="185" font-size="11.5" fill="#1f2d3d">残桩引发谐振：</text>
    <text x="694" y="200" font-size="11.5" fill="#1f2d3d">背钻 / 盲埋孔</text>

    <rect x="676" y="224" width="9" height="9" fill="#2980b9"/>
    <text x="694" y="233" font-size="11.5" fill="#1f2d3d">反焊盘 Anti-pad：</text>
    <text x="694" y="248" font-size="11.5" fill="#1f2d3d">与平面留出隔离</text>

    <rect x="676" y="272" width="9" height="9" fill="#27ae60"/>
    <text x="694" y="281" font-size="11.5" fill="#1f2d3d">孔径 ≥ 8 mil</text>
    <text x="694" y="296" font-size="11.5" fill="#1f2d3d">焊盘 ≥ 16 mil</text>
  </g>

  <!-- 底部结论条 -->
  <rect x="40" y="404" width="750" height="48" rx="10" fill="#eaf2fb"/>
  <text x="415" y="424" text-anchor="middle" font-size="12.5" fill="#1f2d3d">阻抗由线宽、介质厚度、铜厚与介电常数共同决定：用阻抗计算软件定值，</text>
  <text x="415" y="442" text-anchor="middle" font-size="12.5" fill="#1f2d3d">与板厂确认叠层后首板 TDR 抽测，公差按 ±10% 控制</text>
</svg>
