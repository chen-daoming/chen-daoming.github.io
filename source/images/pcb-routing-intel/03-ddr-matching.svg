<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="480" fill="#fbfcfd"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">DDR 布线规则：等长匹配与拓扑选择</text>

  <!-- ================= 左上：T 型拓扑 ================= -->
  <rect x="40" y="56" width="370" height="180" rx="10" fill="#ffffff" stroke="#d5dde5"/>
  <text x="225" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#2980b9">① T 型 / 菊花链 —— 数据组（DQ · DM · DQS）</text>

  <!-- 控制器 -->
  <rect x="64" y="118" width="84" height="46" rx="6" fill="#34549a"/>
  <text x="106" y="146" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">控制器</text>
  <!-- 分支点 -->
  <line x1="148" y1="141" x2="232" y2="141" stroke="#5a6b7b" stroke-width="2.2"/>
  <circle cx="232" cy="141" r="4.5" fill="#d35400"/>
  <!-- 两条分支 -->
  <line x1="232" y1="141" x2="292" y2="112" stroke="#5a6b7b" stroke-width="2.2"/>
  <line x1="232" y1="141" x2="292" y2="172" stroke="#5a6b7b" stroke-width="2.2"/>
  <!-- 分支等长标注 -->
  <text x="252" y="118" text-anchor="middle" font-size="10.5" fill="#d35400">两分支等长</text>
  <!-- 颗粒 -->
  <rect x="292" y="96" width="96" height="32" rx="6" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.8"/>
  <text x="340" y="117" text-anchor="middle" font-size="12" fill="#2980b9" font-weight="600">U1 · DQ[7:0]</text>
  <rect x="292" y="156" width="96" height="32" rx="6" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.8"/>
  <text x="340" y="177" text-anchor="middle" font-size="12" fill="#2980b9" font-weight="600">U2 · DQ[7:0]</text>

  <text x="225" y="216" text-anchor="middle" font-size="11.5" fill="#5a6b7b">分支点尽量居中，两臂严格等长；适合点数较少的数据组</text>

  <!-- ================= 右上：Fly-by ================= -->
  <rect x="430" y="56" width="370" height="180" rx="10" fill="#ffffff" stroke="#d5dde5"/>
  <text x="615" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#27ae60">② Fly-by 飞越式 —— 地址 / 命令 / 时钟</text>

  <rect x="452" y="120" width="76" height="46" rx="6" fill="#34549a"/>
  <text x="490" y="148" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">控制器</text>
  <line x1="528" y1="143" x2="760" y2="143" stroke="#5a6b7b" stroke-width="2.2"/>
  <rect x="556" y="128" width="40" height="30" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
  <text x="576" y="148" text-anchor="middle" font-size="11.5" fill="#27ae60" font-weight="600">U1</text>
  <rect x="608" y="128" width="40" height="30" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
  <text x="628" y="148" text-anchor="middle" font-size="11.5" fill="#27ae60" font-weight="600">U2</text>
  <rect x="660" y="128" width="40" height="30" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
  <text x="680" y="148" text-anchor="middle" font-size="11.5" fill="#27ae60" font-weight="600">U3</text>
  <rect x="712" y="128" width="40" height="30" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
  <text x="732" y="148" text-anchor="middle" font-size="11.5" fill="#27ae60" font-weight="600">U4</text>
  <!-- 端接 -->
  <rect x="756" y="130" width="8" height="26" rx="2" fill="#d35400"/>
  <text x="760" y="120" text-anchor="middle" font-size="10.5" fill="#d35400">RTT</text>

  <text x="615" y="196" text-anchor="middle" font-size="11.5" fill="#5a6b7b">时钟沿链依次到达，利用 Write Leveling / 读训练补偿偏差</text>
  <text x="615" y="216" text-anchor="middle" font-size="11.5" fill="#5a6b7b">走线更短更直，DDR3/4 地址命令时钟首选</text>

  <!-- ================= 下：等长公差 ================= -->
  <text x="410" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">③ 等长匹配公差（以 Intel 处理器 / FPGA 布局指南为准）</text>

  <!-- 左：蛇形绕线示意 -->
  <text x="70" y="300" font-size="12" font-weight="700" fill="#c0392b">DQS±（差分）</text>
  <path d="M70 322 H300 v-16 h14 v16 h14 v-16 h14 v16 h14 v16 h14 v-16 h14 v16 H470" fill="none" stroke="#c0392b" stroke-width="9" stroke-linejoin="round"/>
  <path d="M70 352 H290 v-16 h14 v16 h14 v-16 h14 v16 h28 H470" fill="none" stroke="#c0392b" stroke-width="9" stroke-linejoin="round" opacity="0.75"/>

  <text x="70" y="386" font-size="12" font-weight="700" fill="#2980b9">DQ 组内</text>
  <path d="M70 406 H240 v-18 h14 v18 h14 v-18 h14 v18 h14 v18 h14 v-18 h14 v18 H470" fill="none" stroke="#2980b9" stroke-width="9" stroke-linejoin="round"/>
  <path d="M70 440 H260 v-18 h14 v18 h14 v-18 h14 v18 h28 H470" fill="none" stroke="#2980b9" stroke-width="9" stroke-linejoin="round" opacity="0.75"/>

  <!-- 右：公差速查 -->
  <rect x="520" y="286" width="270" height="178" rx="10" fill="#ffffff" stroke="#d5dde5"/>
  <text x="655" y="310" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">公差速查表</text>
  <line x1="540" y1="322" x2="770" y2="322" stroke="#e3e9ee" stroke-width="1.4"/>

  <rect x="540" y="334" width="10" height="10" fill="#2980b9"/>
  <text x="560" y="344" font-size="12" fill="#1f2d3d">DQ / DM 组内互差 ≤ 25 mil</text>
  <line x1="540" y1="354" x2="770" y2="354" stroke="#f0f3f6" stroke-width="1"/>

  <rect x="540" y="360" width="10" height="10" fill="#d35400"/>
  <text x="560" y="370" font-size="12" fill="#1f2d3d">DQS 与组内 DQ ≤ 10 mil</text>
  <line x1="540" y1="380" x2="770" y2="380" stroke="#f0f3f6" stroke-width="1"/>

  <rect x="540" y="386" width="10" height="10" fill="#c0392b"/>
  <text x="560" y="396" font-size="12" fill="#1f2d3d">DQS 差分对内 ≤ 5 mil（镜像对称）</text>
  <line x1="540" y1="406" x2="770" y2="406" stroke="#f0f3f6" stroke-width="1"/>

  <rect x="540" y="412" width="10" height="10" fill="#27ae60"/>
  <text x="560" y="422" font-size="12" fill="#1f2d3d">地址 / 控制 vs CLK ≤ 50 mil</text>
  <line x1="540" y1="432" x2="770" y2="432" stroke="#f0f3f6" stroke-width="1"/>

  <rect x="540" y="438" width="10" height="10" fill="#5a6b7b"/>
  <text x="560" y="448" font-size="12" fill="#1f2d3d">拓扑：数据组 T 型 · 地址时钟 Fly-by</text>
</svg>
