<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="480" fill="#fbfcfd"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">时钟包地 · 去耦电容 · 散热过孔</text>

  <!-- ================= 左上：时钟包地 ================= -->
  <rect x="40" y="56" width="370" height="210" rx="10" fill="#ffffff" stroke="#d5dde5"/>
  <text x="225" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#27ae60">① 时钟包地处理</text>

  <!-- 晶振 -->
  <rect x="70" y="128" width="70" height="44" rx="6" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.8"/>
  <text x="105" y="155" text-anchor="middle" font-size="12" fill="#2980b9" font-weight="600">晶振</text>
  <!-- MCU -->
  <rect x="310" y="128" width="70" height="44" rx="6" fill="#34549a"/>
  <text x="345" y="155" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="600">MCU</text>

  <!-- 包地护线 -->
  <rect x="140" y="122" width="170" height="8" rx="4" fill="#27ae60"/>
  <rect x="140" y="170" width="170" height="8" rx="4" fill="#27ae60"/>
  <!-- 时钟走线 -->
  <rect x="140" y="146" width="170" height="10" rx="5" fill="#d35400"/>

  <!-- 地过孔 -->
  <g fill="#ffffff" stroke="#27ae60" stroke-width="1.8">
    <circle cx="160" cy="126" r="5"/><circle cx="230" cy="126" r="5"/><circle cx="292" cy="126" r="5"/>
    <circle cx="160" cy="174" r="5"/><circle cx="230" cy="174" r="5"/><circle cx="292" cy="174" r="5"/>
  </g>
  <!-- GND 符号（下方过孔） -->
  <g stroke="#27ae60" stroke-width="1.6">
    <line x1="160" y1="179" x2="160" y2="188"/><line x1="154" y1="188" x2="166" y2="188"/><line x1="156.5" y1="191" x2="163.5" y2="191"/>
    <line x1="230" y1="179" x2="230" y2="188"/><line x1="224" y1="188" x2="236" y2="188"/><line x1="226.5" y1="191" x2="233.5" y2="191"/>
    <line x1="292" y1="179" x2="292" y2="188"/><line x1="286" y1="188" x2="298" y2="188"/><line x1="288.5" y1="191" x2="295.5" y2="191"/>
  </g>

  <text x="225" y="215" text-anchor="middle" font-size="11.5" fill="#5a6b7b">时钟两侧包地（GND 护线），地过孔间距 ≤ λ/10</text>
  <text x="225" y="234" text-anchor="middle" font-size="11.5" fill="#5a6b7b">经验：每 1000 mil 至少 1 个地过孔缝合</text>
  <text x="225" y="256" text-anchor="middle" font-size="11" fill="#8a97a5">关键时钟优先走内层带状线，整条线少打过孔、远离板边</text>

  <!-- ================= 右上：去耦电容 ================= -->
  <rect x="430" y="56" width="370" height="210" rx="10" fill="#ffffff" stroke="#d5dde5"/>
  <text x="615" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#2980b9">② 去耦电容：距电源引脚 ≤ 150 mil</text>

  <!-- 芯片 -->
  <rect x="460" y="110" width="150" height="96" rx="8" fill="#eaf0fb" stroke="#34549a" stroke-width="2"/>
  <text x="535" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#34549a">MCU / CPU</text>
  <text x="535" y="176" text-anchor="middle" font-size="11" fill="#8a97a5">电源引脚侧</text>

  <!-- 引脚 -->
  <rect x="606" y="150" width="12" height="12" fill="#c98f2e"/>
  <!-- 引脚到电容走线 -->
  <rect x="618" y="152" width="46" height="8" rx="4" fill="#5a6b7b"/>
  <!-- 电容符号 -->
  <line x1="672" y1="134" x2="672" y2="178" stroke="#2980b9" stroke-width="4"/>
  <line x1="682" y1="134" x2="682" y2="178" stroke="#2980b9" stroke-width="4"/>
  <line x1="664" y1="156" x2="672" y2="156" stroke="#5a6b7b" stroke-width="2"/>
  <line x1="682" y1="156" x2="690" y2="156" stroke="#5a6b7b" stroke-width="2"/>
  <text x="677" y="124" text-anchor="middle" font-size="11.5" fill="#2980b9" font-weight="600">0.1 μF</text>
  <!-- 到地 -->
  <line x1="677" y1="178" x2="677" y2="192" stroke="#5a6b7b" stroke-width="2"/>
  <line x1="669" y1="192" x2="685" y2="192" stroke="#5a6b7b" stroke-width="2"/>
  <line x1="672" y1="196" x2="682" y2="196" stroke="#5a6b7b" stroke-width="2"/>
  <text x="700" y="196" font-size="10.5" fill="#8a97a5">就近落地过孔</text>

  <!-- 150mil 尺寸 -->
  <g stroke="#8a97a5" stroke-width="1">
    <line x1="612" y1="170" x2="612" y2="212"/>
    <line x1="677" y1="200" x2="677" y2="212"/>
    <line x1="616" y1="208" x2="673" y2="208"/>
    <path d="M622 205 L616 208 L622 211 z" fill="#8a97a5" stroke="none"/>
    <path d="M667 205 L673 208 L667 211 z" fill="#8a97a5" stroke="none"/>
  </g>
  <text x="644" y="226" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">≤ 150 mil</text>

  <text x="615" y="252" text-anchor="middle" font-size="11" fill="#8a97a5">每个电源引脚 ≥ 1 个 0.1 μF；0.1~10 μF 大小电容并联</text>

  <!-- ================= 下：热焊盘与上电时序 ================= -->
  <rect x="40" y="286" width="760" height="150" rx="10" fill="#ffffff" stroke="#d5dde5"/>
  <text x="415" y="314" text-anchor="middle" font-size="15" font-weight="700" fill="#d35400">③ 热焊盘散热过孔阵列（QFN / BMSK 底部大焊盘）</text>

  <!-- 芯片底视 -->
  <rect x="90" y="324" width="190" height="84" rx="8" fill="#eaf0fb" stroke="#34549a" stroke-width="2"/>
  <rect x="150" y="344" width="70" height="44" fill="#c98f2e" stroke="#8a6d2f" stroke-width="1.2"/>
  <!-- 过孔阵列 3x3 -->
  <g fill="#ffffff" stroke="#5a6b7b" stroke-width="1.4">
    <circle cx="165" cy="352" r="5"/><circle cx="185" cy="352" r="5"/><circle cx="205" cy="352" r="5"/>
    <circle cx="165" cy="366" r="5"/><circle cx="185" cy="366" r="5"/><circle cx="205" cy="366" r="5"/>
    <circle cx="165" cy="380" r="5"/><circle cx="185" cy="380" r="5"/><circle cx="205" cy="380" r="5"/>
  </g>
  <text x="185" y="424" text-anchor="middle" font-size="11" fill="#8a97a5">热焊盘（底部视）+ 过孔阵列接到 GND</text>

  <!-- 右侧要点 -->
  <g>
    <rect x="330" y="336" width="9" height="9" fill="#d35400"/>
    <text x="348" y="345" font-size="12" fill="#1f2d3d">散热过孔：孔径 8~10 mil，间距 ≈ 1 mm，阵列均布于焊盘之下</text>

    <rect x="330" y="364" width="9" height="9" fill="#2980b9"/>
    <text x="348" y="373" font-size="12" fill="#1f2d3d">盘内孔（in-pad）：塞孔 + 电镀填平，防止焊接时锡膏流失</text>

    <rect x="330" y="392" width="9" height="9" fill="#27ae60"/>
    <text x="348" y="401" font-size="12" fill="#1f2d3d">上电时序：先 Vcore 后 VCCIO（具体以器件 Datasheet 为准）</text>

    <rect x="330" y="420" width="9" height="9" fill="#5a6b7b"/>
    <text x="348" y="429" font-size="12" fill="#1f2d3d">仿真验证：PDN 阻抗扫描 + IBIS/AMI 眼图与串扰分析</text>
  </g>

  <!-- 底部口诀 -->
  <text x="415" y="464" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">口诀：时钟包地走内层，电容贴近 150 mil，散热打孔要填平</text>
</svg>
