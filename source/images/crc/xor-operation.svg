<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="680" height="300" rx="12" fill="#161b20" stroke="#2b333c"/>

  <text x="28" y="40" font-size="12" font-weight="500" fill="#e0a34b" letter-spacing="1.2">模二运算 · XOR</text>

  <rect x="28" y="64" width="280" height="174" rx="6" fill="none" stroke="#2b333c"/>
  <rect x="28" y="64" width="280" height="34" rx="6" fill="#21272e"/>
  <text x="74" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#e0a34b">A</text>
  <text x="168" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#e0a34b">B</text>
  <text x="262" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#e0a34b">A ⊕ B</text>

  <line x1="28" y1="133" x2="308" y2="133" stroke="#2b333c"/>
  <line x1="28" y1="168" x2="308" y2="168" stroke="#2b333c"/>
  <line x1="28" y1="203" x2="308" y2="203" stroke="#2b333c"/>

  <text x="74" y="119" text-anchor="middle" font-size="14" font-family="Consolas,monospace" fill="#e9edf2">0</text>
  <text x="168" y="119" text-anchor="middle" font-size="14" font-family="Consolas,monospace" fill="#e9edf2">0</text>
  <text x="262" y="119" text-anchor="middle" font-size="14" font-family="Consolas,monospace" fill="#6b7683">0</text>

  <text x="74" y="154" text-anchor="middle" font-size="14" font-family="Consolas,monospace" fill="#e9edf2">0</text>
  <text x="168" y="154" text-anchor="middle" font-size="14" font-family="Consolas,monospace" fill="#e9edf2">1</text>
  <text x="262" y="154" text-anchor="middle" font-size="14" font-family="Consolas,monospace" fill="#a7e8ba">1</text>

  <text x="74" y="189" text-anchor="middle" font-size="14" font-family="Consolas,monospace" fill="#e9edf2">1</text>
  <text x="168" y="189" text-anchor="middle" font-size="14" font-family="Consolas,monospace" fill="#e9edf2">0</text>
  <text x="262" y="189" text-anchor="middle" font-size="14" font-family="Consolas,monospace" fill="#a7e8ba">1</text>

  <text x="74" y="224" text-anchor="middle" font-size="14" font-family="Consolas,monospace" fill="#e9edf2">1</text>
  <text x="168" y="224" text-anchor="middle" font-size="14" font-family="Consolas,monospace" fill="#e9edf2">1</text>
  <text x="262" y="224" text-anchor="middle" font-size="14" font-family="Consolas,monospace" fill="#6b7683">0</text>

  <rect x="340" y="95" width="6" height="6" rx="1" fill="#e0a34b"/>
  <text x="358" y="102" font-size="13" fill="#e9edf2">相同得 0</text>
  <rect x="340" y="127" width="6" height="6" rx="1" fill="#e0a34b"/>
  <text x="358" y="134" font-size="13" fill="#e9edf2">相异得 1</text>
  <rect x="340" y="159" width="6" height="6" rx="1" fill="#e0a34b"/>
  <text x="358" y="166" font-size="13" fill="#e9edf2">不进位、不借位</text>
  <rect x="340" y="191" width="6" height="6" rx="1" fill="#e0a34b"/>
  <text x="358" y="198" font-size="13" fill="#e9edf2">⊕ 即 XOR 运算符</text>

  <rect x="28" y="256" width="624" height="32" rx="6" fill="#a7e8ba" fill-opacity="0.08" stroke="#2b333c"/>
  <text x="340" y="277" text-anchor="middle" font-size="13" fill="#a7e8ba">模二加法 = 模二减法 = XOR（异或），这就是 CRC 能做除法的原因</text>
</svg>
