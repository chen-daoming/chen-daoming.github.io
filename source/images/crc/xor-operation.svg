<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240">
  <style>
    text { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 18px; font-weight: bold; fill: #1a1a2e; }
    .th { font-size: 14px; font-weight: bold; fill: #fff; }
    .td { font-size: 16px; fill: #333; }
    .res { font-size: 16px; font-weight: bold; fill: #d00; }
    .note { font-size: 12px; fill: #666; }
    .sym { font-size: 20px; font-weight: bold; fill: #06f; }
  </style>
  
  <rect width="480" height="240" fill="#f8f9fa" rx="10"/>
  <text x="240" y="30" text-anchor="middle" class="title">模二运算（XOR）</text>
  
  <!-- 真值表 -->
  <rect x="30" y="50" width="220" height="150" fill="#fff" stroke="#ddd" rx="6"/>
  
  <rect x="30" y="50" width="220" height="30" fill="#1976d2" rx="6"/>
  <rect x="30" y="65" width="220" height="15" fill="#1976d2"/>
  <text x="75" y="72" text-anchor="middle" class="th">A</text>
  <text x="140" y="72" text-anchor="middle" class="th">B</text>
  <text x="205" y="72" text-anchor="middle" class="th">A ⊕ B</text>
  
  <line x1="30" y1="100" x2="250" y2="100" stroke="#eee"/>
  <text x="75" y="120" text-anchor="middle" class="td">0</text>
  <text x="140" y="120" text-anchor="middle" class="td">0</text>
  <text x="205" y="120" text-anchor="middle" class="res">0</text>
  
  <line x1="30" y1="135" x2="250" y2="135" stroke="#eee"/>
  <text x="75" y="155" text-anchor="middle" class="td">0</text>
  <text x="140" y="155" text-anchor="middle" class="td">1</text>
  <text x="205" y="155" text-anchor="middle" class="res">1</text>
  
  <line x1="30" y1="170" x2="250" y2="170" stroke="#eee"/>
  <text x="75" y="190" text-anchor="middle" class="td">1</text>
  <text x="140" y="190" text-anchor="middle" class="td">0</text>
  <text x="205" y="190" text-anchor="middle" class="res">1</text>
  
  <!-- 分隔线 -->
  <line x1="30" y1="200" x2="250" y2="200" stroke="#eee"/>
  <text x="75" y="210" text-anchor="middle" class="td">1</text>
  <text x="140" y="210" text-anchor="middle" class="td">1</text>
  <text x="205" y="210" text-anchor="middle" class="res">0</text>
  
  <!-- 右侧说明 -->
  <rect x="280" y="50" width="200" height="150" fill="#fff" stroke="#ddd" rx="6"/>
  <text x="380" y="75" text-anchor="middle" class="th" fill="#333">特点</text>
  
  <text x="300" y="105" class="td" font-size="14">• 相同得 0</text>
  <text x="300" y="130" class="td" font-size="14">• 相异得 1</text>
  <text x="300" y="155" class="td" font-size="14">• 不进位加法</text>
  <text x="300" y="180" class="td" font-size="14">• ⊕ = XOR 运算符</text>
  
  <!-- 底部公式 -->
  <rect x="30" y="215" width="450" height="35" fill="#fff3e0" rx="4"/>
  <text x="255" y="238" text-anchor="middle" class="note">模二加法 = 模二减法 = XOR（异或）运算</text>
</svg>
