<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #333; }
      .label { font-family: Arial, sans-serif; font-size: 14px; fill: #555; }
      .result { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #d32f2f; }
      .operator { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1976d2; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="200" fill="#f5f5f5" rx="8"/>
  
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" class="title">模二运算（XOR）</text>
  
  <!-- XOR Truth Table -->
  <g transform="translate(50, 60)">
    <text x="60" y="0" text-anchor="middle" class="label" font-weight="bold">A</text>
    <text x="120" y="0" text-anchor="middle" class="label" font-weight="bold">B</text>
    <text x="200" y="0" text-anchor="middle" class="label" font-weight="bold">A ⊕ B</text>
    
    <!-- Row 1 -->
    <rect x="30" y="15" width="60" height="25" fill="#e3f2fd" stroke="#1976d2" rx="4"/>
    <text x="60" y="33" text-anchor="middle" class="label">0</text>
    <rect x="90" y="15" width="60" height="25" fill="#e3f2fd" stroke="#1976d2" rx="4"/>
    <text x="120" y="33" text-anchor="middle" class="label">0</text>
    <rect x="170" y="15" width="60" height="25" fill="#e8f5e9" stroke="#4caf50" rx="4"/>
    <text x="200" y="33" text-anchor="middle" class="result">0</text>
    
    <!-- Row 2 -->
    <rect x="30" y="50" width="60" height="25" fill="#e3f2fd" stroke="#1976d2" rx="4"/>
    <text x="60" y="68" text-anchor="middle" class="label">0</text>
    <rect x="90" y="50" width="60" height="25" fill="#e3f2fd" stroke="#1976d2" rx="4"/>
    <text x="120" y="68" text-anchor="middle" class="label">1</text>
    <rect x="170" y="50" width="60" height="25" fill="#ffebee" stroke="#d32f2f" rx="4"/>
    <text x="200" y="68" text-anchor="middle" class="result">1</text>
    
    <!-- Row 3 -->
    <rect x="30" y="85" width="60" height="25" fill="#e3f2fd" stroke="#1976d2" rx="4"/>
    <text x="60" y="103" text-anchor="middle" class="label">1</text>
    <rect x="90" y="85" width="60" height="25" fill="#e3f2fd" stroke="#1976d2" rx="4"/>
    <text x="120" y="103" text-anchor="middle" class="label">0</text>
    <rect x="170" y="85" width="60" height="25" fill="#ffebee" stroke="#d32f2f" rx="4"/>
    <text x="200" y="103" text-anchor="middle" class="result">1</text>
    
    <!-- Row 4 -->
    <rect x="30" y="120" width="60" height="25" fill="#e3f2fd" stroke="#1976d2" rx="4"/>
    <text x="60" y="138" text-anchor="middle" class="label">1</text>
    <rect x="90" y="120" width="60" height="25" fill="#e3f2fd" stroke="#1976d2" rx="4"/>
    <text x="120" y="138" text-anchor="middle" class="label">1</text>
    <rect x="170" y="120" width="60" height="25" fill="#e8f5e9" stroke="#4caf50" rx="4"/>
    <text x="200" y="138" text-anchor="middle" class="result">0</text>
  </g>
  
  <!-- Formula -->
  <text x="350" y="100" text-anchor="middle" class="operator">⊕</text>
  <text x="350" y="130" text-anchor="middle" class="label">= XOR</text>
  <text x="350" y="160" text-anchor="middle" class="label">不进位加法</text>
  
  <!-- Key Points -->
  <g transform="translate(400, 60)">
    <text x="0" y="0" class="label" font-weight="bold">特点：</text>
    <text x="0" y="25" class="label">• 相同得0</text>
    <text x="0" y="50" class="label">• 相异得1</text>
    <text x="0" y="75" class="label">• 模二加法 = 模二减法</text>
    <text x="0" y="100" class="label">• 奇数个1→1</text>
    <text x="0" y="125" class="label">• 偶数个1→0</text>
  </g>
</svg>
