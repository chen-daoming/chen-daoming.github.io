<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .label { font-family: Arial, sans-serif; font-size: 11px; fill: #555; }
      .data { font-family: monospace; font-size: 13px; fill: #1976d2; }
      .divisor { font-family: monospace; font-size: 13px; fill: #d32f2f; font-weight: bold; }
      .remainder { font-family: monospace; font-size: 13px; fill: #4caf50; font-weight: bold; }
      .step { font-family: Arial, sans-serif; font-size: 12px; fill: #666; font-weight: bold; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="500" fill="#fafafa" rx="8"/>
  
  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" class="title">CRC-8 计算示例</text>
  <text x="450" y="45" text-anchor="middle" class="label">原始数据：1101011011，除数：10011（对应多项式 x⁴+x+1）</text>
  
  <!-- Step 1: Append zeros -->
  <g transform="translate(50, 70)">
    <text x="0" y="0" class="step">步骤1：在原始数据后添加4个0（除数位数-1）</text>
    <rect x="0" y="10" width="500" height="30" fill="#e3f2fd" stroke="#1976d2" rx="4"/>
    <text x="250" y="30" text-anchor="middle" class="data">1101 0110 11 | 0000</text>
  </g>
  
  <!-- Step 2: Division Process -->
  <g transform="translate(50, 130)">
    <text x="0" y="0" class="step">步骤2：模二除法过程</text>
    
    <!-- Division visualization -->
    <g transform="translate(0, 20)">
      <!-- Row 1: First 5 bits -->
      <text x="0" y="0" class="label">被除数前5位：</text>
      <text x="120" y="0" class="data">11010</text>
      <text x="200" y="0" class="label">≥ 除数位数，商1</text>
      
      <!-- XOR operation -->
      <text x="0" y="25" class="label">XOR：</text>
      <text x="120" y="25" class="data">11010</text>
      <text x="180" y="25" class="label">⊕</text>
      <text x="200" y="25" class="divisor">10011</text>
      <text x="280" y="25" class="label">=</text>
      <text x="300" y="25" class="remainder">01001</text>
      
      <!-- Bring down next bit -->
      <text x="0" y="50" class="label">落下下一位：</text>
      <text x="120" y="50" class="data">10011</text>
      <text x="200" y="50" class="label">≥ 除数位数，商1</text>
      
      <!-- XOR operation -->
      <text x="0" y="75" class="label">XOR：</text>
      <text x="120" y="75" class="data">10011</text>
      <text x="180" y="75" class="label">⊕</text>
      <text x="200" y="75" class="divisor">10011</text>
      <text x="280" y="75" class="label">=</text>
      <text x="300" y="75" class="remainder">00000</text>
      
      <!-- Continue process -->
      <text x="0" y="100" class="label">继续：</text>
      <text x="120" y="100" class="data">00001</text>
      <text x="200" y="100" class="label">&lt; 除数，商0</text>
      
      <text x="0" y="125" class="label">落下下一位：</text>
      <text x="120" y="125" class="data">00010</text>
      <text x="200" y="125" class="label">&lt; 除数，商0</text>
      
      <text x="0" y="150" class="label">落下下一位：</text>
      <text x="120" y="150" class="data">00101</text>
      <text x="200" y="150" class="label">&lt; 除数，商0</text>
      
      <text x="0" y="175" class="label">落下下一位：</text>
      <text x="120" y="175" class="data">01011</text>
      <text x="200" y="175" class="label">&lt; 除数，商0</text>
      
      <text x="0" y="200" class="label">落下下一位：</text>
      <text x="120" y="200" class="data">10110</text>
      <text x="200" y="200" class="label">≥ 除数，商1</text>
      
      <text x="0" y="225" class="label">XOR：</text>
      <text x="120" y="225" class="data">10110</text>
      <text x="180" y="225" class="label">⊕</text>
      <text x="200" y="225" class="divisor">10011</text>
      <text x="280" y="225" class="label">=</text>
      <text x="300" y="225" class="remainder">00101</text>
      
      <text x="0" y="250" class="label">落下下一位：</text>
      <text x="120" y="250" class="data">01011</text>
      <text x="200" y="250" class="label">&lt; 除数，商0</text>
      
      <text x="0" y="275" class="label">落下下一位：</text>
      <text x="120" y="275" class="data">10110</text>
      <text x="200" y="275" class="label">≥ 除数，商1</text>
      
      <text x="0" y="300" class="label">XOR：</text>
      <text x="120" y="300" class="data">10110</text>
      <text x="180" y="300" class="label">⊕</text>
      <text x="200" y="300" class="divisor">10011</text>
      <text x="280" y="300" class="label">=</text>
      <text x="300" y="300" class="remainder">00101</text>
      
      <text x="0" y="325" class="label">落下下一位：</text>
      <text x="120" y="325" class="data">01010</text>
      <text x="200" y="325" class="label">&lt; 除数，商0</text>
      
      <text x="0" y="350" class="label">落下下一位：</text>
      <text x="120" y="350" class="data">10100</text>
      <text x="200" y="350" class="label">≥ 除数，商1</text>
      
      <text x="0" y="375" class="label">XOR：</text>
      <text x="120" y="375" class="data">10100</text>
      <text x="180" y="375" class="label">⊕</text>
      <text x="200" y="375" class="divisor">10011</text>
      <text x="280" y="375" class="label">=</text>
      <text x="300" y="375" class="remainder">00111</text>
    </g>
  </g>
  
  <!-- Result -->
  <g transform="translate(500, 130)">
    <text x="0" y="0" class="step">步骤3：最终结果</text>
    
    <rect x="0" y="20" width="350" height="60" fill="#ffebee" stroke="#d32f2f" rx="6"/>
    <text x="175" y="45" text-anchor="middle" class="label" fill="#d32f2f">余数（CRC码）</text>
    <text x="175" y="65" text-anchor="middle" class="divisor">1110</text>
    
    <rect x="0" y="100" width="350" height="80" fill="#e8f5e9" stroke="#4caf50" rx="6"/>
    <text x="175" y="125" text-anchor="middle" class="label" fill="#4caf50">实际发送数据</text>
    <text x="175" y="150" text-anchor="middle" class="data">1101011011 | 1110</text>
    <text x="175" y="170" text-anchor="middle" class="label">（原始数据 + CRC码）</text>
    
    <rect x="0" y="200" width="350" height="80" fill="#e3f2fd" stroke="#1976d2" rx="6"/>
    <text x="175" y="225" text-anchor="middle" class="label" fill="#1976d2">接收方校验</text>
    <text x="175" y="250" text-anchor="middle" class="data">11010110111110 ÷ 10011</text>
    <text x="175" y="270" text-anchor="middle" class="remainder">余数 = 0 → 无差错</text>
    
    <!-- Verification note -->
    <text x="0" y="310" class="label">注：CRC-8 多项式 0x07 (x⁸+x²+x+1)</text>
    <text x="0" y="330" class="label">本例使用简化多项式 10011 (x⁴+x+1) 演示</text>
  </g>
  
  <!-- Polynomial explanation -->
  <g transform="translate(50, 450)">
    <text x="0" y="0" class="label" font-weight="bold">多项式对应关系：</text>
    <text x="150" y="0" class="data">10011B = x⁴ + x + 1</text>
    <text x="350" y="0" class="label">（最高位x⁴，最低位x⁰=1）</text>
  </g>
</svg>
