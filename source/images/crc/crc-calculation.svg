<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a1a1a; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #666; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #333; }
      .data { font-family: 'Consolas', monospace; font-size: 13px; fill: #1565c0; }
      .divisor { font-family: 'Consolas', monospace; font-size: 13px; fill: #c62828; font-weight: bold; }
      .result { font-family: 'Consolas', monospace; font-size: 13px; fill: #2e7d32; font-weight: bold; }
      .step { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #333; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #666; }
      .box { stroke-width: 1.5; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#fafafa" rx="8"/>
  
  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" class="title">CRC-8 计算示例</text>
  <text x="400" y="48" text-anchor="middle" class="subtitle">原始数据：1101011011，除数：10011（对应多项式 x⁴+x+1）</text>
  
  <!-- Left side: Division process -->
  <g transform="translate(40, 70)">
    <text x="200" y="0" text-anchor="middle" class="step">模二除法过程</text>
    
    <!-- Division table header -->
    <rect x="0" y="15" width="400" height="30" fill="#e3f2fd" stroke="#90caf9" class="box" rx="4"/>
    <text x="200" y="35" text-anchor="middle" dominant-baseline="middle" class="label">被除数：11010110110000（原始数据 + 4个0）</text>
    
    <!-- Division steps -->
    <g transform="translate(0, 60)">
      <!-- Row 1 -->
      <text x="0" y="0" class="label">1.</text>
      <text x="30" y="0" class="data">11010</text>
      <text x="100" y="0" class="label">÷</text>
      <text x="130" y="0" class="divisor">10011</text>
      <text x="200" y="0" class="label">→ 商 1，XOR</text>
      <text x="300" y="0" class="result">= 01001</text>
      
      <!-- Row 2 -->
      <text x="0" y="25" class="label">2.</text>
      <text x="30" y="25" class="data">10011</text>
      <text x="100" y="25" class="label">÷</text>
      <text x="130" y="25" class="divisor">10011</text>
      <text x="200" y="25" class="label">→ 商 1，XOR</text>
      <text x="300" y="25" class="result">= 00000</text>
      
      <!-- Row 3 -->
      <text x="0" y="50" class="label">3.</text>
      <text x="30" y="50" class="data">00001</text>
      <text x="100" y="50" class="label">÷</text>
      <text x="130" y="50" class="divisor">10011</text>
      <text x="200" y="50" class="label">→ 商 0</text>
      <text x="300" y="50" class="result">= 00001</text>
      
      <!-- Row 4 -->
      <text x="0" y="75" class="label">4.</text>
      <text x="30" y="75" class="data">00010</text>
      <text x="100" y="75" class="label">÷</text>
      <text x="130" y="75" class="divisor">10011</text>
      <text x="200" y="75" class="label">→ 商 0</text>
      <text x="300" y="75" class="result">= 00010</text>
      
      <!-- Row 5 -->
      <text x="0" y="100" class="label">5.</text>
      <text x="30" y="100" class="data">00101</text>
      <text x="100" y="100" class="label">÷</text>
      <text x="130" y="100" class="divisor">10011</text>
      <text x="200" y="100" class="label">→ 商 0</text>
      <text x="300" y="100" class="result">= 00101</text>
      
      <!-- Row 6 -->
      <text x="0" y="125" class="label">6.</text>
      <text x="30" y="125" class="data">01011</text>
      <text x="100" y="125" class="label">÷</text>
      <text x="130" y="125" class="divisor">10011</text>
      <text x="200" y="125" class="label">→ 商 0</text>
      <text x="300" y="125" class="result">= 01011</text>
      
      <!-- Row 7 -->
      <text x="0" y="150" class="label">7.</text>
      <text x="30" y="150" class="data">10110</text>
      <text x="100" y="150" class="label">÷</text>
      <text x="130" y="150" class="divisor">10011</text>
      <text x="200" y="150" class="label">→ 商 1，XOR</text>
      <text x="300" y="150" class="result">= 00101</text>
      
      <!-- Row 8 -->
      <text x="0" y="175" class="label">8.</text>
      <text x="30" y="175" class="data">01011</text>
      <text x="100" y="175" class="label">÷</text>
      <text x="130" y="175" class="divisor">10011</text>
      <text x="200" y="175" class="label">→ 商 0</text>
      <text x="300" y="175" class="result">= 01011</text>
      
      <!-- Row 9 -->
      <text x="0" y="200" class="label">9.</text>
      <text x="30" y="200" class="data">10110</text>
      <text x="100" y="200" class="label">÷</text>
      <text x="130" y="200" class="divisor">10011</text>
      <text x="200" y="200" class="label">→ 商 1，XOR</text>
      <text x="300" y="200" class="result">= 00101</text>
      
      <!-- Row 10 -->
      <text x="0" y="225" class="label">10.</text>
      <text x="30" y="225" class="data">01010</text>
      <text x="100" y="225" class="label">÷</text>
      <text x="130" y="225" class="divisor">10011</text>
      <text x="200" y="225" class="label">→ 商 0</text>
      <text x="300" y="225" class="result">= 01010</text>
      
      <!-- Row 11 -->
      <text x="0" y="250" class="label">11.</text>
      <text x="30" y="250" class="data">10100</text>
      <text x="100" y="250" class="label">÷</text>
      <text x="130" y="250" class="divisor">10011</text>
      <text x="200" y="250" class="label">→ 商 1，XOR</text>
      <text x="300" y="250" class="result">= 00111</text>
    </g>
  </g>
  
  <!-- Right side: Results -->
  <g transform="translate(480, 70)">
    <text x="150" y="0" text-anchor="middle" class="step">计算结果</text>
    
    <!-- CRC Code -->
    <rect x="0" y="20" width="300" height="70" fill="#ffebee" stroke="#ef9a9a" class="box" rx="6"/>
    <text x="150" y="45" text-anchor="middle" class="label" fill="#c62828">CRC 校验码（余数）</text>
    <text x="150" y="72" text-anchor="middle" class="divisor" font-size="18">1110</text>
    
    <!-- Transmitted Data -->
    <rect x="0" y="110" width="300" height="80" fill="#e8f5e9" stroke="#a5d6a7" class="box" rx="6"/>
    <text x="150" y="135" text-anchor="middle" class="label" fill="#2e7d32">实际发送数据</text>
    <text x="150" y="162" text-anchor="middle" class="data" font-size="16">1101011011 1110</text>
    <text x="150" y="182" text-anchor="middle" class="label">（原始数据 + CRC码）</text>
    
    <!-- Verification -->
    <rect x="0" y="210" width="300" height="80" fill="#e3f2fd" stroke="#90caf9" class="box" rx="6"/>
    <text x="150" y="235" text-anchor="middle" class="label" fill="#1565c0">接收方校验</text>
    <text x="150" y="260" text-anchor="middle" class="data">11010110111110 ÷ 10011</text>
    <text x="150" y="282" text-anchor="middle" class="result">余数 = 0 → 传输正确</text>
    
    <!-- Notes -->
    <g transform="translate(0, 320)">
      <text x="0" y="0" class="note">注：</text>
      <text x="0" y="20" class="note">• 本例使用简化多项式 10011 演示</text>
      <text x="0" y="40" class="note">• 实际 CRC-8 使用 0x07 (x⁸+x²+x+1)</text>
      <text x="0" y="60" class="note">• 除数位数 - 1 = CRC码位数</text>
    </g>
  </g>
  
  <!-- Polynomial explanation -->
  <g transform="translate(40, 440)">
    <rect x="0" y="0" width="720" height="45" fill="#f3e5f5" stroke="#ce93d8" class="box" rx="4"/>
    <text x="20" y="18" class="step">多项式对应关系：</text>
    <text x="180" y="18" class="data">10011B = x⁴ + x + 1</text>
    <text x="400" y="18" class="label">（最高位 x⁴，最低位 x⁰=1）</text>
    <text x="20" y="38" class="note">CRC-8 标准多项式：0x07 = x⁸ + x² + x + 1</text>
  </g>
</svg>
