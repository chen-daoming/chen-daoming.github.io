<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320">
  <style>
    text { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 18px; font-weight: bold; fill: #1a1a2e; }
    .subtitle { font-size: 13px; fill: #666; }
    .label { font-size: 12px; fill: #333; }
    .num { font-size: 12px; fill: #999; }
    .op { font-size: 12px; fill: #666; }
    .data { font-size: 14px; fill: #1565c0; font-family: 'Consolas', monospace; }
    .div { font-size: 14px; fill: #d00; font-weight: bold; font-family: 'Consolas', monospace; }
    .res { font-size: 14px; fill: #090; font-weight: bold; font-family: 'Consolas', monospace; }
    .step { font-size: 14px; font-weight: bold; fill: #333; }
  </style>
  
  <rect width="700" height="320" fill="#f8f9fa" rx="10"/>
  <text x="350" y="28" text-anchor="middle" class="title">CRC-8 计算示例</text>
  <text x="350" y="48" text-anchor="middle" class="subtitle">数据: 1101011011  除数: 10011 (x⁴+x+1)</text>
  
  <!-- 左侧：除法过程 -->
  <text x="180" y="75" text-anchor="middle" class="step">模二除法过程</text>
  
  <!-- 表头 -->
  <rect x="20" y="85" width="320" height="25" fill="#e3f2fd" rx="3"/>
  <text x="60" y="102" text-anchor="middle" class="label" font-weight="bold">步骤</text>
  <text x="140" y="102" text-anchor="middle" class="label" font-weight="bold">部分余数</text>
  <text x="240" y="102" text-anchor="middle" class="label" font-weight="bold">÷ 除数</text>
  <text x="320" y="102" text-anchor="middle" class="label" font-weight="bold">结果</text>
  
  <!-- 步骤1 -->
  <text x="60" y="128" text-anchor="middle" class="num">1</text>
  <text x="140" y="128" text-anchor="middle" class="data">11010</text>
  <text x="240" y="128" text-anchor="middle" class="div">10011</text>
  <text x="320" y="128" text-anchor="middle" class="res">= 01001</text>
  
  <line x1="20" y1="138" x2="340" y2="138" stroke="#eee"/>
  
  <!-- 步骤2 -->
  <text x="60" y="155" text-anchor="middle" class="num">2</text>
  <text x="140" y="155" text-anchor="middle" class="data">10011</text>
  <text x="240" y="155" text-anchor="middle" class="div">10011</text>
  <text x="320" y="155" text-anchor="middle" class="res">= 00000</text>
  
  <line x1="20" y1="165" x2="340" y2="165" stroke="#eee"/>
  
  <!-- 步骤3-6 简化 -->
  <text x="60" y="182" text-anchor="middle" class="num">3-6</text>
  <text x="140" y="182" text-anchor="middle" class="data">00010</text>
  <text x="240" y="182" text-anchor="middle" class="div">10011</text>
  <text x="320" y="182" text-anchor="middle" class="op">→ 商0，落下一位</text>
  
  <line x1="20" y1="192" x2="340" y2="192" stroke="#eee"/>
  
  <!-- 步骤7 -->
  <text x="60" y="209" text-anchor="middle" class="num">7</text>
  <text x="140" y="209" text-anchor="middle" class="data">10110</text>
  <text x="240" y="209" text-anchor="middle" class="div">10011</text>
  <text x="320" y="209" text-anchor="middle" class="res">= 00101</text>
  
  <line x1="20" y1="219" x2="340" y2="219" stroke="#eee"/>
  
  <!-- 步骤8-10 简化 -->
  <text x="60" y="236" text-anchor="middle" class="num">8-10</text>
  <text x="140" y="236" text-anchor="middle" class="data">10100</text>
  <text x="240" y="236" text-anchor="middle" class="div">10011</text>
  <text x="320" y="236" text-anchor="middle" class="op">→ 商1，XOR</text>
  
  <line x1="20" y1="246" x2="340" y2="246" stroke="#eee"/>
  
  <!-- 最终结果 -->
  <text x="60" y="268" text-anchor="middle" class="num">11</text>
  <text x="140" y="268" text-anchor="middle" class="data">00111</text>
  <text x="240" y="268" text-anchor="middle" class="label">&lt; 除数</text>
  <text x="320" y="268" text-anchor="middle" class="res" font-size="16">余数 = 1110</text>
  
  <!-- 右侧：结果 -->
  <rect x="380" y="75" width="300" height="180" fill="#fff" stroke="#ddd" rx="6"/>
  <text x="530" y="100" text-anchor="middle" class="step">计算结果</text>
  
  <rect x="400" y="115" width="260" height="40" fill="#ffebee" stroke="#ef9a9a" rx="4"/>
  <text x="530" y="132" text-anchor="middle" class="label" fill="#d00">CRC 校验码（余数）</text>
  <text x="530" y="148" text-anchor="middle" class="div" font-size="18">1110</text>
  
  <rect x="400" y="170" width="260" height="40" fill="#e8f5e9" stroke="#a5d6a7" rx="4"/>
  <text x="530" y="187" text-anchor="middle" class="label" fill="#090">实际发送数据</text>
  <text x="530" y="203" text-anchor="middle" class="data" font-size="16">1101011011 1110</text>
  
  <rect x="400" y="220" width="260" height="40" fill="#e3f2fd" stroke="#90caf9" rx="4"/>
  <text x="530" y="237" text-anchor="middle" class="label" fill="#1565c0">接收方校验</text>
  <text x="530" y="253" text-anchor="middle" class="res">余数=0 → 传输正确</text>
  
  <!-- 底部说明 -->
  <rect x="20" y="290" width="660" height="30" fill="#fff3e0" rx="4"/>
  <text x="350" y="310" text-anchor="middle" class="label">注: 除数位数(5) - 1 = CRC码位数(4)  |  CRC-8标准多项式: 0x07 (x⁸+x²+x+1)</text>
</svg>
