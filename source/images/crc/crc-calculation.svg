<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="680" height="420" rx="12" fill="#161b20" stroke="#2b333c"/>
  <text x="28" y="38" font-size="12" font-weight="500" fill="#e0a34b" letter-spacing="1.2">模二除法求 CRC</text>
  <text x="28" y="62" font-size="12" fill="#98a4b1">数据 1101011011　生成多项式 10011（x⁴+x+1）　r = 4</text>

  <rect x="28" y="80" width="380" height="34" rx="4" fill="#21272e"/>
  <text x="58" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#e0a34b">步</text>
  <text x="158" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#e0a34b">当前 5 位</text>
  <text x="273" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#e0a34b">⊕ G(x)</text>
  <text x="363" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#e0a34b">余数</text>

  <line x1="28" y1="114" x2="408" y2="114" stroke="#2b333c"/>
  <line x1="28" y1="148" x2="408" y2="148" stroke="#2b333c"/>
  <line x1="28" y1="182" x2="408" y2="182" stroke="#2b333c"/>
  <line x1="28" y1="216" x2="408" y2="216" stroke="#2b333c"/>
  <line x1="28" y1="250" x2="408" y2="250" stroke="#2b333c"/>
  <line x1="28" y1="284" x2="408" y2="284" stroke="#2b333c"/>
  <line x1="28" y1="318" x2="408" y2="318" stroke="#2b333c"/>

  <text x="58" y="136" text-anchor="middle" font-size="12" fill="#6b7683">1</text>
  <text x="158" y="136" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#6db3e8">11010</text>
  <text x="273" y="136" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#98a4b1">10011</text>
  <text x="363" y="136" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#e9edf2">01001</text>

  <text x="58" y="170" text-anchor="middle" font-size="12" fill="#6b7683">2</text>
  <text x="158" y="170" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#6db3e8">10011</text>
  <text x="273" y="170" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#98a4b1">10011</text>
  <text x="363" y="170" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#e9edf2">00000</text>

  <text x="58" y="204" text-anchor="middle" font-size="12" fill="#6b7683">3</text>
  <text x="158" y="204" text-anchor="middle" font-size="12" fill="#98a4b1">移位 5 次</text>
  <text x="273" y="204" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#6b7683">—</text>
  <text x="363" y="204" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#e9edf2">10110</text>

  <text x="58" y="238" text-anchor="middle" font-size="12" fill="#6b7683">4</text>
  <text x="158" y="238" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#6db3e8">10110</text>
  <text x="273" y="238" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#98a4b1">10011</text>
  <text x="363" y="238" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#e9edf2">00101</text>

  <text x="58" y="272" text-anchor="middle" font-size="12" fill="#6b7683">5</text>
  <text x="158" y="272" text-anchor="middle" font-size="12" fill="#98a4b1">移位 2 次</text>
  <text x="273" y="272" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#6b7683">—</text>
  <text x="363" y="272" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#e9edf2">10100</text>

  <text x="58" y="306" text-anchor="middle" font-size="12" fill="#6b7683">6</text>
  <text x="158" y="306" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#6db3e8">10100</text>
  <text x="273" y="306" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#98a4b1">10011</text>
  <text x="363" y="306" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#e9edf2">00111</text>

  <rect x="28" y="318" width="380" height="34" fill="#a7e8ba" fill-opacity="0.06"/>
  <text x="58" y="340" text-anchor="middle" font-size="12" fill="#6b7683">7</text>
  <text x="158" y="340" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#a7e8ba">01110</text>
  <text x="273" y="340" text-anchor="middle" font-size="11" fill="#6b7683">小于 10011</text>
  <text x="363" y="340" text-anchor="middle" font-size="13" font-weight="700" font-family="Consolas,monospace" fill="#a7e8ba">1110</text>

  <rect x="428" y="80" width="224" height="272" rx="6" fill="#1b2026" stroke="#2b333c"/>
  <text x="540" y="104" text-anchor="middle" font-size="12" font-weight="500" fill="#98a4b1" letter-spacing="0.8">计算结果</text>

  <rect x="444" y="118" width="192" height="60" rx="5" fill="#a7e8ba" fill-opacity="0.08" stroke="#a7e8ba" stroke-opacity="0.35"/>
  <text x="540" y="138" text-anchor="middle" font-size="11" fill="#98a4b1">CRC 校验码（余数）</text>
  <text x="540" y="164" text-anchor="middle" font-size="20" font-weight="700" font-family="Consolas,monospace" fill="#a7e8ba">1110</text>

  <rect x="444" y="188" width="192" height="60" rx="5" fill="#1b2026" stroke="#2b333c"/>
  <text x="540" y="208" text-anchor="middle" font-size="11" fill="#98a4b1">实际发送的数据</text>
  <text x="540" y="234" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#e9edf2">1101011011 1110</text>

  <rect x="444" y="258" width="192" height="60" rx="5" fill="#1b2026" stroke="#2b333c"/>
  <text x="540" y="278" text-anchor="middle" font-size="11" fill="#98a4b1">接收端再除一次</text>
  <text x="540" y="304" text-anchor="middle" font-size="12" fill="#6db3e8">余数 0 → 传输正确</text>

  <text x="28" y="382" font-size="11.5" fill="#6b7683">校验码位数 r 由生成多项式决定：G(x) 为 5 位 → r = 5 − 1 = 4</text>
</svg>
