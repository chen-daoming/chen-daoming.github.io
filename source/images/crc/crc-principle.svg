<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a4b1"/>
    </marker>
  </defs>

  <rect width="680" height="350" rx="12" fill="#161b20" stroke="#2b333c"/>
  <text x="28" y="38" font-size="12" font-weight="500" fill="#e0a34b" letter-spacing="1.2">CRC 校验原理</text>

  <text x="28" y="64" font-size="11" font-weight="700" fill="#e0a34b">发送方</text>

  <rect x="28" y="76" width="140" height="58" rx="6" fill="#1b2026" stroke="#e0a34b" stroke-opacity="0.45"/>
  <text x="98" y="100" text-anchor="middle" font-size="13" fill="#e9edf2">原始数据 D(x)</text>
  <text x="98" y="118" text-anchor="middle" font-size="11" fill="#98a4b1">k bit</text>

  <rect x="188" y="76" width="140" height="58" rx="6" fill="#1b2026" stroke="#e0a34b" stroke-opacity="0.45"/>
  <text x="258" y="100" text-anchor="middle" font-size="13" fill="#e9edf2">左移 r 位</text>
  <text x="258" y="118" text-anchor="middle" font-size="11" fill="#98a4b1">末尾补 r 个 0</text>

  <rect x="348" y="76" width="140" height="58" rx="6" fill="#1b2026" stroke="#e0a34b" stroke-opacity="0.45"/>
  <text x="418" y="100" text-anchor="middle" font-size="13" fill="#e9edf2">模二除 ÷ G(x)</text>
  <text x="418" y="118" text-anchor="middle" font-size="11" fill="#98a4b1">生成多项式</text>

  <rect x="508" y="76" width="140" height="58" rx="6" fill="#1b2026" stroke="#e0a34b" stroke-opacity="0.45"/>
  <text x="578" y="100" text-anchor="middle" font-size="13" fill="#e9edf2">取余数 R</text>
  <text x="578" y="118" text-anchor="middle" font-size="11" fill="#a7e8ba">CRC 码 r bit</text>

  <line x1="168" y1="105" x2="186" y2="105" stroke="#98a4b1" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="328" y1="105" x2="346" y2="105" stroke="#98a4b1" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="488" y1="105" x2="506" y2="105" stroke="#98a4b1" stroke-width="1.5" marker-end="url(#ar)"/>

  <line x1="578" y1="134" x2="578" y2="202" stroke="#6b7683" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="592" y="172" font-size="11" fill="#6b7683">信道</text>

  <text x="28" y="196" font-size="11" font-weight="700" fill="#6db3e8">接收方</text>

  <rect x="508" y="208" width="140" height="58" rx="6" fill="#1b2026" stroke="#6db3e8" stroke-opacity="0.45"/>
  <text x="578" y="232" text-anchor="middle" font-size="13" fill="#e9edf2">接收 D'(x)</text>
  <text x="578" y="250" text-anchor="middle" font-size="11" fill="#98a4b1">可能含误码</text>

  <rect x="348" y="208" width="140" height="58" rx="6" fill="#1b2026" stroke="#6db3e8" stroke-opacity="0.45"/>
  <text x="418" y="232" text-anchor="middle" font-size="13" fill="#e9edf2">模二除 ÷ G(x)</text>
  <text x="418" y="250" text-anchor="middle" font-size="11" fill="#98a4b1">同一个 G(x)</text>

  <rect x="188" y="208" width="140" height="58" rx="6" fill="#1b2026" stroke="#6db3e8" stroke-opacity="0.45"/>
  <text x="258" y="232" text-anchor="middle" font-size="13" fill="#e9edf2">余数 = 0 ?</text>
  <text x="258" y="250" text-anchor="middle" font-size="11" fill="#98a4b1">判定依据</text>

  <rect x="28" y="208" width="140" height="58" rx="6" fill="#1b2026" stroke="#6db3e8" stroke-opacity="0.45"/>
  <text x="98" y="232" text-anchor="middle" font-size="13" fill="#e9edf2">接受 / 重传</text>
  <text x="98" y="250" text-anchor="middle" font-size="11" fill="#98a4b1">0 → 收，非 0 → 弃</text>

  <line x1="506" y1="237" x2="490" y2="237" stroke="#98a4b1" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="346" y1="237" x2="330" y2="237" stroke="#98a4b1" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="186" y1="237" x2="170" y2="237" stroke="#98a4b1" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="28" y="286" width="624" height="32" rx="6" fill="#a7e8ba" fill-opacity="0.08" stroke="#2b333c"/>
  <text x="340" y="307" text-anchor="middle" font-size="13" fill="#a7e8ba">发送的是 D(x)·2ʳ + R，接收端再除一次，余数为 0 即数据完整</text>
</svg>
