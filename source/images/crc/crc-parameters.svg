<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260">
  <style>
    text { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 18px; font-weight: bold; fill: #1a1a2e; }
    .param { font-size: 14px; font-weight: bold; fill: #1565c0; font-family: 'Consolas', monospace; }
    .desc { font-size: 13px; fill: #333; }
    .val { font-size: 13px; fill: #d00; font-family: 'Consolas', monospace; }
    .label { font-size: 12px; fill: #666; }
  </style>
  
  <rect width="680" height="260" fill="#f8f9fa" rx="10"/>
  <text x="340" y="28" text-anchor="middle" class="title">CRC 算法参数说明</text>
  
  <!-- 参数列表 -->
  <rect x="20" y="45" width="350" height="200" fill="#fff" stroke="#ddd" rx="6"/>
  
  <text x="40" y="72" class="param">width</text>
  <text x="120" y="72" class="desc">CRC码位宽（如 32）</text>
  
  <line x1="40" y1="82" x2="350" y2="82" stroke="#eee"/>
  
  <text x="40" y="102" class="param">poly</text>
  <text x="120" y="102" class="desc">生成多项式（省略最高位）</text>
  
  <line x1="40" y1="112" x2="350" y2="112" stroke="#eee"/>
  
  <text x="40" y="132" class="param">init</text>
  <text x="120" y="132" class="desc">CRC寄存器初始值</text>
  
  <line x1="40" y1="142" x2="350" y2="142" stroke="#eee"/>
  
  <text x="40" y="162" class="param">refin</text>
  <text x="120" y="162" class="desc">输入数据按位倒序</text>
  
  <line x1="40" y1="172" x2="350" y2="172" stroke="#eee"/>
  
  <text x="40" y="192" class="param">refout</text>
  <text x="120" y="192" class="desc">输出CRC码按位倒序</text>
  
  <line x1="40" y1="202" x2="350" y2="202" stroke="#eee"/>
  
  <text x="40" y="222" class="param">xorout</text>
  <text x="120" y="222" class="desc">输出前异或值</text>
  
  <!-- 示例框 -->
  <rect x="390" y="45" width="270" height="200" fill="#fff" stroke="#d00" rx="6"/>
  <text x="525" y="70" text-anchor="middle" class="param" fill="#d00">CRC-32 示例</text>
  
  <line x1="410" y1="80" x2="640" y2="80" stroke="#eee"/>
  
  <text x="410" y="100" class="label">width  = </text>
  <text x="480" y="100" class="val">32</text>
  
  <text x="410" y="125" class="label">poly   = </text>
  <text x="480" y="125" class="val">0x04C11DB7</text>
  
  <text x="410" y="150" class="label">init   = </text>
  <text x="480" y="150" class="val">0xFFFFFFFF</text>
  
  <text x="410" y="175" class="label">refin  = </text>
  <text x="480" y="175" class="val">true</text>
  
  <text x="410" y="200" class="label">refout = </text>
  <text x="480" y="200" class="val">true</text>
  
  <text x="410" y="225" class="label">xorout = </text>
  <text x="480" y="225" class="val">0xFFFFFFFF</text>
  
  <!-- 验证值 -->
  <rect x="390" y="250" width="270" height="25" fill="#e8f5e9" rx="4"/>
  <text x="525" y="267" text-anchor="middle" class="label" fill="#090">验证: "123456789" → 0xCBF43926</text>
</svg>
