<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="680" height="360" rx="12" fill="#161b20" stroke="#2b333c"/>
  <text x="28" y="38" font-size="12" font-weight="500" fill="#e0a34b" letter-spacing="1.2">CRC 算法参数</text>

  <rect x="28" y="64" width="352" height="240" rx="6" fill="#1b2026" stroke="#2b333c"/>
  <line x1="28" y1="104" x2="380" y2="104" stroke="#2b333c"/>
  <line x1="28" y1="144" x2="380" y2="144" stroke="#2b333c"/>
  <line x1="28" y1="184" x2="380" y2="184" stroke="#2b333c"/>
  <line x1="28" y1="224" x2="380" y2="224" stroke="#2b333c"/>
  <line x1="28" y1="264" x2="380" y2="264" stroke="#2b333c"/>

  <text x="48" y="89" font-size="13" font-family="Consolas,monospace" fill="#6db3e8">width</text>
  <text x="140" y="89" font-size="12" fill="#e9edf2">CRC 码位宽（如 32）</text>

  <text x="48" y="129" font-size="13" font-family="Consolas,monospace" fill="#6db3e8">poly</text>
  <text x="140" y="129" font-size="12" fill="#e9edf2">生成多项式（省略最高位）</text>

  <text x="48" y="169" font-size="13" font-family="Consolas,monospace" fill="#6db3e8">init</text>
  <text x="140" y="169" font-size="12" fill="#e9edf2">寄存器初始值</text>

  <text x="48" y="209" font-size="13" font-family="Consolas,monospace" fill="#6db3e8">refin</text>
  <text x="140" y="209" font-size="12" fill="#e9edf2">输入数据按位倒序</text>

  <text x="48" y="249" font-size="13" font-family="Consolas,monospace" fill="#6db3e8">refout</text>
  <text x="140" y="249" font-size="12" fill="#e9edf2">输出结果按位倒序</text>

  <text x="48" y="289" font-size="13" font-family="Consolas,monospace" fill="#6db3e8">xorout</text>
  <text x="140" y="289" font-size="12" fill="#e9edf2">输出前再异或的值</text>

  <rect x="404" y="64" width="248" height="240" rx="6" fill="#1b2026" stroke="#2b333c"/>
  <text x="528" y="88" text-anchor="middle" font-size="12" font-weight="500" fill="#e0a34b">CRC-32 参数值</text>
  <line x1="404" y1="100" x2="652" y2="100" stroke="#2b333c"/>

  <text x="420" y="129" font-size="11" fill="#98a4b1">width</text>
  <text x="636" y="129" text-anchor="end" font-size="12" font-family="Consolas,monospace" fill="#a7e8ba">32</text>

  <text x="420" y="161" font-size="11" fill="#98a4b1">poly</text>
  <text x="636" y="161" text-anchor="end" font-size="12" font-family="Consolas,monospace" fill="#a7e8ba">0x04C11DB7</text>

  <text x="420" y="193" font-size="11" fill="#98a4b1">init</text>
  <text x="636" y="193" text-anchor="end" font-size="12" font-family="Consolas,monospace" fill="#a7e8ba">0xFFFFFFFF</text>

  <text x="420" y="225" font-size="11" fill="#98a4b1">refin</text>
  <text x="636" y="225" text-anchor="end" font-size="12" font-family="Consolas,monospace" fill="#a7e8ba">true</text>

  <text x="420" y="257" font-size="11" fill="#98a4b1">refout</text>
  <text x="636" y="257" text-anchor="end" font-size="12" font-family="Consolas,monospace" fill="#a7e8ba">true</text>

  <text x="420" y="289" font-size="11" fill="#98a4b1">xorout</text>
  <text x="636" y="289" text-anchor="end" font-size="12" font-family="Consolas,monospace" fill="#a7e8ba">0xFFFFFFFF</text>

  <rect x="28" y="316" width="624" height="32" rx="6" fill="#a7e8ba" fill-opacity="0.08" stroke="#2b333c"/>
  <text x="340" y="337" text-anchor="middle" font-size="12.5" fill="#a7e8ba">验证：输入 “123456789” → CRC-32 = 0xCBF43926</text>
</svg>
