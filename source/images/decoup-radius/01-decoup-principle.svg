<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="480" fill="#fbfcfd"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">去耦电容的本职：芯片的“本地电荷中转站”</text>

  <!-- ============ 左：两条供电路径 ============ -->
  <text x="215" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#2980b9">① 芯片抽电流瞬间，谁先顶上？</text>

  <!-- VRM -->
  <rect x="60" y="140" width="96" height="70" rx="8" fill="#eef2f8" stroke="#5a6b7b" stroke-width="2"/>
  <text x="108" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#34549a">DCDC/LDO</text>
  <text x="108" y="188" text-anchor="middle" font-size="10.5" fill="#8a97a5">稳压器（远）</text>

  <!-- 长路径（带电感） -->
  <line x1="156" y1="165" x2="286" y2="165" stroke="#8a97a5" stroke-width="2"/>
  <g fill="none" stroke="#8a97a5" stroke-width="2">
    <path d="M176 165 a9 9 0 0 1 18 0"/>
    <path d="M204 165 a9 9 0 0 1 18 0"/>
    <path d="M232 165 a9 9 0 0 1 18 0"/>
  </g>
  <text x="215" y="150" text-anchor="middle" font-size="10" fill="#8a97a5">长路径：绕远 + 电感大</text>

  <!-- 就近电容 -->
  <line x1="252" y1="210" x2="290" y2="210" stroke="#27ae60" stroke-width="3"/>
  <line x1="256" y1="200" x2="256" y2="220" stroke="#27ae60" stroke-width="3"/>
  <line x1="266" y1="200" x2="266" y2="220" stroke="#27ae60" stroke-width="3"/>
  <text x="240" y="244" text-anchor="middle" font-size="10.5" fill="#27ae60" font-weight="600">就近去耦电容</text>
  <text x="240" y="260" text-anchor="middle" font-size="10" fill="#5a6b7b">短路径 · 电感小</text>

  <!-- 芯片 -->
  <rect x="290" y="140" width="90" height="100" rx="8" fill="#34549a"/>
  <text x="335" y="184" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">MCU</text>
  <text x="335" y="204" text-anchor="middle" font-size="10" fill="#cdd8ef">瞬间抽电流</text>

  <!-- 电流箭头 -->
  <g stroke="#d35400" stroke-width="2.6" fill="#d35400">
    <line x1="272" y1="210" x2="284" y2="210"/>
    <path d="M284 205 L294 210 L284 215 z"/>
  </g>
  <text x="215" y="300" text-anchor="middle" font-size="11.5" fill="#d35400" font-weight="600">快变化（ns 级 di/dt）→ 电容先行供电</text>
  <text x="215" y="322" text-anchor="middle" font-size="11.5" fill="#5a6b7b">慢补充（µs~ms）→ 稳压器慢慢把电荷补回电容</text>

  <text x="215" y="366" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">电容不是电池，是“电荷中转站”</text>
  <text x="215" y="392" text-anchor="middle" font-size="11" fill="#8a97a5">它只对“快”负责：越快的需求，越要越近的电容</text>

  <!-- ============ 右：安装电感 ============ -->
  <text x="610" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#d35400">② 真正决定频段的是“安装电感”</text>

  <!-- 电容本体制视 -->
  <rect x="520" y="100" width="120" height="34" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="580" y="122" text-anchor="middle" font-size="11.5" font-weight="700" fill="#27ae60">电容本体（ESL）</text>
  <!-- 焊盘 + 走线 -->
  <line x1="540" y1="134" x2="540" y2="160" stroke="#1f2d3d" stroke-width="3"/>
  <line x1="620" y1="134" x2="620" y2="160" stroke="#1f2d3d" stroke-width="3"/>
  <text x="666" y="152" font-size="10.5" fill="#5a6b7b">焊盘 + 引出线</text>
  <!-- 过孔 -->
  <rect x="534" y="160" width="12" height="46" rx="3" fill="#b8c4cf" stroke="#5a6b7b" stroke-width="1.6"/>
  <rect x="614" y="160" width="12" height="46" rx="3" fill="#b8c4cf" stroke="#5a6b7b" stroke-width="1.6"/>
  <text x="666" y="188" font-size="10.5" fill="#5a6b7b">两个过孔（往往是大头）</text>
  <!-- 平面 -->
  <rect x="490" y="210" width="220" height="18" fill="#eaf0fb" stroke="#34549a" stroke-width="1.6"/>
  <text x="600" y="223" text-anchor="middle" font-size="10" fill="#34549a">电源 / 地平面</text>
  <!-- 回路 -->
  <path d="M540 117 H520 V233 H540" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="505" y="262" font-size="10.5" fill="#c0392b">回路面积 ↑ → 电感 ↑</text>

  <!-- 数字对比 -->
  <rect x="460" y="286" width="310" height="120" rx="10" fill="#ffffff" stroke="#d5dde5"/>
  <text x="615" y="312" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">同一颗 1nF 电容：装法不同，命运不同</text>
  <line x1="478" y1="324" x2="752" y2="324" stroke="#e3e9ee" stroke-width="1.2"/>
  <g font-size="11.5">
    <text x="478" y="348" fill="#27ae60" font-weight="700">理想安装 0.5nH</text>
    <text x="640" y="348" fill="#1f2d3d" font-family="'Consolas',monospace">f0 = 225 MHz</text>
    <text x="478" y="374" fill="#c0392b" font-weight="700">常规安装 1.6nH</text>
    <text x="640" y="374" fill="#1f2d3d" font-family="'Consolas',monospace">f0 = 126 MHz</text>
    <text x="478" y="396" fill="#5a6b7b">安装电感翻了 3 倍，可用频段直接腰斩</text>
  </g>

  <text x="410" y="452" text-anchor="middle" font-size="12" fill="#5a6b7b">结论：去耦性能 = 电容本体 × 安装方式，二者取短板</text>
</svg>
