<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="480" fill="#fbfcfd"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">电容摆放正误对比（俯视示意）</text>

  <!-- ============ ① 正确：贴脚+贴孔 ============ -->
  <rect x="40" y="56" width="365" height="180" rx="10" fill="#f4fcf6" stroke="#27ae60" stroke-width="1.8"/>
  <text x="222" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1e8449">✓ 贴脚贴孔：教科书摆法</text>
  <rect x="70" y="120" width="66" height="90" rx="6" fill="#34549a"/>
  <text x="103" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">MCU</text>
  <line x1="136" y1="140" x2="170" y2="140" stroke="#1f2d3d" stroke-width="3"/>
  <rect x="170" y="130" width="52" height="20" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="196" y="145" text-anchor="middle" font-size="10" fill="#27ae60">0.1µF</text>
  <rect x="176" y="158" width="10" height="42" rx="3" fill="#b8c4cf" stroke="#5a6b7b" stroke-width="1.4"/>
  <rect x="206" y="158" width="10" height="42" rx="3" fill="#b8c4cf" stroke="#5a6b7b" stroke-width="1.4"/>
  <line x1="196" y1="158" x2="196" y2="158" stroke="none"/>
  <line x1="170" y1="140" x2="170" y2="158" stroke="#1f2d3d" stroke-width="3"/>
  <line x1="222" y1="140" x2="236" y2="140" stroke="#1f2d3d" stroke-width="3"/>
  <line x1="236" y1="140" x2="236" y2="220" stroke="#1f2d3d" stroke-width="2" opacity="0"/>
  <text x="280" y="138" font-size="10.5" fill="#5a6b7b">过孔紧贴焊盘</text>
  <text x="280" y="156" font-size="10.5" fill="#5a6b7b">先焊盘后过孔</text>
  <text x="280" y="196" font-size="10.5" fill="#5a6b7b">回路面积最小</text>
  <text x="222" y="232" text-anchor="middle" font-size="10.5" fill="#1e8449">安装电感 ≈ 1nH 级，高频段保得住</text>

  <!-- ============ ② 错误：放太远 ============ -->
  <rect x="425" y="56" width="365" height="180" rx="10" fill="#fdf4f3" stroke="#e6b8b3" stroke-width="1.8"/>
  <text x="607" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">✗ 放太远：出了去耦半径</text>
  <rect x="455" y="120" width="66" height="90" rx="6" fill="#34549a"/>
  <text x="488" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">MCU</text>
  <circle cx="488" cy="165" r="62" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="560" y="110" font-size="9.5" fill="#c0392b">半径 r ≈ 2.4cm（1nF 算例）</text>
  <line x1="521" y1="140" x2="640" y2="128" stroke="#c0392b" stroke-width="2"/>
  <rect x="640" y="118" width="52" height="20" rx="4" fill="#eceff3" stroke="#95a5a6" stroke-width="2"/>
  <text x="666" y="133" text-anchor="middle" font-size="10" fill="#7f8c8d">0.1µF</text>
  <text x="666" y="164" text-anchor="middle" font-size="10.5" fill="#c0392b" font-weight="600">界外 ✗</text>
  <text x="607" y="232" text-anchor="middle" font-size="10.5" fill="#c0392b">相位赶不上，高频电流还是得从远处电源抽</text>

  <!-- ============ ③ 错误：过孔远+细长线 ============ -->
  <rect x="40" y="250" width="365" height="180" rx="10" fill="#fdf4f3" stroke="#e6b8b3" stroke-width="1.8"/>
  <text x="222" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">✗ 过孔远、走线细长</text>
  <rect x="70" y="314" width="66" height="90" rx="6" fill="#34549a"/>
  <text x="103" y="364" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">MCU</text>
  <line x1="136" y1="334" x2="180" y2="334" stroke="#1f2d3d" stroke-width="1.4"/>
  <rect x="180" y="324" width="52" height="20" rx="4" fill="#eceff3" stroke="#95a5a6" stroke-width="2"/>
  <text x="206" y="339" text-anchor="middle" font-size="10" fill="#7f8c8d">0.1µF</text>
  <line x1="232" y1="334" x2="286" y2="334" stroke="#1f2d3d" stroke-width="1.4"/>
  <rect x="286" y="322" width="10" height="56" rx="3" fill="#b8c4cf" stroke="#5a6b7b" stroke-width="1.4"/>
  <path d="M136 334 H100 V404" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="238" y="366" font-size="10.5" fill="#c0392b">细线 + 孔拉远</text>
  <text x="238" y="384" font-size="10.5" fill="#c0392b">回路被撑大</text>
  <text x="222" y="424" text-anchor="middle" font-size="10.5" fill="#c0392b">安装电感可翻倍，f₀ 掉一半，白瞎好电容</text>

  <!-- ============ ④ 正确：按半径分层 ============ -->
  <rect x="425" y="250" width="365" height="180" rx="10" fill="#f4fcf6" stroke="#27ae60" stroke-width="1.8"/>
  <text x="607" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#1e8449">✓ 多电容按半径分层布置</text>
  <rect x="575" y="330" width="56" height="48" rx="6" fill="#34549a"/>
  <text x="603" y="359" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">MCU</text>
  <circle cx="603" cy="354" r="46" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="603" cy="354" r="82" fill="none" stroke="#2980b9" stroke-width="1.4" stroke-dasharray="6 4"/>
  <g>
    <rect x="566" y="304" width="18" height="9" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <rect x="636" y="316" width="18" height="9" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <rect x="566" y="396" width="18" height="9" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
    <rect x="500" y="290" width="22" height="11" rx="2" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.4"/>
    <rect x="696" y="376" width="22" height="11" rx="2" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.4"/>
  </g>
  <text x="770" y="302" text-anchor="end" font-size="10" fill="#27ae60" font-weight="600">小电容（0.1µF）</text>
  <line x1="700" y1="300" x2="588" y2="308" stroke="#27ae60" stroke-width="1"/>
  <text x="770" y="420" text-anchor="end" font-size="10" fill="#2980b9" font-weight="600">大电容（10µF）</text>
  <line x1="708" y1="414" x2="708" y2="389" stroke="#2980b9" stroke-width="1"/>
  <text x="607" y="442" text-anchor="middle" font-size="10.5" fill="#5a6b7b">频段互补：高频贴芯、低频供能，各守各的半径</text>

  <text x="410" y="466" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">口诀：小电容贴引脚 · 过孔贴焊盘 · 线短而粗 · 大电容外围自由放</text>
</svg>
