<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="440" fill="#fbfcfd"/>
  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">PCB 美学对比：缺乏规划 vs 栅格对齐</text>

  <!-- 左：凌乱 -->
  <rect x="40" y="56" width="340" height="350" rx="10" fill="#fdf0ef" stroke="#c0392b" stroke-width="1.8"/>
  <text x="210" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">✗ 缺乏规划：乱、挤、绕</text>
  <!-- 元件方向不一、间距不等 -->
  <g stroke="#7a4a47" stroke-width="1.6" fill="#f3d9d7">
    <rect x="80" y="120" width="46" height="22" transform="rotate(12 103 131)"/>
    <rect x="150" y="116" width="46" height="22" transform="rotate(-8 173 127)"/>
    <rect x="210" y="138" width="46" height="22" transform="rotate(20 233 149)"/>
    <rect x="270" y="118" width="46" height="22"/>
  </g>
  <g stroke="#7a4a47" stroke-width="1.6" fill="#f3d9d7">
    <rect x="86" y="210" width="22" height="46"/>
    <rect x="150" y="200" width="46" height="22" transform="rotate(6 173 211)"/>
    <rect x="232" y="214" width="22" height="46" transform="rotate(-14 243 237)"/>
    <rect x="286" y="206" width="46" height="22" transform="rotate(16 309 217)"/>
  </g>
  <!-- 斜绕锐角走线 -->
  <polyline points="90,160 120,190 100,250 180,280 160,330 300,320" fill="none" stroke="#c0392b" stroke-width="2"/>
  <polyline points="250,160 300,200 260,250 320,300" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="210" y="360" text-anchor="middle" font-size="12" fill="#7a4a47">方向不一·间距不等·斜绕锐角·疏密失衡·丝印乱</text>
  <text x="210" y="382" text-anchor="middle" font-size="12" fill="#7a4a47">→ 难焊接、易出错、EMC 与可维护性都差</text>

  <!-- 中间箭头 -->
  <g fill="#27ae60">
    <path d="M392 215 L428 215 L428 200 L452 225 L428 250 L428 235 L392 235 z"/>
  </g>

  <!-- 右：整齐 -->
  <rect x="460" y="56" width="340" height="350" rx="10" fill="#eefaf2" stroke="#27ae60" stroke-width="1.8"/>
  <text x="630" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#1e8449">✓ 栅格对齐：齐、匀、顺</text>
  <!-- 栅格 -->
  <g stroke="#d6ebe0" stroke-width="1">
    <line x1="500" y1="110" x2="760" y2="110"/><line x1="500" y1="160" x2="760" y2="160"/>
    <line x1="500" y1="210" x2="760" y2="210"/><line x1="500" y1="260" x2="760" y2="260"/>
    <line x1="500" y1="310" x2="760" y2="310"/>
    <line x1="520" y1="100" x2="520" y2="330"/><line x1="580" y1="100" x2="580" y2="330"/>
    <line x1="640" y1="100" x2="640" y2="330"/><line x1="700" y1="100" x2="700" y2="330"/>
  </g>
  <!-- 等间距同向元件 -->
  <g stroke="#1e8449" stroke-width="1.6" fill="#d8f0e1">
    <rect x="500" y="119" width="40" height="22"/><rect x="560" y="119" width="40" height="22"/>
    <rect x="620" y="119" width="40" height="22"/><rect x="680" y="119" width="40" height="22"/>
    <rect x="500" y="219" width="40" height="22"/><rect x="560" y="219" width="40" height="22"/>
    <rect x="620" y="219" width="40" height="22"/><rect x="680" y="219" width="40" height="22"/>
  </g>
  <!-- 对齐虚线 -->
  <g stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="495" y1="130" x2="765" y2="130"/><line x1="495" y1="230" x2="765" y2="230"/>
  </g>
  <!-- 横平竖直 + 45° 走线 -->
  <polyline points="520,160 520,190 600,190 600,219" fill="none" stroke="#1e8449" stroke-width="2"/>
  <polyline points="640,160 640,180 700,180 700,219" fill="none" stroke="#1e8449" stroke-width="2"/>
  <text x="630" y="360" text-anchor="middle" font-size="12" fill="#1e8449">栅格定位·方向一致·等间距对称·横平竖直/45°·疏密均衡</text>
  <text x="630" y="382" text-anchor="middle" font-size="12" fill="#1e8449">→ 易焊易测、应力均衡，本身也是好的电气布局</text>
</svg>
