<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="480" fill="#fbfcfd"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">PCB 功能分区与信号流向布局示意（俯视）</text>

  <!-- PCB 板框 -->
  <rect x="50" y="60" width="720" height="370" rx="14" fill="#f4f7fa" stroke="#5a6b7b" stroke-width="2.2"/>
  <text x="66" y="82" font-size="12" fill="#8a97a5">PCB 板边</text>
  <!-- 安装孔 -->
  <g fill="#ffffff" stroke="#5a6b7b" stroke-width="2">
    <circle cx="72" cy="82" r="7"/><circle cx="748" cy="82" r="7"/><circle cx="72" cy="408" r="7"/><circle cx="748" cy="408" r="7"/>
  </g>

  <!-- 顶部板边：接插件 -->
  <rect x="250" y="72" width="320" height="34" rx="6" fill="#eceff3" stroke="#8a97a5" stroke-width="1.6"/>
  <text x="410" y="94" text-anchor="middle" font-size="13.5" fill="#5a6b7b" font-weight="600">接插件 / 扩展接口 —— 尽量布置在板边，便于插拔与出线</text>

  <!-- 输入处理（左） -->
  <rect x="78" y="140" width="150" height="120" rx="8" fill="#eaf2fb" stroke="#2980b9" stroke-width="2"/>
  <text x="153" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#2980b9">信号输入处理</text>
  <text x="153" y="204" text-anchor="middle" font-size="12" fill="#1f2d3d">采样 / 放大 / 滤波</text>
  <text x="153" y="226" text-anchor="middle" font-size="12" fill="#8a97a5">（模拟·易受干扰）</text>

  <!-- 核心控制（中） -->
  <rect x="300" y="130" width="220" height="140" rx="8" fill="#eaf0fb" stroke="#34549a" stroke-width="2.4"/>
  <rect x="360" y="168" width="100" height="64" rx="6" fill="#34549a"/>
  <text x="410" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">MCU / SoC</text>
  <text x="410" y="218" text-anchor="middle" font-size="11" fill="#cdd8ef">核心芯片居中</text>
  <text x="410" y="256" text-anchor="middle" font-size="11.5" fill="#34549a">晶振·去耦·复位就近围绕</text>

  <!-- 输出处理（右） -->
  <rect x="592" y="140" width="150" height="120" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="667" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#27ae60">信号输出处理</text>
  <text x="667" y="204" text-anchor="middle" font-size="12" fill="#1f2d3d">驱动 / 执行 / 接口</text>
  <text x="667" y="226" text-anchor="middle" font-size="12" fill="#8a97a5">（数字·功率）</text>

  <!-- 信号流箭头 -->
  <g stroke="#d35400" stroke-width="2.6" fill="#d35400">
    <line x1="232" y1="200" x2="292" y2="200"/>
    <path d="M292 194 L302 200 L292 206 z"/>
    <line x1="524" y1="200" x2="584" y2="200"/>
    <path d="M584 194 L594 200 L584 206 z"/>
  </g>
  <text x="262" y="190" text-anchor="middle" font-size="11.5" fill="#d35400" font-weight="600">输入</text>
  <text x="554" y="190" text-anchor="middle" font-size="11.5" fill="#d35400" font-weight="600">输出</text>
  <text x="410" y="120" text-anchor="middle" font-size="12" fill="#d35400">主信号流向：从左到右，方向一致、少交叉迂回</text>

  <!-- 左侧板边输入接插件 -->
  <rect x="56" y="170" width="20" height="60" rx="4" fill="#eceff3" stroke="#8a97a5" stroke-width="1.6"/>
  <!-- 右侧板边输出接插件 -->
  <rect x="744" y="170" width="20" height="60" rx="4" fill="#eceff3" stroke="#8a97a5" stroke-width="1.6"/>

  <!-- 电源区（板边，左下） -->
  <rect x="78" y="300" width="320" height="86" rx="8" fill="#fdf1e7" stroke="#d35400" stroke-width="2"/>
  <text x="238" y="328" text-anchor="middle" font-size="14.5" font-weight="700" fill="#d35400">电源模块（DC-DC / LDO）</text>
  <text x="238" y="352" text-anchor="middle" font-size="12" fill="#1f2d3d">集中布置在板边、靠近输入；开关管·电感·二极管紧凑</text>
  <text x="238" y="372" text-anchor="middle" font-size="12" fill="#1f2d3d">输入回路面积最小，发热器件靠边利于散热</text>

  <!-- 人机交互（板边，右下） -->
  <rect x="422" y="300" width="320" height="86" rx="8" fill="#f2eafb" stroke="#8e44ad" stroke-width="2"/>
  <text x="582" y="328" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8e44ad">人机交互（显示 / 按键 / 指示）</text>
  <text x="582" y="352" text-anchor="middle" font-size="12" fill="#1f2d3d">面向操作者一侧，符合人机工程</text>
  <text x="582" y="372" text-anchor="middle" font-size="12" fill="#1f2d3d">常用开关·可调元件放在易触及处</text>

  <!-- 分区隔离标注 -->
  <text x="410" y="456" text-anchor="middle" font-size="12.5" fill="#5a6b7b">模拟 / 数字、高频 / 低频、强电 / 弱电按模块分区隔离；各模块元件落在栅格上，平行或垂直排列，求整齐美观</text>
</svg>
