<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="440" fill="#fbfcfd"/>
  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">关键元件布局：去耦电容就近供电 &amp; 晶振紧贴 MCU</text>
  <line x1="410" y1="50" x2="410" y2="410" stroke="#dfe5ea" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- ============ 左：去耦电容 ============ -->
  <text x="200" y="66" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2980b9">① 去耦 / 旁路电容紧贴电源脚（常 0.1µF）</text>
  <!-- IC -->
  <rect x="250" y="120" width="120" height="220" rx="8" fill="#eef2f8" stroke="#34549a" stroke-width="2.2"/>
  <text x="310" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#34549a">IC</text>
  <!-- 右侧电源脚 -->
  <g fill="#34549a">
    <rect x="370" y="150" width="14" height="10"/><rect x="370" y="180" width="14" height="10"/>
    <rect x="370" y="300" width="14" height="10"/><rect x="370" y="330" width="14" height="10"/>
  </g>
  <text x="402" y="160" font-size="11" fill="#1f2d3d">VCC</text>
  <text x="402" y="338" font-size="11" fill="#1f2d3d">GND</text>
  <!-- 短走线 -->
  <line x1="384" y1="155" x2="430" y2="155" stroke="#c0392b" stroke-width="3"/>
  <line x1="384" y1="335" x2="430" y2="335" stroke="#1f2d3d" stroke-width="3"/>
  <!-- 去耦电容 C 紧贴 -->
  <line x1="430" y1="155" x2="430" y2="238" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="430" y1="335" x2="430" y2="252" stroke="#1f2d3d" stroke-width="2.4"/>
  <line x1="418" y1="238" x2="442" y2="238" stroke="#1f2d3d" stroke-width="3"/>
  <line x1="418" y1="252" x2="442" y2="252" stroke="#1f2d3d" stroke-width="3"/>
  <text x="452" y="250" font-size="12.5" font-weight="700" fill="#c0392b">0.1µF</text>
  <!-- 最小回路高亮 -->
  <rect x="408" y="142" width="42" height="202" rx="6" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="200" y="378" text-anchor="middle" font-size="12" fill="#1f2d3d">电容紧靠引脚、走线短而粗，把充放电回路面积压到最小</text>
  <text x="200" y="400" text-anchor="middle" font-size="12" fill="#8a97a5">作“微型电荷库”抑制开关瞬态压降，旁路电源高频噪声</text>

  <!-- ============ 右：晶振 ============ -->
  <text x="615" y="66" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8e44ad">② 晶振 / 谐振器紧贴 OSC 脚、对称最短</text>
  <!-- MCU -->
  <rect x="600" y="120" width="130" height="220" rx="8" fill="#eef2f8" stroke="#34549a" stroke-width="2.2"/>
  <text x="665" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#34549a">MCU</text>
  <!-- 左侧 OSC 脚 -->
  <g fill="#34549a">
    <rect x="586" y="180" width="14" height="10"/><rect x="586" y="220" width="14" height="10"/>
  </g>
  <text x="556" y="172" text-anchor="end" font-size="11" fill="#1f2d3d">OSC1</text>
  <text x="556" y="230" text-anchor="end" font-size="11" fill="#1f2d3d">OSC2</text>
  <!-- 对称走线到晶振 -->
  <line x1="586" y1="185" x2="540" y2="185" stroke="#8e44ad" stroke-width="2.4"/>
  <line x1="586" y1="225" x2="540" y2="225" stroke="#8e44ad" stroke-width="2.4"/>
  <!-- 晶振 -->
  <rect x="470" y="178" width="70" height="54" rx="6" fill="#f2eafb" stroke="#8e44ad" stroke-width="2"/>
  <text x="505" y="202" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8e44ad">X-TAL</text>
  <text x="505" y="220" text-anchor="middle" font-size="10.5" fill="#8a97a5">晶振</text>
  <!-- 两个负载电容对称下地 -->
  <line x1="520" y1="185" x2="520" y2="270" stroke="#1f2d3d" stroke-width="1.8"/>
  <line x1="560" y1="225" x2="560" y2="270" stroke="#1f2d3d" stroke-width="1.8"/>
  <line x1="512" y1="270" x2="528" y2="270" stroke="#1f2d3d" stroke-width="2.6"/>
  <line x1="512" y1="282" x2="528" y2="282" stroke="#1f2d3d" stroke-width="2.6"/>
  <line x1="552" y1="270" x2="568" y2="270" stroke="#1f2d3d" stroke-width="2.6"/>
  <line x1="552" y1="282" x2="568" y2="282" stroke="#1f2d3d" stroke-width="2.6"/>
  <text x="500" y="300" font-size="11" fill="#1f2d3d">C</text>
  <text x="572" y="300" font-size="11" fill="#1f2d3d">C</text>
  <line x1="470" y1="282" x2="600" y2="282" stroke="#1f2d3d" stroke-width="2"/>
  <text x="615" y="378" text-anchor="middle" font-size="12" fill="#1f2d3d">位置对称、走线等长最短；负载电容就近接地</text>
  <text x="615" y="400" text-anchor="middle" font-size="12" fill="#c0392b">属射频敏感电路，远离高电流走线并做地包围隔离</text>
</svg>
