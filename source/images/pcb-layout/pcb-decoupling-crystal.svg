<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <rect width="820" height="480" fill="#fbfcfd"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">关键元件布局：去耦电容就近 &amp; 晶振紧贴对称</text>
  <line x1="412" y1="52" x2="412" y2="425" stroke="#dfe5ea" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- ================= 左：去耦电容 ================= -->
  <text x="218" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#2980b9">① 去耦电容：就近摆放，回路最小</text>

  <!-- 正确 -->
  <rect x="50" y="92" width="340" height="162" rx="8" fill="#f7fcf8" stroke="#bfe3cd" stroke-width="1.6"/>
  <text x="220" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e8449">✓ 正确：紧贴电源脚</text>
  <rect x="84" y="130" width="64" height="104" rx="6" fill="#eef2f8" stroke="#34549a" stroke-width="2"/>
  <text x="116" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#34549a">IC</text>
  <text x="92" y="153" font-size="10" fill="#34549a">VCC</text>
  <text x="92" y="217" font-size="10" fill="#34549a">GND</text>
  <rect x="148" y="146" width="10" height="8" fill="#34549a"/>
  <rect x="148" y="212" width="10" height="8" fill="#34549a"/>
  <line x1="158" y1="150" x2="196" y2="150" stroke="#c0392b" stroke-width="3"/>
  <line x1="196" y1="150" x2="196" y2="166" stroke="#1f2d3d" stroke-width="2.2"/>
  <line x1="188" y1="166" x2="204" y2="166" stroke="#1f2d3d" stroke-width="3"/>
  <line x1="188" y1="174" x2="204" y2="174" stroke="#1f2d3d" stroke-width="3"/>
  <line x1="196" y1="174" x2="196" y2="216" stroke="#1f2d3d" stroke-width="2.2"/>
  <line x1="158" y1="216" x2="196" y2="216" stroke="#1f2d3d" stroke-width="3"/>
  <g stroke="#1f2d3d" stroke-width="1.8">
    <line x1="188" y1="224" x2="204" y2="224"/><line x1="191" y1="228" x2="201" y2="228"/><line x1="194" y1="232" x2="198" y2="232"/>
  </g>
  <text x="212" y="174" font-size="12" font-weight="700" fill="#c0392b">0.1µF</text>
  <rect x="154" y="142" width="56" height="80" rx="6" fill="none" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="216" y="192" font-size="11" fill="#1e8449">回路最小</text>
  <text x="220" y="248" text-anchor="middle" font-size="11.5" fill="#1e8449">引脚短、走线粗，充放电回路面积最小</text>

  <!-- 错误 -->
  <rect x="50" y="262" width="340" height="162" rx="8" fill="#fef7f6" stroke="#ecd0cc" stroke-width="1.6"/>
  <text x="220" y="286" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c0392b">✗ 错误：电容远离引脚</text>
  <rect x="84" y="300" width="64" height="104" rx="6" fill="#eef2f8" stroke="#34549a" stroke-width="2"/>
  <text x="116" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#34549a">IC</text>
  <text x="92" y="319" font-size="10" fill="#34549a">VCC</text>
  <text x="92" y="385" font-size="10" fill="#34549a">GND</text>
  <rect x="148" y="312" width="10" height="8" fill="#34549a"/>
  <rect x="148" y="378" width="10" height="8" fill="#34549a"/>
  <line x1="158" y1="316" x2="326" y2="316" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="326" y1="316" x2="326" y2="332" stroke="#1f2d3d" stroke-width="1.8"/>
  <line x1="318" y1="332" x2="334" y2="332" stroke="#1f2d3d" stroke-width="2.6"/>
  <line x1="318" y1="340" x2="334" y2="340" stroke="#1f2d3d" stroke-width="2.6"/>
  <line x1="326" y1="340" x2="326" y2="382" stroke="#1f2d3d" stroke-width="1.8"/>
  <line x1="326" y1="382" x2="158" y2="382" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="342" y="340" font-size="12" font-weight="700" fill="#c0392b">0.1µF</text>
  <rect x="154" y="310" width="188" height="78" rx="6" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="236" y="364" text-anchor="middle" font-size="11.5" fill="#c0392b">大环路 → 感抗大，瞬态供电不足</text>
  <text x="220" y="412" text-anchor="middle" font-size="11.5" fill="#c0392b">瞬态电荷无处可取 → 电源瞬间跌落、逻辑误翻转</text>

  <text x="218" y="448" text-anchor="middle" font-size="12" fill="#5a6b7b">数字 = 门翻转的「微型电荷库」；模拟 = 旁路电源高频噪声</text>

  <!-- ================= 右：晶振 ================= -->
  <text x="612" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#8e44ad">② 晶振：紧贴 · 对称 · 最短 · 地包围</text>

  <!-- 局部俯视 -->
  <rect x="435" y="94" width="355" height="332" rx="8" fill="#f4f7fa" stroke="#c3cdd6" stroke-width="1.5"/>
  <text x="455" y="112" font-size="10.5" fill="#8a97a5">局部俯视</text>

  <!-- 高电流走线（保持远离） -->
  <line x1="455" y1="132" x2="640" y2="132" stroke="#e67e22" stroke-width="4" opacity="0.85"/>
  <text x="548" y="152" text-anchor="middle" font-size="11" fill="#d35400">高电流 / 开关走线（保持远离，禁止平行贴近）</text>

  <!-- 地包围 Guard Ring -->
  <rect x="448" y="170" width="182" height="120" rx="10" fill="none" stroke="#27ae60" stroke-width="2.2" stroke-dasharray="7 4"/>
  <g fill="#ffffff" stroke="#27ae60" stroke-width="1.6">
    <circle cx="448" cy="230" r="4.5"/><circle cx="539" cy="170" r="4.5"/><circle cx="630" cy="230" r="4.5"/>
    <circle cx="448" cy="290" r="4.5"/><circle cx="630" cy="290" r="4.5"/>
  </g>

  <!-- MCU -->
  <rect x="640" y="170" width="110" height="150" rx="8" fill="#eef2f8" stroke="#34549a" stroke-width="2.2"/>
  <text x="695" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#34549a">MCU</text>
  <text x="648" y="208" font-size="9.5" fill="#34549a">OSC_IN</text>
  <text x="648" y="248" font-size="9.5" fill="#34549a">OSC_OUT</text>
  <rect x="630" y="200" width="10" height="8" fill="#34549a"/>
  <rect x="630" y="240" width="10" height="8" fill="#34549a"/>
  <rect x="616" y="320" width="8" height="10" fill="#34549a"/>
  <text x="620" y="344" text-anchor="middle" font-size="10" fill="#34549a">GND</text>

  <!-- OSC 对称走线 -->
  <line x1="630" y1="204" x2="605" y2="204" stroke="#8e44ad" stroke-width="2.4"/>
  <line x1="630" y1="244" x2="605" y2="244" stroke="#8e44ad" stroke-width="2.4"/>

  <!-- 晶振 -->
  <rect x="545" y="192" width="60" height="64" rx="6" fill="#f2eafb" stroke="#8e44ad" stroke-width="2"/>
  <text x="575" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8e44ad">Y1</text>
  <text x="575" y="240" text-anchor="middle" font-size="10.5" fill="#8a97a5">晶振</text>

  <!-- 晶振端子 → 负载电容 -->
  <line x1="545" y1="204" x2="470" y2="204" stroke="#8e44ad" stroke-width="1.8"/>
  <line x1="545" y1="244" x2="510" y2="244" stroke="#8e44ad" stroke-width="1.8"/>
  <!-- CL1 -->
  <line x1="470" y1="204" x2="470" y2="216" stroke="#1f2d3d" stroke-width="1.8"/>
  <line x1="462" y1="216" x2="478" y2="216" stroke="#1f2d3d" stroke-width="2.6"/>
  <line x1="462" y1="222" x2="478" y2="222" stroke="#1f2d3d" stroke-width="2.6"/>
  <line x1="470" y1="222" x2="470" y2="268" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="484" y="226" font-size="10.5" fill="#5a6b7b">CL1</text>
  <!-- CL2 -->
  <line x1="510" y1="244" x2="510" y2="252" stroke="#1f2d3d" stroke-width="1.8"/>
  <line x1="502" y1="252" x2="518" y2="252" stroke="#1f2d3d" stroke-width="2.6"/>
  <line x1="502" y1="258" x2="518" y2="258" stroke="#1f2d3d" stroke-width="2.6"/>
  <line x1="510" y1="258" x2="510" y2="268" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="524" y="260" font-size="10.5" fill="#5a6b7b">CL2</text>

  <!-- 地总线 → MCU GND -->
  <line x1="450" y1="268" x2="620" y2="268" stroke="#1f2d3d" stroke-width="2.2"/>
  <line x1="620" y1="268" x2="620" y2="320" stroke="#1f2d3d" stroke-width="2.2"/>
  <g stroke="#1f2d3d" stroke-width="1.8">
    <line x1="442" y1="274" x2="458" y2="274"/><line x1="445" y1="278" x2="455" y2="278"/><line x1="448" y1="282" x2="452" y2="282"/>
  </g>

  <text x="539" y="310" text-anchor="middle" font-size="11" fill="#27ae60">地包围 + 就近地过孔</text>

  <text x="612" y="446" text-anchor="middle" font-size="12" fill="#1f2d3d">位置对称、走线等长且最短，负载电容就近接地</text>
  <text x="612" y="466" text-anchor="middle" font-size="12" fill="#5a6b7b">振荡电路属射频敏感电路，地线以最短路径回到芯片地</text>
</svg>
