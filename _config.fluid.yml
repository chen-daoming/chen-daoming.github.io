# ==================== 顶部导航栏 ====================
navbar:
  title: Novice learning
  menu:
    - { key: 'home', link: '/', icon: 'icon-home-fill' }
    - { key: 'archive', link: '/archives/', icon: 'icon-archive-fill' }
    - { key: 'category', link: '/categories/', icon: 'icon-category-fill' }
    - { key: 'tag', link: '/tags/', icon: 'icon-tag-fill' }
    # 工具栏：下拉菜单，鼠标悬浮展开，内含多个在线工具
    - key: 'tools'
      name: '工具栏'
      icon: 'icon-code'
      submenu:
        - { key: 'crc', name: 'CRC 计算器', link: '/crc/' }
        - { key: 'ascii', name: 'ASCII 转换器', link: '/ascii/' }
        - { key: 'vdiv', name: '分压电阻计算器', link: '/vdiv/' }
        - { key: 'cap', name: '电容换算器', link: '/capacitance/' }
        - { key: 'battery', name: '电池续航计算器', link: '/battery/' }
        - { key: 'led', name: 'LED 串联电阻', link: '/led-resistor/' }
        - { key: 'base', name: '进制转换器', link: '/base-converter/' }
        - { key: 'pcb', name: 'PCB走线宽度', link: '/pcb-trace/' }
        - { key: 'dcdc', name: 'DC-DC升降压电感', link: '/dcdc-calculator/' }
        - { key: 'resistor-color', name: '电阻色环', link: '/resistor-color/' }
        - { key: 'opamp', name: '运放计算器', link: '/opamp/' }
        - { key: 'lc', name: 'LC谐振/滤波', link: '/lc/' }

        # 以后新增工具：- { key: 'xxx', name: '工具名', link: '/xxx/' }
    - { key: 'about', link: '/about/', icon: 'icon-info-circle-fill' }
# ==================== 首页 ====================
index:
  slogan:
    text: 嵌入式工程师的折腾记录
  post_list:
    date_format: 'YYYY-MM-DD'
# ==================== 文章页 ====================
post:
  meta:
    author:
      enable: false
    date:
      enable: true
      format: "LL a"
    wordcount:
      enable: true
    min2read:
      enable: true
      awl: 2
      wpm: 60
    views:
      enable: true
      source: "busuanzi"
  highlight:
    theme: github
    dark_theme: github-dark
  toc:
    enable: true
    expand: false
  copyright:
    enable: true
    content: '本文采用 CC BY-NC-SA 4.0 协议，转载请注明出处。'
  comments:
    enable: true
    type: gitalk
# ==================== 本地搜索 ====================
search:
  enable: true
  path: /search.json
  field: post
  content: true
# ==================== 自定义资源 ====================
# 加载自定义 CSS（导航栏下拉菜单悬浮展开样式，文件位于 source/css/custom.css）
custom_css:
  - /css/custom.css
